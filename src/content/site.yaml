  # Short third-person bio for press, partners and programs (Appendix A).
  bio: >-
    Vanessa Espín is a designer and producer in New York. In 2026 she produced
    Iyuana: El Retorno de los Sueños, a film and photography exhibition about the
    Sápara Nation of the Ecuadorian Amazon; curated Herencia Viva: Threads of Memory,
    painter Luis Medina’s exhibition of Ecuadorian magic realism, at three venues
    including Flushing Town Hall; and planned Ayazamana, a night of live music and
    traditional dance, with the Ecuadorian American Cultural Center, where she was
    Creative & Community Coordinator. She previously spent four years at the digital
    commerce agency Flywheel, art-directing ecommerce for health, beauty and consumer
    brands. She studied Communication Design at City Tech, CUNY.

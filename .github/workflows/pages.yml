# Publishes the site to GitHub Pages on every push to main. Everything is static, so there is no build step.
#   /   prototype/site-v3: the landing, the three event films and their media strips
# The earlier prototype (prototype/printed-matter) is no longer published; it holds experiments that were not meant to ship.
# prototype/site-v3 is a generated copy. Its paths carry this repository's Pages base path
# (/Vanessa-Espin-website); for a site at a domain's root it has to be generated again without it.
# The Astro site in src/ is not deployed here for now. To publish it again, restore
# the build steps from commit b476bd8 (npm ci, then npm run build:showcase with
# SITE_URL and BASE_PATH from configure-pages, then upload dist).
# One-time setup: repository Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -R prototype/site-v3/. _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

# Publishes the "printed matter" prototype (prototype/printed-matter) to GitHub Pages
# on every push to main. It is static, so there is no build step.
# The Astro site in src/ is not deployed here for now. To publish it again, restore
# the build steps from commit b476bd8 (npm ci, then npm run build:showcase with
# SITE_URL and BASE_PATH from configure-pages, then upload dist).
# One-time setup: repository Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: prototype/printed-matter

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

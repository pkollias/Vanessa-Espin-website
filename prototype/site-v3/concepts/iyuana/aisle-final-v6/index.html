<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Iyuana — El Retorno de los Sueños (Movie)</title>
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=gambetta@300,400&f[]=switzer@400,500&display=swap">
<style>
  :root {
    --paper: #ece4d7;
    --soft: rgba(236, 228, 215, 0.72);
    --faint: rgba(236, 228, 215, 0.42);
    --amber: #f6a035;
    --night: #070605;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: var(--night); }
  body {
    margin: 0; color: var(--paper);
    font-family: Switzer, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    font-feature-settings: "kern", "liga";
  }
  #gl { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100lvh; display: block; z-index: 0; cursor: pointer; }
  .ui { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
  .ui > * { position: absolute; will-change: opacity, transform; }

  /* Centered opening lockup extracted 1:1 from Vanessa's Poster 1 */
  .intro-lockup {
    left: 50%; top: 50%;
    width: min(72vw, 540px);
    transform: translate3d(-50%, -50%, 0);
    display: flex; flex-direction: column; align-items: center;
    filter: drop-shadow(0 8px 28px rgba(4, 5, 3, 0.88));
    opacity: 1;
  }
  .intro-lockup::before {
    content: "";
    position: absolute;
    inset: -32% -24%;
    background: radial-gradient(ellipse 68% 64% at 50% 50%, rgba(7, 8, 6, 0.64) 0%, rgba(7, 8, 6, 0.28) 58%, rgba(7, 8, 6, 0) 100%);
    opacity: var(--scrim-op, 0);
    z-index: -1;
    pointer-events: none;
  }
  .intro-lockup img {
    width: 100%; height: auto; display: block;
    will-change: opacity, transform, filter;
    opacity: 0;
  }
  .intro-lockup .tl-2 { margin-top: 2.0%; }
  .intro-lockup .tl-3 { margin-top: 1.4%; }

  /* Running head hidden so top navigation and controls never overlap */
  .head { display: none !important; }

  /* Hand-crafted organic sumi-watercolour & mist wash (sumi wash):
     zero rigid borders, ~74% translucent cold-press textured ink core, ragged feathered edges & soft shadow */
  .stop-line, .label {
    opacity: 0;
    isolation: isolate;
  }
  .stop-line::before, .label::before {
    content: "";
    position: absolute;
    inset: -44% -40%;
    z-index: -2;
    pointer-events: none;
    backdrop-filter: blur(10px) brightness(0.64) saturate(0.95);
    -webkit-backdrop-filter: blur(10px) brightness(0.64) saturate(0.95);
    -webkit-mask-image: var(--wash-mask);
    mask-image: var(--wash-mask);
    -webkit-mask-size: 100% 100%;
    mask-size: 100% 100%;
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
  }
  .stop-line::after, .label::after {
    content: "";
    position: absolute;
    inset: -48% -44%;
    z-index: -1;
    pointer-events: none;
    background-image: var(--wash-ink);
    background-size: 100% 100%;
    background-repeat: no-repeat;
    filter: drop-shadow(0 14px 32px rgba(4, 3, 2, 0.58));
  }

  /* Panel narrative captions (angled into the 3D plane of each panel on desktop; centered below on mobile) */
  .stop-line {
    margin: 0;
    width: max-content;
    max-width: min(25vw, 326px);
    padding: 8px 10px;
  }
  .stop-line p {
    margin: 0;
    font-family: Gambetta, Georgia, serif;
    font-weight: 400;
    font-size: clamp(20.5px, 1.68vw, 26px);
    line-height: 1.30;
    letter-spacing: -0.004em;
    color: #f7f1e6;
    text-shadow: 0 1px 3px rgba(4, 3, 2, 0.95), 0 5px 18px rgba(5, 4, 3, 0.88), 0 14px 34px rgba(6, 5, 4, 0.72);
    text-wrap: balance;
  }

  /* Main Poster curatorial credits: Vanessa Espín + 4 roles */
  .label {
    width: max-content;
    max-width: min(24vw, 290px);
    padding: 10px 12px;
  }
  .label .t {
    margin: 0 0 10px;
    font-family: Gambetta, Georgia, serif;
    font-weight: 400;
    font-size: clamp(26px, 2.2vw, 34px);
    line-height: 1.06;
    letter-spacing: -0.012em;
    color: #f7f1e6;
    text-shadow: 0 1px 3px rgba(4, 3, 2, 0.95), 0 5px 18px rgba(5, 4, 3, 0.88), 0 14px 34px rgba(6, 5, 4, 0.72);
  }
  .label .ink-rule {
    display: block;
    width: 100%;
    height: 1px;
    margin: 0 0 9px;
    background: linear-gradient(90deg, rgba(246, 160, 53, 0.78) 0%, rgba(236, 228, 215, 0.24) 58%, rgba(236, 228, 215, 0) 100%);
  }
  .label ul {
    list-style: none; margin: 0; padding: 0;
    font-size: clamp(13px, 1.0vw, 14.5px);
    line-height: 1.80;
    letter-spacing: 0.035em;
    color: rgba(247, 241, 230, 0.90);
    text-shadow: 0 1px 3px rgba(4, 3, 2, 0.95), 0 4px 14px rgba(5, 4, 3, 0.85);
  }
  .label ul li::before {
    content: "• ";
    color: var(--amber);
    opacity: 0.95;
    margin-right: 3px;
  }

  /* Subtle room grain */
  .grain { position: fixed; left: -50%; top: -50%; width: 200%; height: 200%; pointer-events: none; z-index: 5; opacity: 0.055; mix-blend-mode: overlay; background-repeat: repeat; }
  .grain.shade { opacity: 0.018; mix-blend-mode: screen; }
  body.embed .cinema-pill, body.embed .prog-bar, body.embed .tap-state, body.in-fold-stage .prog-bar, body.in-fold-stage .tap-state { display: none !important; }

  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .fallback { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; gap: 48px; padding: 24px; }
  .fallback img { width: min(60vw, 420px); height: auto; }
  body.nogl .fallback { display: flex; }

  /* Cinema playback pill & scrub bar */
  .cinema-pill {
    position: fixed; top: 20px; right: 20px; z-index: 12;
    display: flex; align-items: center; gap: 6px; padding: 5px 8px;
    background: rgba(12, 10, 9, 0.62); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(236, 228, 215, 0.14); border-radius: 999px;
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    transition: opacity 0.25s ease;
  }
  .cinema-pill button {
    appearance: none; border: 0; background: transparent; color: var(--soft);
    font: inherit; letter-spacing: inherit; text-transform: inherit;
    padding: 5px 10px; border-radius: 999px; cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .cinema-pill button:hover, .cinema-pill a:hover { color: var(--paper); background: rgba(236, 228, 215, 0.08); }
  .cinema-pill button.active { background: var(--paper); color: var(--night); font-weight: 500; }
  .cinema-pill select {
    appearance: none; -webkit-appearance: none; border: 1px solid rgba(236, 228, 215, 0.22);
    background: rgba(20, 18, 16, 0.85); color: var(--paper); font: inherit; font-size: 10.5px;
    letter-spacing: 0.04em; text-transform: none; padding: 4px 9px; border-radius: 999px; cursor: pointer;
  }
  .cinema-pill a {
    color: var(--soft); text-decoration: none; padding: 5px 9px; border-radius: 999px;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .cinema-pill .sep { width: 1px; height: 14px; background: rgba(236, 228, 215, 0.16); margin: 0 2px; }
  .cinema-pill .time-lbl { color: var(--soft); font-variant-numeric: tabular-nums; padding: 0 6px; font-size: 10.5px; letter-spacing: 0.06em; }
  body.clean .cinema-pill { display: none; }

  .visitor-sound {
    position: fixed; bottom: 22px; right: 22px; z-index: 12;
    appearance: none; border: 1px solid rgba(236, 228, 215, 0.20);
    background: rgba(12, 10, 9, 0.56); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    color: var(--soft); font: 500 11.5px/1 Switzer, "Helvetica Neue", Arial, sans-serif;
    letter-spacing: 0.04em; padding: 8px 14px; border-radius: 999px; cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }
  .visitor-sound:hover { color: var(--paper); border-color: rgba(236, 228, 215, 0.45); }
  .visitor-sound.active { color: var(--paper); }
  body.embed .visitor-sound { display: none !important; }

  .prog-bar {
    position: fixed; left: 0; right: 0; bottom: 0; height: 24px; z-index: 10;
    cursor: pointer; display: flex; align-items: flex-end; touch-action: none;
  }
  .prog-track {
    position: relative; width: 100%; height: 3px;
    background: rgba(236, 228, 215, 0.22);
    transition: height 0.18s ease, background 0.18s ease;
  }
  .prog-bar:hover .prog-track { height: 6px; background: rgba(236, 228, 215, 0.30); }
  .prog-fill {
    position: relative; height: 100%; width: 0%;
    background: linear-gradient(90deg, rgba(246, 160, 53, 0.92) 0%, rgba(244, 237, 226, 0.96) 100%);
  }
  .prog-fill::after {
    content: ""; position: absolute; right: -5px; top: 50%;
    width: 10px; height: 10px; border-radius: 50%;
    background: #f7f1e6; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.65);
    transform: translateY(-50%) scale(0);
    transition: transform 0.16s ease;
  }
  .prog-bar:hover .prog-fill::after { transform: translateY(-50%) scale(1); }
  .prog-tip {
    position: absolute; bottom: 12px; left: 0; transform: translateX(-50%);
    padding: 3px 8px; border-radius: 999px; pointer-events: none;
    background: rgba(12, 10, 9, 0.86); border: 1px solid rgba(236, 228, 215, 0.24);
    color: var(--paper); font-size: 10.5px; font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em; opacity: 0; transition: opacity 0.15s ease;
  }
  .prog-bar:hover .prog-tip { opacity: 1; }

  /* Subtle center Pause / Resume pill when clicked or paused via Space in standalone view */
  .tap-state {
    position: fixed; left: 50%; top: 50%; z-index: 11;
    transform: translate(-50%, -50%) scale(0.94);
    width: 56px; height: 56px; border-radius: 50%;
    border: 1px solid rgba(236, 228, 215, 0.28);
    background: rgba(12, 10, 9, 0.62);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    color: var(--paper); display: grid; place-items: center;
    opacity: 0; pointer-events: none;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.38);
    transition: opacity 0.22s ease, transform 0.22s ease;
  }
  .tap-state svg { width: 18px; height: 18px; fill: currentColor; }
  .tap-state.is-paused { opacity: 0.86; transform: translate(-50%, -50%) scale(1); }
  .tap-state.is-flash { opacity: 0.82; transform: translate(-50%, -50%) scale(1.05); }

  @media (max-aspect-ratio: 1/1) {
    .cinema-pill { top: 14px; right: 14px; }
    .head { top: 18px; left: 16px; }
    .head .s { display: none; }
    .intro-lockup { width: min(86vw, 345px); }
    .stop-line {
      width: max-content;
      max-width: calc(100vw - 44px);
      left: 50%; right: auto;
      bottom: clamp(50px, 9vh, 88px);
      padding: 6px 10px;
      text-align: center;
    }
    .stop-line p { font-size: clamp(19px, 5.0vw, 22.5px); }
    .label {
      width: max-content;
      max-width: calc(100vw - 40px);
      left: 50%; right: auto;
      bottom: clamp(40px, 7vh, 76px);
      padding: 8px 12px;
      text-align: center;
    }
    .label .t { font-size: clamp(23px, 6vw, 28px); margin-bottom: 7px; }
    .label .ink-rule {
      background: linear-gradient(90deg, rgba(236, 228, 215, 0) 0%, rgba(246, 160, 53, 0.72) 50%, rgba(236, 228, 215, 0) 100%);
      margin-bottom: 8px;
    }
    .label ul {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 14px;
      font-size: 12.5px; line-height: 1.65;
    }
  }
</style>
<style>.cinema-pill, .review-pill, #hud, #hudMin, .text-studio, .cue-lanes { visibility: hidden !important; pointer-events: none !important; }</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>

<main class="ui">
  <section class="intro-lockup" id="intro" aria-label="Film & Photography Exhibition: Iyuana, El Retorno de los Sueños">
    <img class="tl-1" id="tl-1" src="../assets/title/title-1-kicker.png" alt="Film & Photography Exhibition">
    <img class="tl-2" id="tl-2" src="../assets/title/title-2-iyuana.png" alt="Iyuana">
    <img class="tl-3" id="tl-3" src="../assets/title/title-3-sub.png" alt="El Retorno de los Sueños">
  </section>

  <div class="head" id="head"><span class="t">Iyuana</span><span class="s">El Retorno de los Sueños</span></div>

  <div class="stop-line" id="stop-line"><p id="stop-line-p"></p></div>

  <section class="label" id="label">
    <p class="t">Vanessa Espín</p>
    <span class="ink-rule" aria-hidden="true"></span>
    <ul>
      <li>Creative Direction</li>
      <li>Event Planning</li>
      <li>Art Curation</li>
      <li>Production</li>
    </ul>
  </section>
  <p class="vh" aria-live="polite" id="live"></p>
</main>

<div class="grain shade" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<div class="fallback">
  <img src="../assets/poster-1.png" alt="Iyuana, El Retorno de los Sueños: the exhibition poster">
</div>

<div class="cinema-pill" id="cinema-pill">
  <button id="btn-play" class="active" title="Play / Pause (Space)">Pause</button>
  <button id="btn-replay" title="Replay from beginning (R)">&#8634; Replay</button>
  <span class="sep"></span>
  <button id="btn-sound" class="active" title="Toggle Ambient Soundscape (M)">&#9834; Sound</button>
  <select id="sound-sel" title="Ambient Soundscape"></select>
  <span class="sep"></span>
  <select id="traj-sel" title="Camera Trajectory"></select>
  <a href="../trajectories/" title="Open White 3D Trajectory & Timing Lab">3D &amp; Timing Lab</a>
  <span class="sep"></span>
  <span class="time-lbl" id="time-lbl">0.0s / 33.0s</span>
</div>
<button class="visitor-sound" id="visitor-sound" type="button" hidden title="Toggle Exhibition Soundscape (M)">&#9834; Sound</button>
<div class="tap-state" id="tap-state" aria-hidden="true"><svg id="tap-icon" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg></div>
<div class="prog-bar" id="prog-bar" title="Click or drag to navigate video"><span class="prog-tip" id="prog-tip">0:00</span><div class="prog-track"><div class="prog-fill" id="prog-fill"></div></div></div>

</body>

      }
    }));
  }

  function drawLivingPaintingFrame(ls, frameIdx) {
    if (!ls || !ls.ready || !ls.subMesh) return;
    if (frameIdx < 0) {
      ls.subMesh.visible = false;
      ls.drawnFrame = -1;
      return;
    }
    ls.subMesh.visible = true;
    if (ls.drawnFrame === frameIdx) return;
    ls.drawnFrame = frameIdx;
    ls.cellUniform.set(frameIdx % 6, Math.floor(frameIdx / 6));
  }

  const platesReadyPromise = Promise.all([initWomenPlates(), initLivingPaintings()]);

  /* =========================================================================
   * 10. 7-BIRD r10v2 .GLB FLOCK (1.35x DEFAULT, STRICT ZERO OVERLAP >= 1.86m!)
   * ========================================================================= */
  const BIRD_V = 3.45;
  const BIRD_SPECS = [
    { sp: 'dove',    patchBit: 1, t0: 0.50, s0: 18.45, x0: -0.82, y0: 1.52, xLane: -0.18, yArch: 2.42, yHall: 2.12, sz: 1.04, flaps: [[0.50, 1.35], [4.40, 5.15]] },
    { sp: 'pigeon',  patchBit: 0, t0: 1.28, s0: 17.55, x0:  0.72, y0: 2.08, xLane:  0.66, yArch: 2.52, yHall: 2.44, sz: 1.04, flaps: [[1.28, 2.05], [5.10, 5.80]] },
    { sp: 'dove',    patchBit: 2, t0: 1.68, s0: 18.08, x0: -0.82, y0: 1.42, xLane: -0.78, yArch: 1.74, yHall: 1.58, sz: 1.00, flaps: [[1.68, 2.45], [5.55, 6.25]] },
    { sp: 'pigeon',  patchBit: 0, t0: 2.58, s0: 16.85, x0:  0.68, y0: 1.48, xLane: -0.06, yArch: 1.56, yHall: 1.46, sz: 1.02, flaps: [[2.58, 3.35], [6.20, 6.85]] },
    { sp: 'dove',    patchBit: 4, t0: 2.74, s0: 18.22, x0: -0.82, y0: 1.78, xLane: -0.38, yArch: 2.76, yHall: 2.72, sz: 0.98, flaps: [[2.74, 3.55], [6.55, 7.20]] },
    { sp: 'sparrow', patchBit: 0, t0: 4.06, s0: 15.60, x0:  1.06, y0: 2.24, xLane:  0.86, yArch: 2.68, yHall: 2.66, sz: 1.08, flaps: [[4.06, 4.75], [7.15, 7.75]] },
    { sp: 'pigeon',  patchBit: 0, t0: 5.35, s0: 13.08, x0:  1.24, y0: 1.18, xLane: -0.52, yArch: 1.96, yHall: 1.96, sz: 1.03, flaps: [[5.35, 6.15], [8.10, 8.70]] },
  ];

  function evalBirdBaseSXY(b, tFlight) {
    const dt = tFlight - b.t0;
    const s = b.s0 - (BIRD_V * dt - 0.22 * (1.0 - Math.exp(-dt / 0.28)));
    const join = sm3(dt / 1.05);
    const archBell = Math.exp(-(((s - 15.2) / 3.4) ** 2));
    let x = b.x0 + (b.xLane - b.x0) * join + 0.06 * Math.sin(dt * 1.4 + b.t0 * 2.1) * join;
    const yTarget = b.yHall + (b.yArch - b.yHall) * archBell;
    const y = b.y0 + (yTarget - b.y0) * join + 0.02 * Math.sin(dt * 1.9 + b.t0);
    if (s > 16.9) {
      const vBlend = sm3((s - 16.9) / 0.7);
      x = x * (1.0 - vBlend) + clamp(x, -0.78, 0.78) * vBlend;
    }
    return [s, x, y];
  }

  function evalFlockPositionsAt(tFlight) {
    const active = [];
    for (let i = 0; i < BIRD_SPECS.length; i++) {
      const b = BIRD_SPECS[i];
      if (tFlight >= b.t0) {
        const [s, x, y] = evalBirdBaseSXY(b, tFlight);
        if (s >= -7.5) active.push({ idx: i, s, x, y });
      }
    }
    const R_REP = 1.85;
    for (let iter = 0; iter < 3; iter++) {
      for (let a = 0; a < active.length; a++) {
        for (let c = a + 1; c < active.length; c++) {
          const A = active[a], B = active[c];
          const ds = A.s - B.s, dx = A.x - B.x, dy = A.y - B.y;
          const d = Math.hypot(ds, dx, dy) + 1e-6;
          if (d < R_REP) {
            const push = 0.52 * (R_REP - d) * sm3((R_REP - d) / R_REP + 0.35);
            A.s += (ds / d) * push * 0.65;
            B.s -= (ds / d) * push * 0.65;
            A.x = clamp(A.x + (dx / d) * push * 0.85, -1.12, 1.12);
            B.x = clamp(B.x - (dx / d) * push * 0.85, -1.12, 1.12);
            A.y = clamp(A.y + (dy / d) * push * 0.85,  1.18, 3.15);
            B.y = clamp(B.y - (dy / d) * push * 0.85,  1.18, 3.15);
          }
        }
      }
    }
    return active;
  }

  function evalFlapWeight(tFlight, flapWindows) {
    let w = 0.0;
    for (const [t0, t1] of flapWindows) {
      if (tFlight >= t0 - 0.30 && tFlight <= t1 + 0.40) {
        const fi = sm3(ramp(tFlight, t0 - 0.30, t0 + 0.18));
        const fo = 1.0 - sm3(ramp(tFlight, t1 - 0.18, t1 + 0.40));
        w = Math.max(w, fi * fo);
      }
    }
    return w;
  }

  const flockGroup = new THREE.Group();
  scene.add(flockGroup);
  const birdRigs = [];
  let birdsLoaded = false;

  function findAnimClip(animations, candidates) {
    for (const name of candidates) {
      const f = animations.find(a => a.name === name);
      if (f) return f;
    }
    return animations[0] || null;
  }

  function buildMixerRig(gltf) {
    const clone = SkeletonUtils.clone(gltf.scene);
    clone.traverse(o => {
      if (o.isLine || o.isPoints || o.type === 'Line' || o.type === 'LineSegments' || o.type === 'Points') {
        o.visible = false;
        return;
      }
      if (o.isMesh && o.material) {
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        for (const m of mats) {
          if (m.alphaTest > 0) m.alphaTest = Math.max(m.alphaTest, 0.56);
          if (m.map) {
            m.map.wrapS = THREE.ClampToEdgeWrapping;
            m.map.wrapT = THREE.ClampToEdgeWrapping;
            m.map.anisotropy = maxAniso;
            m.map.needsUpdate = true;
          }
          if (m.normalMap) {
            m.normalMap.wrapS = THREE.ClampToEdgeWrapping;
            m.normalMap.wrapT = THREE.ClampToEdgeWrapping;
            m.map.anisotropy = maxAniso;
            m.normalMap.needsUpdate = true;
          }
          if (m.isMeshStandardMaterial) m.envMapIntensity = 0.15;
        }
      }
    });
    const mixer = new THREE.AnimationMixer(clone);
    const cFlap  = findAnimClip(gltf.animations, ['wingbeat', 'flap']);
    const cGlide = findAnimClip(gltf.animations, ['glide', 'flap_glide', 'flap']);
    const cBankL = findAnimClip(gltf.animations, ['bank-left', 'bank_left']);
    const cBankR = findAnimClip(gltf.animations, ['bank-right', 'bank_right']);

    const actFlap  = cFlap ? mixer.clipAction(cFlap) : null;
    const actGlide = (cGlide && cGlide !== cFlap) ? mixer.clipAction(cGlide) : null;
    const actBankL = (cBankL && cBankL !== cGlide && cBankL !== cFlap) ? mixer.clipAction(cBankL) : null;
    const actBankR = (cBankR && cBankR !== cGlide && cBankR !== cFlap) ? mixer.clipAction(cBankR) : null;

    [actFlap, actGlide, actBankL, actBankR].forEach(a => { if (a) { a.play(); a.setEffectiveWeight(0); } });
    if (actGlide) actGlide.setEffectiveWeight(1);
    else if (actFlap) actFlap.setEffectiveWeight(1);

    return { clone, mixer, actFlap, actGlide, actBankL, actBankR };
  }

  async function init3DBirds() {
    try {
      const loadGltf = url => new Promise((res, rej) => gltfLoader.load(url, res, undefined, rej));
      const [dove0, pigeon0, sparrow0] = await Promise.all([
        loadGltf(`${MODEL_BASE}/dove_r10_impasto.glb`),
        loadGltf(`${MODEL_BASE}/pigeon_r10_impasto.glb`),
        loadGltf(`${MODEL_BASE}/sparrow_r10_impasto.glb`),
      ]);
      const [dove1, pigeon1, sparrow1] = USE_OPT_WEIGHT
        ? [dove0, pigeon0, sparrow0]
        : await Promise.all([
            loadGltf(`${MODEL_BASE}/dove_r10_lod1.glb`),
            loadGltf(`${MODEL_BASE}/pigeon_r10_lod1.glb`),
            loadGltf(`${MODEL_BASE}/sparrow_r10_lod1.glb`),
          ]);
      const lod0Map = { dove: dove0, pigeon: pigeon0, sparrow: sparrow0 };
      const lod1Map = { dove: dove1, pigeon: pigeon1, sparrow: sparrow1 };

      for (let i = 0; i < BIRD_SPECS.length; i++) {
        const spec = BIRD_SPECS[i];
        const rig0 = buildMixerRig(lod0Map[spec.sp]);
        const rig1 = buildMixerRig(lod1Map[spec.sp]);
        rig1.clone.visible = false;

        const carrier = new THREE.Group();
        const bankNode = new THREE.Group();
        bankNode.add(rig0.clone, rig1.clone);
        carrier.add(bankNode);
        carrier.visible = false;
        flockGroup.add(carrier);

        birdRigs.push({
          idx: i,
          spec,
          carrier,
          bankNode,
          rig0,
          rig1,
          phaseOff: i * 0.47,
          rate: spec.sp === 'sparrow' ? 0.90 : (spec.sp === 'dove' ? 0.82 : 0.80),
        });
      }
      birdsLoaded = true;
    } catch (e) {
      console.error('Failed to load .glb birds:', e);
    }
  }
  const birdsReadyPromise = (QS.get('birds') === '1')
    ? init3DBirds()
    : Promise.resolve().then(() => { birdsLoaded = true; return true; });

  /* =========================================================================
   * 11. PURE MOVIE PLAYBACK STATE, 12FPS EYES/LIVING ART & RENDER EVALUATION
   * ========================================================================= */
  const SPLASH_MEDIUM_SPECS = {
    '2':  { url: './look/medina_brush_512.webp',  params: [0.66, 1.08, 1.20, 0.0] },
    '3a': { url: './look/gemini_medium_3a.webp',  params: [0.54, 1.14, 0.95, 0.0] },
    '3b': { url: './look/gemini_medium_3b.webp',  params: [0.58, 1.18, 1.28, 1.0] },
    '3c': { url: './look/gemini_medium_3c.webp',  params: [0.62, 1.06, 1.60, 0.0] },
    '3d': { url: './look/gemini_medium_3d.webp',  params: [0.52, 1.10, 1.08, 0.0] },
  };
  const splashTexCache = new Map();

  function loadSplashMediumKey(key) {
    const spec = SPLASH_MEDIUM_SPECS[key];
    if (!spec) return Promise.resolve(null);
    if (splashTexCache.has(key)) return Promise.resolve(splashTexCache.get(key));
    return loadShaderWebP(spec.url).then(tex => {
      splashTexCache.set(key, tex);
      if (STATE.splashKey === key) {
        SHARED_UNIFORMS.uSplashMedium.value = tex;
        markFreezeDirty(5);
      }
      return tex;
    }).catch(() => null);
  }

  const initT = parseFloat(QS.get('t') || '0');
  const STATE = {
    t: initT,
    speed: parseFloat(QS.get('speed') || '1.0'),
    playing: QS.get('paused') !== '1' && QS.get('freeze') !== '1',
    scrubbing: false,
    birdsEnabled: QS.get('birds') === '1',
    birdScale: parseFloat(QS.get('bird_scale') || '1.35'),
    floorSpread: parseFloat(QS.get('floor_spread') ?? '0.00'),
    texStrength: parseFloat(QS.get('texture') ?? '1.04'),
    clarityStrength: parseFloat(QS.get('clarity') ?? '0.78'),
    paintSat: clamp(parseFloat(QS.get('sat') ?? '0.52'), 0.15, 1.10),
    ceilingPaint: clamp(parseFloat(QS.get('ceiling') ?? '0.00'), 0.0, 1.0),
    paintSpeed: clamp(parseFloat(QS.get('paint_speed') ?? '1.72'), 0.5, 3.5),
    paintMode: QS.get('paint') === 'multizone' ? 1 : 0,
    sunStyle: parseInt(QS.get('style') || '4', 10),
    shadowMode: clamp(parseInt(QS.get('shadow') ?? '2', 10), 0, 2),
    landingMode: clamp(parseInt(QS.get('landing') ?? '4', 10), 0, 4),
    splashKey: String(QS.get('splash') ?? '2').toLowerCase(),
    floorMode: clamp(parseInt(QS.get('floor') ?? '1', 10), 0, 1),
    windowMode: clamp(parseInt(QS.get('window') ?? '1', 10), 0, 1),
    monotonicFrontS: 21.6,
    fps: 60.0,
    activeBirds: [],
  };

  function applyDrop1LookState() {
    SHARED_UNIFORMS.uShadowMode.value = STATE.shadowMode;
    for (const q of frameShadowQuads) q.visible = (STATE.shadowMode === 0);
    // Lower un-occluded DirectionalLight when shadowMode > 0 because props now receive true window-traced Komorebi sun!
    hemiLight.intensity = STATE.shadowMode > 0 ? 0.58 : 1.38;
    sunKeyLight.intensity = STATE.shadowMode > 0 ? 0.65 : 1.65;
    floorBounceLight.intensity = STATE.shadowMode > 0 ? 0.34 : 0.72;

    SHARED_UNIFORMS.uLandingMode.value = STATE.landingMode;
    SHARED_UNIFORMS.uFloorMode.value   = STATE.floorMode;
    SHARED_UNIFORMS.uWindowMode.value  = STATE.windowMode;

    const sk = STATE.splashKey;
    if (sk === '0' || !sk) {
      SHARED_UNIFORMS.uSplashMode.value = 0;
    } else if (sk === '1') {
      SHARED_UNIFORMS.uSplashMode.value = 1;
      SHARED_UNIFORMS.uSplashParams.value.set(0.58, 1.0, 1.0, 0.0);
    } else if (SPLASH_MEDIUM_SPECS[sk]) {
      const spec = SPLASH_MEDIUM_SPECS[sk];
      SHARED_UNIFORMS.uSplashMode.value = 2;
      SHARED_UNIFORMS.uSplashParams.value.set(spec.params[0], spec.params[1], spec.params[2], spec.params[3]);
      if (splashTexCache.has(sk)) {
        SHARED_UNIFORMS.uSplashMedium.value = splashTexCache.get(sk);
      } else {
        loadSplashMediumKey(sk);
      }
    } else {
      SHARED_UNIFORMS.uSplashMode.value = 0;
    }
    markFreezeDirty(3);
  }

  SHARED_UNIFORMS.uFloorSpread.value = STATE.floorSpread;
  SHARED_UNIFORMS.uTexStrength.value = STATE.texStrength;
  SHARED_UNIFORMS.uClarityStrength.value = STATE.clarityStrength;
  SHARED_UNIFORMS.uPaintSat.value = STATE.paintSat;
  SHARED_UNIFORMS.uCeilingPaint.value = STATE.ceilingPaint;
  SHARED_UNIFORMS.uPaintMode.value = STATE.paintMode;
  SHARED_UNIFORMS.uStyle.value = STATE.sunStyle;
  applyDrop1LookState();

  const EYESEQ = {
    turnWindow: {
      '010': [T_EYES_START, +(T_EYES_START + 0.82).toFixed(3)],
      '003': [+(T_EYES_START + 0.42).toFixed(3), T_EYES_DONE],
    },
    fps: 12,
    blink: { '003': 1, '010': 2 },
    lid: [5, 6, 6, 5],
    restAfterBlink: 1.90,
  };

  function evalEyeDrawingAtMovieTime(id, t) {
    if (t < T_EYES_START) return 0;
    if (t < T_BLINK_START) {
      const [ta, tb] = EYESEQ.turnWindow[id];
      const u = ramp(t, ta, tb);
      const q = Math.floor(u * 4 + 1e-5);
      return clamp(u >= 0.999 ? 4 : q, 0, 4);
    }
    const tFlight = (t - T_BLINK_START) * FLIGHT7_PACE;
    if (tFlight >= EYESEQ.restAfterBlink) return 0;
    const fr = Math.floor(tFlight * EYESEQ.fps + 1e-6) - EYESEQ.blink[id];
    return (fr >= 0 && fr < EYESEQ.lid.length) ? EYESEQ.lid[fr] : 4;
  }

  function targetPaintFrontForMovieTime(t) {
    const tStart = STATE.birdsEnabled ? T_RELEASE : T_BLINK_START;
    if (t <= tStart) return 21.6;
    const dtVirtual = (t - tStart) * FLIGHT7_PACE;
    const startS = STATE.birdsEnabled ? 20.72 : 19.60;
    const rate = 3.32 * (STATE.birdsEnabled ? 1.0 : STATE.paintSpeed);
    return Math.max(-2.4, startS - rate * dtVirtual);
  }

  const _v0 = new THREE.Vector3();
  const _v1 = new THREE.Vector3();

  function updateBirdsAtMovieTime(t) {
    if (!STATE.birdsEnabled || t < T_RELEASE) {
      for (const r of birdRigs) r.carrier.visible = false;
      STATE.activeBirds = [];
      return;
    }

    const tFlight = (t - T_BLINK_START) * FLIGHT7_PACE;
    const posNow  = evalFlockPositionsAt(tFlight);
    const posNext = evalFlockPositionsAt(tFlight + 0.05);
    const nextByIdx = new Map(posNext.map(p => [p.idx, p]));

    const activeSet = new Set();
    STATE.activeBirds = posNow;

    for (const p of posNow) {
      activeSet.add(p.idx);
      const r = birdRigs[p.idx];
      if (!r) continue;
      r.carrier.visible = true;

      const pn = nextByIdx.get(p.idx) || { s: p.s - 0.17, x: p.x, y: p.y };
      _v0.set(p.x, p.y, -p.s);
      _v1.set(pn.x, pn.y, -pn.s);

      r.carrier.position.copy(_v0);
      if (_v1.distanceToSquared(_v0) > 1e-7) {
        r.carrier.lookAt(_v1);
      }

      const bankDeg = clamp(-(pn.x - p.x) * 165.0, -26, 26);
      r.bankNode.rotation.set(0, 0, THREE.MathUtils.degToRad(bankDeg));

      const grow = sm3(ramp(tFlight, r.spec.t0, r.spec.t0 + 0.38));
      r.carrier.scale.setScalar((0.46 + 0.54 * grow) * r.spec.sz * STATE.birdScale);

      const distCam = _v0.distanceTo(camera.position);
      const useLod1 = distCam >= 9.0;
      r.rig0.clone.visible = !useLod1;
      r.rig1.clone.visible = useLod1;

      const wFlap = evalFlapWeight(tFlight, r.spec.flaps);
      const wGlideTotal = 1.0 - wFlap;
      const bankNorm = clamp(bankDeg / 26.0, -1, 1);
      const absBank = Math.min(0.60, Math.abs(bankNorm)) * wGlideTotal;
      const wPureGlide = Math.max(0.0, wGlideTotal - absBank);

      const animT = Math.max(0, (tFlight - r.spec.t0) * r.rate + r.phaseOff);
      const activeRig = useLod1 ? r.rig1 : r.rig0;
      if (activeRig.actFlap) activeRig.actFlap.setEffectiveWeight(wFlap);
      if (activeRig.actGlide) activeRig.actGlide.setEffectiveWeight(activeRig.actBankL ? wPureGlide : wGlideTotal);
      if (activeRig.actBankL) activeRig.actBankL.setEffectiveWeight(bankNorm < 0 ? absBank : 0);
      if (activeRig.actBankR) activeRig.actBankR.setEffectiveWeight(bankNorm > 0 ? absBank : 0);
      activeRig.mixer.setTime(animT);
    }

    for (const r of birdRigs) {
      if (!activeSet.has(r.idx)) r.carrier.visible = false;
    }
  }

  function evaluateAndRenderScene(animClockSec, livingClock = animClockSec) {
    const t = STATE.t;
    const c = phoneFraming(evalMovieCam(t), t);
    camera.fov = c.fov;
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    camera.position.set(c.x, c.h, -c.s);
    camera.rotation.set(
      THREE.MathUtils.degToRad(c.pitch),
      THREE.MathUtils.degToRad(-c.yaw),
      THREE.MathUtils.degToRad(-c.roll),
      'YXZ'
    );
    camera.updateMatrixWorld(true);

    // Keep easel hidden for t < 13.50s so Right-Wall Crab Walk is 100% unobstructed, then reveal while in vestibule!
    const showEasel = t >= T_EASEL_SHOW;
    easelGroup.visible = showEasel;
    easelFrontFill.visible = showEasel;
    SHARED_UNIFORMS.uStandMode.value = showEasel ? 1 : 0;

    const sun = evalSunAtMovieTime(t);
    const elRad = sun.elev * Math.PI / 180;
    const azRad = sun.az * Math.PI / 180;
    const lxSun = -Math.cos(elRad) * Math.sin(azRad);
    const lySun =  Math.sin(elRad);
    const lzSun =  Math.cos(elRad) * Math.cos(azRad);

    SHARED_UNIFORMS.uTime.value = animClockSec;
    SHARED_UNIFORMS.uSunDir.value.set(lxSun, lySun, lzSun);
    SHARED_UNIFORMS.uSunElevDeg.value = sun.elev;
    SHARED_UNIFORMS.uSunAzDeg.value = sun.az;

    const patch = computeSunPatchRadiosity(sun.elev, sun.az);
    SHARED_UNIFORMS.uPatchRange.value.set(patch[0], patch[1], patch[2], patch[3]);

    sunKeyLight.position.set(lxSun * 20, lySun * 20 + 2, -lzSun * 20 - 8);
    const warmFrac = 1.0 - sm3(ramp(sun.elev, 8.0, 26.0));
    sunKeyLight.color.setRGB(1.0, 0.96 - 0.09 * warmFrac, 0.90 - 0.20 * warmFrac);

    const landRamp = sm3(ramp(t, T_LANDING - 2.60, T_LANDING - 0.12));
    SHARED_UNIFORMS.uLandingRamp.value = landRamp;
    easelHeroSpot.visible = showEasel && (STATE.landingMode === 1 || STATE.landingMode === 4) && landRamp > 0.001;

    if (t < tPaintStart) {

    if (STATE.birdsEnabled && t >= T_RELEASE) {

  function tick(now) {
    if (document.hidden) { lastNow = now; requestAnimationFrame(tick); return; }
    // True 0% GPU idle when ?freeze=1 is active and current frozen frame has finished rendering!
    if (freezeLoop && startupReady && freezeFramesLeft <= 0) {
      lastNow = now;
      requestAnimationFrame(tick);
      return;
    }
    if (freezeLoop && freezeFramesLeft > 0) freezeFramesLeft--;

    const dtRaw = (now - lastNow) / 1000;
    lastNow = now;
    const dtClamped = Math.min(0.038, Math.max(0.0, dtRaw));
    dtSmooth += (dtClamped - dtSmooth) * 0.35;

    if (!freezeLoop && startupReady && STATE.playing && !STATE.scrubbing) {
      livingRealClockSec += dtSmooth * STATE.speed;
      if (STATE.t < TOTAL_SEC) {
        STATE.t = Math.min(TOTAL_SEC, STATE.t + dtSmooth * STATE.speed);
        calmHoldExtraSec = 0.0;
      } else {
        // Calm living hold on the Masterpiece Landing: camera & sun pose stay locked while Komorebi & paintings breathe!
        calmHoldExtraSec += dtSmooth;

    }

    const animClockSec = STATE.t + calmHoldExtraSec;
    const livingClock = freezeLoop ? animClockSec : Math.max(animClockSec, livingRealClockSec);
    const { sun } = evaluateAndRenderScene(animClockSec, livingClock);

      telemetryEl.textContent = `${STATE.fps.toFixed(0)} fps · ${pbrBadge}${modeBadge}`;
      fpsCount = 0;
      fpsAcc = 0;
    }

    requestAnimationFrame(tick);
  }

  // Analytical Right-Wall Direct Sun Audit Helper (`x = +1.42m, y in [0.15..1.85m]`) for `verify_and_storyboard.mjs` & `@verifier4`
  function sampleRightWallSunAt(t) {
    const sun = evalSunAtMovieTime(t);
    const elRad = sun.elev * Math.PI / 180;
    const azRad = sun.az * Math.PI / 180;
    const lx = -Math.cos(elRad) * Math.sin(azRad);
    const ly =  Math.sin(elRad);
    const lz =  Math.cos(elRad) * Math.cos(azRad);
    let litSamples = 0, eyeLitSamples = 0;
    let minLitS = 999, maxLitS = -999;
    const rightRake = (-lx > 0.03) ? 1.0 : 0.0;
    for (let s = 0.5; s <= 16.9; s += 0.25) {
      let sLit = false;
      for (const y of [0.20, 0.75, 1.25, 1.60, 2.05]) {
        const tWin = (20.72 - s) / lz;
        const tEffY = rightRake > 0.5 ? Math.min(tWin, 4.55 + s * 0.14) : tWin;
        const wx = 1.42 + lx * tWin, wy = y + ly * tEffY;
        const inWin = wy >= 0.78 && (wy <= 2.33 ? Math.abs(wx) <= 0.72 : Math.hypot(wx, wy - 2.33) <= 0.72);
        const tA1 = (17.00 - s) / lz;
        const tA1Y = rightRake > 0.5 ? Math.min(tA1, 3.6 + s * 0.10) : tA1;
        const ax = 1.42 + lx * tA1, ay = y + ly * tA1Y;
        const inArch = Math.abs(ax) <= 0.87 && ay <= 3.30;
        if (inWin && inArch && -lx > 0) {
          sLit = true;
          if (Math.abs(y - 1.60) < 0.05) eyeLitSamples++;
        }
      }
      if (sLit) {
        litSamples++;
        if (s < minLitS) minLitS = s;
        if (s > maxLitS) maxLitS = s;
      }
    }
    return {
      t: +t.toFixed(2),
      elev: +sun.elev.toFixed(3),
      az: +sun.az.toFixed(3),
      litMetersCorridorR: +(litSamples * 0.25).toFixed(2),
      eyeLevelLitMetersR: +(eyeLitSamples * 0.25).toFixed(2),
      sRangeR: litSamples > 0 ? [+minLitS.toFixed(2), +maxLitS.toFixed(2)] : null,
    };
  }

      STATE.scrubbing = true;
      STATE.t = clamp(t, 0, TOTAL_SEC);
      calmHoldExtraSec = 0.0;
      STATE.monotonicFrontS = targetPaintFrontForMovieTime(STATE.t);
      markFreezeDirty(3);
      const res = evaluateAndRenderScene(simOverride !== null ? simOverride : Math.max(0, STATE.t));
      updateHudLabels(res.sun);
      syncPlayButton();
      return res;
    },
    resumeLive: () => {
      freezeLoop = false;
      STATE.scrubbing = false;
      STATE.playing = true;
      lastNow = performance.now();
      syncPlayButton();
    },
    play: () => {
      freezeLoop = false;
      STATE.scrubbing = false;
      if (STATE.t >= TOTAL_SEC - 0.02) STATE.t = 0.0;
      STATE.playing = true;
      lastNow = performance.now();
      syncPlayButton();
    },
    pause: () => {
      STATE.playing = false;
      syncPlayButton();
    },
    setOptions: (opts = {}) => {
      if (opts.paintMode !== undefined) {
        STATE.paintMode = opts.paintMode === 'multizone' || opts.paintMode === 1 ? 1 : 0;
        SHARED_UNIFORMS.uPaintMode.value = STATE.paintMode;
      }
      if (opts.floorSpread !== undefined) {
        STATE.floorSpread = clamp(+opts.floorSpread, 0, 1);
        SHARED_UNIFORMS.uFloorSpread.value = STATE.floorSpread;
      }
      if (opts.texture !== undefined) {
        STATE.texStrength = clamp(+opts.texture, 0, 1.4);
        SHARED_UNIFORMS.uTexStrength.value = STATE.texStrength;
      }
      if (opts.clarity !== undefined) {
        STATE.clarityStrength = clamp(+opts.clarity, 0, 1.4);
        SHARED_UNIFORMS.uClarityStrength.value = STATE.clarityStrength;
      }
      if (opts.birdScale !== undefined) {
        STATE.birdScale = clamp(+opts.birdScale, 1.0, 1.8);
      }
      if (opts.sunStyle !== undefined) {
        STATE.sunStyle = clamp(parseInt(opts.sunStyle, 10), 1, 4);
        SHARED_UNIFORMS.uStyle.value = STATE.sunStyle;
      }
      if (opts.speed !== undefined) {
        STATE.speed = clamp(+opts.speed, 0.25, 2.5);
      }
      if (opts.hud !== undefined) {
        document.body.classList.toggle('hud-hidden', !opts.hud);
      }
      syncHudButtons();
      return evaluateAndRenderScene(STATE.t + calmHoldExtraSec);
    },
    auditBirdSeparation: () => {
      let minPairDist3D = 999.0;
      let worst = null;
      let easelCollision = false;
      for (let step = 50; step <= 1060; step += 2) {
        const tt = step * 0.01;
        const act = evalFlockPositionsAt(tt);
        for (const b of act) {
          if (b.s >= 5.65 && b.s <= 6.65 && b.x >= 0.02 && b.x <= 1.02 && b.y <= 1.90) {
            easelCollision = true;
          }
        }
        for (let i = 0; i < act.length; i++) {
          for (let j = i + 1; j < act.length; j++) {
            const d = Math.hypot(act[i].s - act[j].s, act[i].x - act[j].x, act[i].y - act[j].y);
            if (d < minPairDist3D) {
              minPairDist3D = d;
              worst = { tFlight: +tt.toFixed(2), tMovie: +(T_BLINK_START + tt).toFixed(2), birdA: act[i].idx, birdB: act[j].idx, distM: +d.toFixed(3) };
            }
          }
        }
      }
      return { minPairDist3D: +minPairDist3D.toFixed(3), worst, easelCollision };
    },
    state: () => ({
      version: '2.5-pure-movie',
      privacySafe: PRIVACY_SAFE,
      pureMovieNoScroll: getComputedStyle(document.body).overflow === 'hidden' && !document.getElementById('spacer') && !document.getElementById('openingLayer'),
      cyclesGILoaded,
      archKitLoaded,
      archPropCounts,
      hasPlasterPBR: SHARED_UNIFORMS.uHasPlasterPBR.value > 0.5,
      hasOakPBR: SHARED_UNIFORMS.uHasOakPBR.value > 0.5,
      hasTrimPBR: SHARED_UNIFORMS.uHasTrimPBR.value > 0.5,
      sconceCount: SHARED_UNIFORMS.uSconceCount.value,
      maxAnisotropy: maxAniso,
      pixelRatio: renderer.getPixelRatio(),
      playing: STATE.playing,
      speed: STATE.speed,
      t: +STATE.t.toFixed(4),
      cam: evalMovieCam(STATE.t),
      trajectories: { ...TRAJ, crabAngleDeg: CRAB_ANGLE_DEG },
      doorStyle: activeDoorStyle,
      sun: { ...evalSunAtMovieTime(STATE.t), style: STATE.sunStyle },
      livingFrames: Object.fromEntries(Object.entries(livingState).map(([k, v]) => [k, { strength: v.strength, drawnFrame: v.drawnFrame, visible: Boolean(v.subMesh?.visible) }])),
      paint: {
        mode: STATE.paintMode === 0 ? 'wave' : 'multizone',
        frontS: +STATE.monotonicFrontS.toFixed(3),
        floorSpread: STATE.floorSpread,
        texture: STATE.texStrength,
        clarity: STATE.clarityStrength,
      },
      birdScale: STATE.birdScale,
      birdsLoaded,
      activeBirdCount: STATE.activeBirds.length,
      activeBirds: STATE.activeBirds,
      easelVisible: easelGroup.visible,
      mountedCount: mountedItems.length,
      look: {
        shadow: STATE.shadowMode,
        splash: STATE.splashKey,
        landing: STATE.landingMode,
        floor: STATE.floorMode,
        window: STATE.windowMode,
        weight: USE_OPT_WEIGHT ? 1 : 0,
        frozen: freezeLoop,
      },
      fps: STATE.fps,
    }),
  };

  window.addEventListener('message', ev => {
    const d = ev.data;
    if (!d || typeof d !== 'object') return;
    if (d.type === 'herencia-set-look') {
      window.__R.setLook(d).then(() => {
        if (ev.source && ev.source !== window) {
          ev.source.postMessage({ type: 'herencia-look-applied', look: window.__R.state().look, t: STATE.t }, '*');
        }
      });
    } else if (d.type === 'herencia-play') {
      window.__R.play();
    } else if (d.type === 'herencia-pause') {
      freezeLoop = true;
      STATE.playing = false;
      syncPlayButton();
    }
  });

  requestAnimationFrame(tick);
})();
</script>
</body>
</html>

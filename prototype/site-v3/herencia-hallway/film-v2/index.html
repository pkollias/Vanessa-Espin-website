<script type="module">

(async () => {

  const QS = new URLSearchParams(location.search);

  const USE_OPT_WEIGHT = (QS.get('weight') ?? '1') !== '0';

  // Strictly allowed public/approved artworks when ?privacy_safe=1 is active (ZERO private photos or 076!)
  const PRIVACY_ALLOWED = new Set(['003', '006', '010', '085', '086', '087', '090', '012', '014', '015']);
  const PAINT_SET = new Set(['003', '006', '010', '085', '086', '087', '090', 'site-04-andean-figures', 'site-05-village-painting']);
  const DESIGN_SET = new Set(['012', '014', '015', 'site-06-fish-in-the-city']);
  const FULL_RES_IDS = new Set([

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const ramp = (v, a, b) => clamp((v - a) / Math.max(1e-6, b - a), 0, 1);
  const sm3 = u => { const x = clamp(u, 0, 1); return x * x * (3 - 2 * x); };
  const sm5 = u => { const x = clamp(u, 0, 1); return x * x * x * (x * (x * 6 - 15) + 10); };

  const loadedAssetUrls = [];

  /* =========================================================================
   * 1. LOAD METADATA JSONS (TEXT ONLY — ZERO PRIVATE PHOTO FETCHES IN SAFE MODE)
   * ========================================================================= */
  const [CUR, DATA, EYEKIT, RELKIT, HALLWAY_STORE] = await Promise.all([
    fetch('../curated.json?' + Date.now()).then(r => r.json()),
    fetch('../data.json').then(r => r.json()),

    fetch('../lab/kit-release/kit.json').then(r => r.json()),
    fetch('/Vanessa-Espin-website/api/herencia-hallway').then(r => r.json()).catch(() => ({})),
  ]);
  const ACTIVE_HANG_ITEMS = (HALLWAY_STORE?.['hang-D']?.edited && Array.isArray(HALLWAY_STORE['hang-D'].items) && HALLWAY_STORE['hang-D'].items.length)
    ? HALLWAY_STORE['hang-D'].items
    : CUR.items;

  const API_URL = '/Vanessa-Espin-website/api/herencia-film-v2';
  let STORE = {};
  try { STORE = await fetch(API_URL).then(r => r.json()); } catch (e) {}

  const BY = Object.fromEntries(DATA.items.map(i => [i.id, i]));
  BY.v078 = {
    id: 'v078',
    src: 'thumbs/v078.jpg',
    video: USE_OPT_WEIGHT ? './opt/v078_opt.mp4' : '/Vanessa-Espin-website/concepts/herencia/assets/v078.mp4',
    w: 720,
    h: 960,
  };
  const kindOf = id => BY[id]?.video ? 'video' : PAINT_SET.has(id) ? 'painting' : DESIGN_SET.has(id) ? 'design' : 'photo';

  /* =========================================================================
   * 2. CORRIDOR DIMENSIONS & CLUSTER-RHYTHMIC CONTINUOUS TIMELINE (v2.6)
   * ========================================================================= */
  const H = {
    L: 17.0,
    W: 2.84,
    C: 3.89,
    archT: 0.30,
    vD: 3.42,
    vHalf: 0.87,
    vC: 3.80,
    doors: [4.90, 14.80],
    doorsL: [4.90, 9.42, 14.80], // Includes new Left-Wall door at s = 9.42m gap!
    dH: 2.86,
    S0: -6.00,
  };
  H.vS = H.L + H.archT; // 17.30 m
  H.end = H.vS + H.vD;  // 20.72 m

  const CRAB_SA = 1.95;
  const CRAB_SB = 16.35;
  const FLIGHT7_PACE = 0.85; // 0.85x Flight pace baked directly into real-time seconds!
  const EYES_SEC   = 0.50;   // Virtual Flight 7 blink span
  const ARRIVE_SEC = 10.60;  // Virtual Flight 7 arrival span

  function hermite01(u, m0, m1) {
    const t = clamp(u, 0, 1);
    const t2 = t * t, t3 = t2 * t;
    return (t3 - 2 * t2 + t) * m0 + (-2 * t3 + 3 * t2) + (t3 - t2) * m1;
  }

  const TRACK_CHANNELS = ['s', 'x', 'h', 'yaw', 'pitch', 'roll', 'fov'];
  function makeHermiteTrack(keys, tk, initialSlopeOverrides = null, endSlopeOverrides = null) {
    const K = keys.map(k => ({ ...k }));
    const isFlat = (k, c) => k.flat === true || (Array.isArray(k.flat) && k.flat.includes(c));
    const M = K.map((k, i) => {
      const m = {};
      for (const c of TRACK_CHANNELS) {
        if (i === 0 && initialSlopeOverrides && initialSlopeOverrides[c] !== undefined) {
          m[c] = initialSlopeOverrides[c];
        } else if (i === K.length - 1 && endSlopeOverrides && endSlopeOverrides[c] !== undefined) {
          m[c] = endSlopeOverrides[c];
        } else if (isFlat(k, c) || i === 0 || i === K.length - 1) {
          m[c] = 0;
        } else {
          const d0 = (K[i][c] - K[i - 1][c]) / (K[i][tk] - K[i - 1][tk]);
          const d1 = (K[i + 1][c] - K[i][c]) / (K[i + 1][tk] - K[i][tk]);
          if (d0 * d1 <= 0) {
            m[c] = 0;
          } else {
            const raw = (K[i + 1][c] - K[i - 1][c]) / (K[i + 1][tk] - K[i - 1][tk]);
            const cap = 3 * Math.min(Math.abs(d0), Math.abs(d1));
            m[c] = Math.sign(raw) * Math.min(Math.abs(raw), cap);
          }
        }
      }
      return m;
    });

    return val => {
      if (val <= K[0][tk]) return { ...K[0] };
      if (val >= K[K.length - 1][tk]) return { ...K[K.length - 1] };
      let i = 0;
      while (i < K.length - 2 && K[i + 1][tk] < val) i++;
      const a = K[i], b = K[i + 1], dt = b[tk] - a[tk];
      const u = clamp((val - a[tk]) / dt, 0, 1);

      if (a.flat === true && b.flat === true) {
        const s = sm5(u), o = {};
        for (const c of TRACK_CHANNELS) o[c] = a[c] + (b[c] - a[c]) * s;
        return o;
      }
      const u2 = u * u, u3 = u2 * u, o = {};
      for (const c of TRACK_CHANNELS) {
        o[c] = (2 * u3 - 3 * u2 + 1) * a[c]
             + (u3 - 2 * u2 + u) * dt * M[i][c]
             + (-2 * u3 + 3 * u2) * b[c]
             + (u3 - u2) * dt * M[i + 1][c];
      }
      return o;
    };
  }

  // Extract Right-Wall Curated Clusters & Entrance Joint Pair (086 Fish + 090 Mona Lisa) from ACTIVE_HANG_ITEMS
  const hangDims = ACTIVE_HANG_ITEMS.map(it => {
    const meta = BY[it.id] || { w: 4, h: 3 };
    const h = it.w * ((meta.h || 3) / Math.max(1, meta.w || 4));
    return { ...it, h, s0: it.s - it.w * 0.5, s1: it.s + it.w * 0.5, y0: it.y - h * 0.5, y1: it.y + h * 0.5 };
  });
  const entLeftItems = hangDims.filter(x => x.wall === 'L' && x.s < 4.30);
  const ENT_CENTER_S = entLeftItems.length
    ? clamp(0.5 * (Math.min(...entLeftItems.map(x => x.s0)) + Math.max(...entLeftItems.map(x => x.s1))), 1.80, 2.30)
    : 2.00;

  const rCorridorItems = hangDims.filter(x => x.wall === 'R' && x.s < 17.0).sort((a, b) => a.s0 - b.s0);
  const RIGHT_CLUSTERS = [];
  for (const it of rCorridorItems) {
    const prev = RIGHT_CLUSTERS[RIGHT_CLUSTERS.length - 1];
    const maxGap = (prev && prev.s1 < 3.85 && it.s1 < 3.85) ? 0.65 : 0.32;
    if (!prev || (it.s0 - prev.s1) > maxGap) {
      RIGHT_CLUSTERS.push({ s0: it.s0, s1: it.s1, y0: it.y0, y1: it.y1, count: 1 });
    } else {
      prev.s0 = Math.min(prev.s0, it.s0); prev.s1 = Math.max(prev.s1, it.s1);
      prev.y0 = Math.min(prev.y0, it.y0); prev.y1 = Math.max(prev.y1, it.y1);
      prev.count++;
    }
  }

  // Build compact Iyuana PACE_NEW Slope-Matched Cluster-Drift Segments (slow reading drift on clusters, brisk slides across empty doors, 0% stops!)
  const CRAB_SEGS = [];
  let CRAB_START_SLOPE = 0.44;
  let CRAB_END_SLOPE = 0.48;
  let CRAB_DUR = 17.50;
  {
    const wins = RIGHT_CLUSTERS.map((c, idx) => {
      const spanW = c.s1 - c.s0;
      const centerS = 0.5 * (c.s0 + c.s1);
      let sa, sb, vD;
      if (idx === 0) {
        sa = CRAB_SA; sb = Math.max(CRAB_SA + 0.55, Math.min(c.s1 - 0.55, 2.86)); vD = 0.41;

        sa = Math.max(c.s0 - 0.15, 15.75); sb = CRAB_SB; vD = 0.48;

      if (sb <= sa + 0.12) sb = sa + 0.35;
      const dur = (sb - sa) / vD;
      return { sa, sb, dur, v: (sb - sa) / dur };
    });

    let tc = 0.0;
    for (let i = 0; i < wins.length; i++) {
      const w = wins[i];
      if (i > 0) {
        const prev = wins[i - 1];
        const ds = w.sa - prev.sb;
        if (ds > 0.02) {
          const meanGapV = ds > 1.6 ? 2.10 : 1.05;
          const gapDur = Math.max(0.55, ds / meanGapV);
          CRAB_SEGS.push({ kind: 'gap', t0: tc, t1: tc + gapDur, dur: gapDur, s0: prev.sb, s1: w.sa, m0: (prev.v * gapDur) / ds, m1: (w.v * gapDur) / ds });

        }
      }
      CRAB_SEGS.push({ kind: 'cluster', t0: tc, t1: tc + w.dur, dur: w.dur, s0: w.sa, s1: w.sb });
      tc += w.dur;
    }
    CRAB_DUR = +tc.toFixed(3);
    if (wins.length) {
      CRAB_START_SLOPE = wins[0].v;
      CRAB_END_SLOPE = wins[wins.length - 1].v;
    }
  }

  // Master Continuous Cinema Timeline Landmarks (true 1.0x real-time seconds!)
  const T_OPEN_END    = 4.30;
  const T_CRAB_START  = 4.30;
  const T_CRAB_END    = +(T_CRAB_START + CRAB_DUR).toFixed(3);
  const T_VEST_ARRIVE = +(T_CRAB_END + 1.65).toFixed(3);
  const T_EYES_START  = T_VEST_ARRIVE;
  const T_EASEL_SHOW  = +(T_EYES_START + 0.95).toFixed(3);
  const T_EYES_DONE   = +(T_EYES_START + 1.28).toFixed(3);
  const T_BLINK_START = +(T_EYES_DONE + 0.45).toFixed(3);
  const T_RELEASE     = +(T_BLINK_START + EYES_SEC / FLIGHT7_PACE).toFixed(3);
  const T_LANDING     = +(T_BLINK_START + ARRIVE_SEC / FLIGHT7_PACE).toFixed(3);
  const TOTAL_SEC     = +(T_LANDING + 0.15).toFixed(2);

  /* =========================================================================
   * ZERO-RAM COMPOSABLE TRAJECTORY VARIATIONS (Pure Analytic Math · 0 Heap / 0 GPU Bytes!)
   *   Intro  (`?intro=ccw|cw|peel`):   ccw = Counter-Clockwise via 006 Red Tree ★ | cw = Clockwise via Window | peel = Gentle Angled Peel
   *   Walk   (`?walk=crab|stroll|weave|calm`): crab = 90° Cluster Drift ★ | stroll = 32° Human Window Stroll | weave = L↔R Salon Arc | calm = Steady Glide
   *   Flight (`?flight=arch|backing|level|ribbon`): arch = High Swoop ★ | backing = Zero-Spin Pull-Out (Ayazamana) | level = Eye-Level | ribbon = Bezier
   * ========================================================================= */
  const CRAB_ANGLE_DEG = clamp(parseFloat(QS.get('crab_deg') ?? '16.5'), 0.0, 35.0);
  const TRAJ = {
    intro:  ['ccw', 'cw', 'peel'].includes((QS.get('intro') || '').toLowerCase()) ? QS.get('intro').toLowerCase() : 'ccw',
    walk:   ['crab', 'flat', 'stroll', 'weave', 'calm'].includes((QS.get('walk') || '').toLowerCase()) ? QS.get('walk').toLowerCase() : 'crab',
    flight: ['arch', 'backing', 'level', 'ribbon'].includes((QS.get('flight') || '').toLowerCase()) ? QS.get('flight').toLowerCase() : 'arch',
  };

  // Three.js camera.rotation.y = degToRad(-yaw):
  //   Decreasing `yaw` => Increasing `rotY` => Counter-Clockwise (turning Left from above)!
  //   Increasing `yaw` => Decreasing `rotY` => Clockwise (turning Right from above)!
  function alignYaw(fromYaw, targetYaw, dir = 'nearest') {
    let d = ((targetYaw - fromYaw) % 360 + 540) % 360 - 180;
    if (dir === 'ccw' && d > -1e-3) d -= 360;
    if (dir === 'cw'  && d <  1e-3) d += 360;
    return fromYaw + d;
  }

  // Allocation-free 1D degree-5 De Casteljau Bezier scalar evaluator (0 TypedArrays!)
  function bezier6(p0, p1, p2, p3, p4, p5, u) {
    const t = clamp(u, 0, 1), om = 1 - t;
    const t2 = t * t, t3 = t2 * t, t4 = t3 * t, t5 = t4 * t;
    const o2 = om * om, o3 = o2 * om, o4 = o3 * om, o5 = o4 * om;
    return o5 * p0 + 5 * o4 * t * p1 + 10 * o3 * t2 * p2 + 10 * o2 * t3 * p3 + 5 * om * t4 * p4 + t5 * p5;
  }

  function sampleClusterRhythmS(tc) {
    let seg = CRAB_SEGS[CRAB_SEGS.length - 1];
    for (let i = 0; i < CRAB_SEGS.length; i++) {
      if (tc <= CRAB_SEGS[i].t1 || i === CRAB_SEGS.length - 1) { seg = CRAB_SEGS[i]; break; }
    }
    const u = clamp((tc - seg.t0) / Math.max(1e-6, seg.dur), 0, 1);
    const s = seg.kind === 'cluster'
      ? (seg.s0 + (seg.s1 - seg.s0) * u)
      : (seg.s0 + (seg.s1 - seg.s0) * hermite01(u, seg.m0, seg.m1));
    const inCluster = seg.kind === 'cluster' ? Math.sin(Math.PI * u) : 0.0;
    return { s, inCluster };
  }

  function evalWalkVariant(t) {
    const tc = clamp(t - T_CRAB_START, 0, CRAB_DUR);
    const uNorm = tc / CRAB_DUR;

    if (TRAJ.walk === 'stroll') {
      // W2 · 32° Forward-Right Human Gallery Stroll: keeps sunlit arched window & floor patch in peripheral view!
      const { s, inCluster } = sampleClusterRhythmS(tc);
      const doorWindowGlance = Math.exp(-(((s - 4.90) / 0.85) ** 2)) + Math.exp(-(((s - 14.80) / 0.85) ** 2));
      const tallBell = sm5(ramp(s, 10.15, 12.05)) * (1.0 - sm5(ramp(s, 13.85, 15.65)));
      return {
        t, s,
        x: -0.66 - 0.16 * tallBell + 0.08 * doorWindowGlance,
        h: 1.61 + 0.05 * tallBell,
        yaw: -302.0 + 13.0 * inCluster - 16.0 * doorWindowGlance,
        pitch: -0.6,
        roll: 0.0,
        fov: 50.5 + 1.8 * tallBell,
      };
    }

    if (TRAJ.walk === 'weave') {
      // W3 · Left↔Right Salon Weave: Right C1/C2 -> Left 4-photo grid & Andean paintings -> Right v078 & 087/085!
      const uSmooth = 0.28 * uNorm + 0.72 * sm5(uNorm);
      const s = CRAB_SA + (CRAB_SB - CRAB_SA) * uSmooth;
      const leftVisit = sm5(ramp(s, 6.2, 8.2)) * (1.0 - sm5(ramp(s, 12.2, 14.1)));
      return {
        t, s,
        x: -0.64 + 1.18 * leftVisit,
        h: 1.61 + 0.03 * Math.sin(Math.PI * uNorm),
        yaw: -300.0 - 112.0 * leftVisit,
        pitch: -0.5,
        roll: 0.0,
        fov: 51.0,
      };
    }

    if (TRAJ.walk === 'calm') {
      // W4 · Serene Constant Forward-Angled Tracking Glide (zero stop-and-go surges)
      const uCalm = 0.42 * uNorm + 0.58 * sm5(uNorm);
      const s = CRAB_SA + (CRAB_SB - CRAB_SA) * uCalm;
      return {
        t, s,
        x: -0.74,
        h: 1.60,
        yaw: -298.0,
        pitch: -0.5,
        roll: 0.0,
        fov: 50.5,
      };
    }

    // W1 · Default 16.5° Subtle Forward-Angled Crab Walk (100% identical cluster speed/timing + optical-center parallax compensation!)
    //      (`flat` = original 0° perpendicular crab walk)
    const { s: sRhythm } = sampleClusterRhythmS(tc);
    const tallBell = sm5(ramp(sRhythm, 10.15, 12.05)) * (1.0 - sm5(ramp(sRhythm, 13.85, 15.65)));
    const compactC2 = sm5(ramp(sRhythm, 5.3, 6.15)) * (1.0 - sm5(ramp(sRhythm, 7.0, 7.80)));
    const x = -1.04 + 0.18 * compactC2 - 0.21 * tallBell;
    const deg = (TRAJ.walk === 'flat') ? 0.0 : CRAB_ANGLE_DEG;
    // Shift camera `s` back by `(1.42 - x) * tan(deg) * 0.86` so the optical axis hits the EXACT same cluster center at the exact same speed!
    const sParallaxBack = (1.42 - x) * Math.tan(deg * Math.PI / 180) * 0.86;
    return {
      t,
      s: sRhythm - sParallaxBack,
      x,
      h:  1.60 - 0.02 * compactC2 + 0.08 * tallBell,
      yaw: -270.0 - deg,
      pitch: deg > 1.0 ? -0.25 : 0.0,
      roll: 0.0,
      fov: 49.5 + 2.3 * tallBell,
    };
  }

  let _compiledTracksKey = '';
  let _evalOpenFn = null;
  let _evalVestFn = null;
  let _evalFlightFn = null;
  let _yawWalkOffset = 0;

  function ensureCompiledTrajectoryTracks() {
    const key = `${TRAJ.intro}|${TRAJ.walk}|${TRAJ.flight}`;
    if (key === _compiledTracksKey) return;

    const w0 = evalWalkVariant(T_CRAB_START);
    const wEps = evalWalkVariant(T_CRAB_START + 0.05);

    // 1. Intro / Opening Track (0.00s -> 4.30s)

    const baseYaw0 = (TRAJ.intro === 'peel') ? -414.0 : -450.0;

      : (TRAJ.intro === 'cw' ? alignYaw(baseYaw0, w0.yaw, 'cw') : alignYaw(baseYaw0, w0.yaw, 'nearest'));
    _yawWalkOffset = endYawOpen - w0.yaw; // Multiple of 360° so Walk joins Opening with zero wrap jump!

    let openKeys;
    if (TRAJ.intro === 'ccw') {
      // Counter-Clockwise (Turn Left): sweeps from 086+090 across entrance foyer directly onto 006 Red Tree (s=1.17m) -> Walk!
      const midY1 = baseYaw0 + (endYawOpen - baseYaw0) * 0.48;
      const midY2 = baseYaw0 + (endYawOpen - baseYaw0) * 0.88;
      openKeys = [
        { t: 0.00, s: ENT_CENTER_S - 0.14, x: 1.12,  h: 1.68, yaw: baseYaw0,     pitch:  0.0, roll: 0.0, fov: 50.0 },
        { t: 1.50, s: ENT_CENTER_S + 0.10, x: 1.12,  h: 1.67, yaw: baseYaw0 - 3, pitch:  0.0, roll: 0.0, fov: 50.0 },
        { t: 2.45, s: 1.96,                x: 0.24,  h: 1.64, yaw: midY1,        pitch: -0.3, roll: 0.0, fov: 51.2 },
        { t: 3.38, s: 1.56,                x: -0.82, h: 1.61, yaw: midY2,        pitch: -0.2, roll: 0.0, fov: 50.5 },
        { t: T_CRAB_START, s: w0.s,        x: w0.x,  h: w0.h, yaw: endYawOpen,   pitch: w0.pitch, roll: 0.0, fov: w0.fov },
      ];
    } else if (TRAJ.intro === 'peel') {
      // Gentle Peel: angled gallery gaze on 086+090, peels smoothly onto Walk without any 180° spin!
      const midY = baseYaw0 + (endYawOpen - baseYaw0) * 0.55;
      openKeys = [
        { t: 0.00, s: ENT_CENTER_S - 0.32, x: 0.96,  h: 1.66, yaw: baseYaw0,     pitch: -0.2, roll: 0.0, fov: 51.0 },
        { t: 1.55, s: ENT_CENTER_S - 0.06, x: 0.92,  h: 1.65, yaw: baseYaw0 + 4, pitch: -0.2, roll: 0.0, fov: 51.0 },
        { t: 2.85, s: 2.02,                x: 0.08,  h: 1.62, yaw: midY,         pitch: -0.4, roll: 0.0, fov: 50.8 },
        { t: T_CRAB_START, s: w0.s,        x: w0.x,  h: w0.h, yaw: endYawOpen,   pitch: w0.pitch, roll: 0.0, fov: w0.fov },

    } else {

      const midY1 = baseYaw0 + (endYawOpen - baseYaw0) * 0.32;
      const midY2 = baseYaw0 + (endYawOpen - baseYaw0) * 0.74;
      openKeys = [
        { t: 0.00, s: ENT_CENTER_S - 0.14, x:  1.12, h: 1.68, yaw: baseYaw0,     pitch:  0.0, roll: 0.0, fov: 50.0 },
        { t: 1.55, s: ENT_CENTER_S + 0.16, x:  1.12, h: 1.67, yaw: baseYaw0 + 2, pitch:  0.0, roll: 0.0, fov: 50.0 },
        { t: 2.48, s: 2.38,                x:  0.46, h: 1.63, yaw: midY1,        pitch: -0.4, roll: 0.0, fov: 51.5 },
        { t: 3.32, s: 2.18,                x: -0.42, h: 1.61, yaw: midY2,        pitch: -0.2, roll: 0.0, fov: 50.8 },
        { t: T_CRAB_START, s: w0.s,        x: w0.x,  h: w0.h, yaw: endYawOpen,   pitch: w0.pitch, roll: 0.0, fov: w0.fov },

    _evalOpenFn = makeHermiteTrack(
      openKeys, 't',
      { s: 0.16, x: 0, h: 0, yaw: 0, pitch: 0, roll: 0, fov: 0 },

    const wEnd = evalWalkVariant(T_CRAB_END);
    const wPre = evalWalkVariant(T_CRAB_END - 0.05);
    const walkEndSlopeS = (wEnd.s - wPre.s) / 0.05;
    const vStartYaw = wEnd.yaw + _yawWalkOffset;
    const vEndYaw   = alignYaw(vStartYaw, -90.0, 'ccw'); // Always sweeps via window (0°/-360°) onto Left Wall (-90°/-450°)!
    const vestKeys = [
      { t: T_CRAB_END,        s: wEnd.s, x: wEnd.x, h: wEnd.h, yaw: vStartYaw,                                 pitch: wEnd.pitch, roll: 0.0, fov: wEnd.fov },
      { t: T_CRAB_END + 0.62, s: 17.42,  x: -0.26,  h: 1.60,   yaw: vStartYaw + (vEndYaw - vStartYaw) * 0.38,  pitch: 0.0,        roll: 0.0, fov: 53.2 },

    if (TRAJ.flight === 'backing') {

      // down the left-center aisle (0.75m clear of easel), watching washed colour sweep past on both walls & revealing 015.jpg!

        { t: 5.30,  s:  9.85, x: -0.58, h: 1.57,  yaw: yWin - 1.0, pitch: -1.1, roll: 0.0, fov: 51.5 },
        { t: 7.20,  s:  6.15, x: -0.56, h: 1.53,  yaw: yWin - 0.4, pitch: -1.2, roll: 0.0, fov: 49.2 },
        { t: 9.05,  s:  3.88, x: -0.28, h: 1.508, yaw: yWin - 0.1, pitch: -1.28, roll: 0.0, fov: 47.6 },
        { t: 10.60, s:  3.35, x: -0.17, h: 1.50,  yaw: yWin,       pitch: -1.30, roll: 0.0, fov: 47.0, flat: true },

    } else if (TRAJ.flight === 'level') {

      const levelKeys = [
        { t: 0.00,  s: 19.00, x:  0.60, h: 1.60,  yaw:  -90.0, pitch:  0.0,  roll: 0.0, fov: 60.0, flat: true },

        { t: 1.60,  s: 17.80, x:  0.08, h: 1.64,  yaw: -158.0, pitch: -0.8,  roll: 0.0, fov: 57.5 },
        { t: 3.30,  s: 13.80, x: -0.46, h: 1.64,  yaw: -184.0, pitch: -1.2,  roll: 0.0, fov: 55.5 },
        { t: 5.25,  s:  8.95, x: -0.78, h: 1.60,  yaw: -198.0, pitch: -1.2,  roll: 0.0, fov: 53.5 },
        { t: 7.05,  s:  5.45, x: -0.74, h: 1.55,  yaw: -268.0, pitch: -1.3,  roll: 0.0, fov: 51.0 },
        { t: 8.85,  s:  3.82, x: -0.32, h: 1.51,  yaw: -344.0, pitch: -1.3,  roll: 0.0, fov: 48.2 },
        { t: 10.60, s:  3.35, x: -0.17, h: 1.50,  yaw: -358.6, pitch: -1.30, roll: 0.0, fov: 47.0, flat: true },

      _evalFlightFn = makeHermiteTrack(levelKeys, 't');
    } else if (TRAJ.flight === 'ribbon') {
      // F4 · Pure Degree-5 C-Infinity De Casteljau Bezier Gallery Ribbon (0 keyframes, ultra-velvet curvature!)
      _evalFlightFn = tf => {
        const uRaw = clamp((tf - 0.35) / (ARRIVE_SEC - 0.35), 0, 1);
        const u = 0.22 * uRaw + 0.78 * sm5(uRaw);
        const s   = bezier6(19.00, 18.20, 13.50,  7.20,  3.75,  3.35, u);
        const x   = bezier6( 0.60,  0.10, -0.72, -0.92, -0.32, -0.17, u);
        const h   = bezier6( 1.60,  2.18,  2.14,  1.66,  1.52,  1.50, u);

        const fov = bezier6(60.0, 58.0, 55.0, 51.5, 47.8, 47.0, u);
        return { t: tf, s, x, h, yaw, pitch, roll: 0.0, fov };

    } else {
      // F1 · Original High Arch Swoop (Flight 7)
      const FILM_CAM_KEYS = [
        { t: 0.00,  s: 19.00, x:  0.60, h: 1.60,  yaw:  -90.0, pitch:   0.0,  roll:  0.0, fov: 60.0, flat: true },
        { t: 0.50,  s: 19.00, x:  0.58, h: 1.60,  yaw:  -90.0, pitch:   0.0,  roll:  0.0, fov: 60.0, flat: true },

        { t: 2.35,  s: 16.50, x:  0.00, h: 2.88,  yaw: -180.0, pitch: -14.5,  roll:  0.0, fov: 59.5 },
        { t: 3.45,  s: 13.65, x: -0.22, h: 2.96,  yaw: -185.0, pitch: -17.5,  roll:  0.0, fov: 58.5 },
        { t: 4.65,  s: 10.65, x: -0.86, h: 2.04,  yaw: -204.0, pitch:  -6.5,  roll: -4.5, fov: 57.5 },

        { t: 6.95,  s:  5.60, x: -0.84, h: 1.56,  yaw: -274.0, pitch:  -1.6,  roll:  0.0, fov: 53.0 },
        { t: 8.20,  s:  4.18, x: -0.46, h: 1.52,  yaw: -332.0, pitch:  -1.4,  roll:  0.0, fov: 49.6 },
        { t: 9.45,  s:  3.52, x: -0.23, h: 1.505, yaw: -354.2, pitch:  -1.32, roll:  0.0, fov: 47.6 },
        { t: 10.60, s:  3.35, x: -0.17, h: 1.50,  yaw: -358.6, pitch:  -1.30, roll:  0.0, fov: 47.0, flat: true },
      ];
      _evalFlightFn = makeHermiteTrack(FILM_CAM_KEYS, 't');
    }
  }

  function evalMovieCam(t) {
    ensureCompiledTrajectoryTracks();
    const tc = Math.max(0, t);
    if (tc < T_CRAB_START) return _evalOpenFn(tc);
    if (tc < T_CRAB_END) {
      const wc = evalWalkVariant(tc);
      return { ...wc, yaw: wc.yaw + _yawWalkOffset };
    }
    if (tc < T_BLINK_START) return _evalVestFn(tc);
    const tf = Math.min(ARRIVE_SEC, (tc - T_BLINK_START) * FLIGHT7_PACE);
    const vestEndYaw = _evalVestFn(T_BLINK_START).yaw;
    const fl = _evalFlightFn(tf);
    // Shift flight yaw by exact integer 360° offset so it joins _evalVestFn(T_BLINK_START).yaw seamlessly!
    const flightYawShift = vestEndYaw - (-90.0);
    return { ...fl, yaw: fl.yaw + flightYawShift, t: tc };
  }

  /* =========================================================================
   * TALL SCREENS (PHONES)
   * The film is composed for a wide screen. Held upright, a phone keeps the height and loses the sides, so
   * the two women became two cut strips and the poster stood half off the edge. On a tall screen the lens
   * widens and the camera re-aims at each scene's subject. A wide screen (width >= height) is untouched.
   *   widen: how much more the lens takes in, as a multiple of its tangent, tuned on a 390 x 844 phone.
   *          Other tall screens get the same view from side to side, never a narrower lens than the film's.
   *   ds, dx: metres added along / across the hall      yaw, pitch: degrees added
   * Opening: the two paintings by the door cannot both fit, so the phone opens on the one the poster is made from.
   * Two women: 2.9 m of paintings in a room 1.7 m deep. The camera arrives on the second woman as her eyes
   * turn, then slides, square to the wall, onto the first, where the doves leave.
   * ========================================================================= */
  const PHONE_KEYS = [

      vWorldNorm = normalize(mat3(modelMatrix) * normal);
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `;

  const ROOM_FRAG = `
    precision highp float;
    varying vec3 vWorldPos;
    varying vec3 vWorldNorm;
    varying vec2 vUv;

    // 1=wallL, 2=wallR, 3=floor, 4=ceiling, 5=arch, 6=windowWall, 7=doorReveal, 8=backWall,
    // 10=easelPoster, 11=easelOak, 12=hungArtwork, 13=frameMouldingOrMat, 14=subOverlay, 15=livingStrip6x4,
    // 16=woodTrim3D (picture rail & stepped baseboard), 17=museumWallPlaque
    uniform int   uSurfType;
    uniform sampler2D uArtTex;
    uniform vec3  uSolidTint;
    uniform float uFlipV;
    uniform vec2  uStripCell;

    uniform float uTime;
    uniform int   uStyle;
    uniform vec3  uSunDir;
    uniform float uSunElevDeg;
    uniform float uSunAzDeg;
    uniform float uSoftness;
    uniform float uFxGain;
    uniform float uBounceGain;
    uniform int   uStandMode;
    uniform vec4  uPatchRange;
    uniform float uPaintFrontS;
    uniform float uPaintActive;
    uniform int   uPaintMode;
    uniform float uFloorSpread;
    uniform sampler2D uHangMask;
    uniform sampler2D uWaterPore;

    uniform float uHasCyclesGI;
    uniform sampler2D uLeftWallGI;
    uniform sampler2D uRightWallGI;
    uniform sampler2D uCeilGI;
    uniform sampler2D uVestGI;
    uniform sampler2D uFloorGI;

    uniform float uHasPlasterPBR;
    uniform sampler2D uPlasterAlbedo;
    uniform sampler2D uPlasterNormRough;
    uniform float uPlasterTile;

    uniform float uHasOakPBR;
    uniform sampler2D uOakPBR;
    uniform sampler2D uOakNormRough;
    uniform float uOakTileLen;

    uniform float uHasTrimPBR;
    uniform sampler2D uTrimNormRough;
    uniform float uHas3DWindow;

    uniform int   uSconceCount;
    uniform vec4  uSconces[12];
    uniform float uSconceGain;
    uniform float uTexStrength;
    uniform float uClarityStrength;
    uniform float uPaintSat;
    uniform float uCeilingPaint;

    uniform int   uShadowMode;
    uniform int   uFrameCount;
    uniform vec4  uFrameBoxes[32];
    uniform vec2  uFrameSideDepth[32];
    uniform int   uSplashMode;
    uniform sampler2D uSplashMedium;
    uniform vec4  uSplashParams;
    uniform int   uLandingMode;
    uniform float uLandingRamp;
    uniform int   uFloorMode;
    uniform float uHasFloorStrips;
    uniform sampler2D uFloorStrips;
    uniform int   uWindowMode;
    uniform float uHasWindowPlate;
    uniform float uPropAOContrast;

    const float PI = 3.14159265359;

    // Hardware-Mipmap Adobe Lightroom Texture (2-8mm high-mid relief) + Clarity (4-28cm midtone local contrast)
    float lrSafeMidWeight(vec3 srgb) {
      float lum = dot(srgb, vec3(0.299, 0.587, 0.114));
      return smoothstep(0.015, 0.18, lum) * mix(0.62, 1.0, 1.0 - smoothstep(0.76, 0.992, lum));
    }
    vec3 applyLightroomSampler(vec3 baseSRGB, sampler2D tex, vec2 uvUnwrapped, float texScale, float clarScale) {
      vec3 m0 = texture2D(tex, uvUnwrapped, 0.0).rgb;
      vec3 m2 = texture2D(tex, uvUnwrapped, 2.0).rgb;
      vec3 m4 = texture2D(tex, uvUnwrapped, 4.2).rgb;
      vec3 m6 = texture2D(tex, uvUnwrapped, 6.0).rgb;
      vec3 bandTex  = m0 - m2;
      vec3 bandClar = (m2 - m4) * 0.62 + (m4 - m6) * 0.88;
      float midW = lrSafeMidWeight(baseSRGB);
      vec3 delta = bandTex * (uTexStrength * texScale) + bandClar * (uClarityStrength * clarScale);
      return clamp(baseSRGB + delta * midW, 0.0, 1.0);
    }
    // Dual-scale non-repeating plaster evaluator (#149 calibration: gentle ±2.8% Clarity clouds + full crisp mip0-mip2 Texture bite!)
    void evalDualScalePlaster(
      vec2 uv1,
      float normGain,
      float cloudGain,
      float texGain,
      inout vec3 baseSRGB,
      out vec2 nXYOut,
      out float roughOut,
      out float fineToothOut
    ) {
      mat2 rotM = mat2(0.82, -0.57, 0.57, 0.82);
      mat2 invRotM = mat2(0.82, 0.57, -0.57, 0.82);
      vec2 uv2 = rotM * uv1 * 0.39 + vec2(0.31, 0.63);
      vec3 meanPl = vec3(0.9388, 0.9118, 0.8620);

      vec3 a0 = texture2D(uPlasterAlbedo, uv1, 0.0).rgb;
      vec3 a2 = texture2D(uPlasterAlbedo, uv1, 2.2).rgb;
      vec3 b0 = texture2D(uPlasterAlbedo, uv2, 0.0).rgb;
      vec3 b2 = texture2D(uPlasterAlbedo, uv2, 2.2).rgb;
      vec3 bandTex = (a0 - a2) * 0.92 + (b0 - b2) * 0.56;

      vec3 c1 = texture2D(uPlasterAlbedo, uv1, 2.6).rgb - meanPl;
      vec3 c2 = texture2D(uPlasterAlbedo, uv2, 2.2).rgb - meanPl;
      vec3 bandClar = (c1 * 0.45 + c2 * 0.68) * cloudGain * 1.85;

      vec3 nr1 = texture2D(uPlasterNormRough, uv1).rgb;
      vec3 nr2 = texture2D(uPlasterNormRough, uv2).rgb;
      vec2 n1 = nr1.rg * 2.0 - 1.0;
      vec2 n2 = invRotM * (nr2.rg * 2.0 - 1.0);
      nXYOut = (n1 * 0.92 + n2 * 0.48) * (normGain * 1.78);
      roughOut = clamp(mix(nr1.b, nr2.b, 0.36), 0.62, 0.94);

      // Couple normal micro-cavity directly into plaster Texture bite so troweled sand-grain reads crisply in shade & sun!
      float normMicro = (nr1.b - 0.82) * 0.22 + (n1.x + n1.y) * 0.045;
      float midW = lrSafeMidWeight(baseSRGB);
      baseSRGB = clamp(baseSRGB + ((bandTex * 2.35 + normMicro * 0.42) * (uTexStrength * texGain) + bandClar * uClarityStrength) * midW, 0.0, 1.0);
      fineToothOut = clamp(0.5 + dot(bandTex, vec3(3.6)) + normMicro * 1.8, 0.08, 0.94);
    }
    vec3 applyLightroomPore(vec3 baseSRGB, vec2 pMetric, float texScale, float clarScale) {
      vec2 uvHi  = pMetric * 1.65;
      vec2 uvMid = pMetric * 0.34;
      vec4 p0 = texture2D(uWaterPore, uvHi, 0.0);
      vec4 p2 = texture2D(uWaterPore, uvHi, 2.0);
      float c2 = texture2D(uWaterPore, uvMid, 0.5).b;
      float c5 = texture2D(uWaterPore, uvMid, 3.6).b;
      float bandTex  = (p0.g - p2.g) * 0.72 + (p0.r - p2.r) * 0.48;
      float bandClar = (c2 - c5) * 1.15;
      float midW = lrSafeMidWeight(baseSRGB);
      float d = bandTex * (uTexStrength * texScale) + bandClar * (uClarityStrength * clarScale);
      return clamp(baseSRGB + vec3(d, d * 0.96, d * 0.90) * midW, 0.0, 1.0);
    }

    vec3 srgbToLin(vec3 c) {
      return mix(c / 12.92, pow((c + 0.055) / 1.055, vec3(2.4)), step(0.04045, c));
    }
    vec3 linToSrgb(vec3 c) {
      c = max(c, vec3(0.0));
      return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c));
    }
    vec3 galleryFilmMap(vec3 x) {
      x = max(x, vec3(0.0));
      vec3 num = x * (1.0 + x * 0.24);
      vec3 den = 1.0 + x * 0.62;
      return clamp(num / den, 0.0, 1.0);
    }
    vec3 srgbToOklab(vec3 srgb) {
      vec3 c = srgbToLin(clamp(srgb, 0.0, 1.0));
      float l = pow(max(0.0, 0.4122214708 * c.r + 0.5363325363 * c.g + 0.0514459929 * c.b), 1.0 / 3.0);
      float m = pow(max(0.0, 0.2119034982 * c.r + 0.6806995451 * c.g + 0.1073969566 * c.b), 1.0 / 3.0);
      float s = pow(max(0.0, 0.0883024619 * c.r + 0.2817188376 * c.g + 0.6299787005 * c.b), 1.0 / 3.0);
      return vec3(
        0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s,
        1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s,
        0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s
      );
    }
    vec3 oklabToSrgb(vec3 lab) {
      float l_ = lab.x + 0.3963377774 * lab.y + 0.2158037573 * lab.z;
      float m_ = lab.x - 0.1055613458 * lab.y - 0.0638541728 * lab.z;
      float s_ = lab.x - 0.0894841775 * lab.y - 1.2914855480 * lab.z;
      float l = l_ * l_ * l_, m = m_ * m_ * m_, s = s_ * s_ * s_;
      vec3 lin = vec3(
        +4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
        -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
        -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s
      );
      return clamp(linToSrgb(lin), 0.0, 1.0);
    }

    float hash12(vec2 p) {
      vec3 p3 = fract(vec3(p.xyx) * 0.1031);
      p3 += dot(p3, p3.yzx + 33.33);
      return fract((p3.x + p3.y) * p3.z);
    }
    vec2 hash22(vec2 p) {
      vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973));
      p3 += dot(p3, p3.yzx + 33.33);
      return fract((p3.xx + p3.yz) * p3.zy);
    }
    float vnoise(vec2 p) {
      vec2 i = floor(p), f = fract(p);
      vec2 u = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash12(i), hash12(i + vec2(1.0, 0.0)), u.x),
                 mix(hash12(i + vec2(0.0, 1.0)), hash12(i + vec2(1.0, 1.0)), u.x), u.y);
    }
    float fbm3(vec2 p) {
      float v = 0.0, a = 0.5;
      mat2 m = mat2(0.80, 0.60, -0.60, 0.80);
      for (int i = 0; i < 3; i++) { v += a * vnoise(p); p = m * p * 2.03; a *= 0.5; }
      return v;
    }
    float fbm4(vec2 p) {
      float v = 0.0, a = 0.5;
      mat2 m = mat2(0.80, 0.60, -0.60, 0.80);
      for (int i = 0; i < 4; i++) { v += a * vnoise(p); p = m * p * 2.02; a *= 0.5; }
      return v;
    }

    // Zero-Cost Analytic 2900K Opaline Brass Sconce Wall-Wash & Grazing Plaster Specular
    void evalSconceWash(vec3 P, vec3 N, vec3 rd, float rough, out vec3 diffOut, out vec3 specOut) {
      diffOut = vec3(0.0);
      specOut = vec3(0.0);
      if (uSconceGain <= 0.001) return;
      // True linear 2900K warm opaline incandescent glow (srgbToLin(vec3(1.0, 0.78, 0.48)))
      vec3 cWarm2900K = vec3(1.00, 0.585, 0.225);
      for (int i = 0; i < 12; i++) {
        if (i >= uSconceCount) break;
        vec4 sc = uSconces[i];
        float ds = P.z - sc.z;
        if (abs(ds) > sc.w) continue;
        vec3 Lvec = sc.xyz - P;
        float d2 = dot(Lvec, Lvec);
        float rMax2 = sc.w * sc.w;
        if (d2 >= rMax2) continue;

        float d = sqrt(d2);
        vec3 Ldir = Lvec / max(d, 0.001);
        float ndl = max(0.0, dot(N, Ldir));
        if (ndl <= 0.001) continue;

        float win = 1.0 - d / sc.w;
        win = win * win;
        float invSq = 1.0 / (0.38 + 2.15 * d2);

        // Opaline milk-glass bell shade casts a smooth C-infinity downward wash cone + gentle upward crown + soft radial glow
        float dy = P.y - sc.y;
        float horizSpread = abs(ds) / (abs(dy) * 0.88 + 0.16);
        float downCone = smoothstep(0.14, -0.08, dy) * exp(-horizSpread * horizSpread * 0.92) * 1.15;
        float upCone   = smoothstep(-0.12, 0.08, dy) * exp(-horizSpread * horizSpread * 1.35) * 0.58;
        float opalHalo = exp(-d2 * 2.8) * 0.46;
        float cone = clamp(downCone + upCone + opalHalo, 0.0, 1.40);

        // Subtle brass backplate contact shadow right behind mount center
        float mountDist = length(vec2(ds, dy + 0.05));
        float mountNotch = mix(0.68, 1.0, smoothstep(0.03, 0.11, mountDist));

        float radiance = win * invSq * cone * mountNotch * uSconceGain * 0.34;
        diffOut += cWarm2900K * (radiance * (0.28 + 0.72 * ndl));

        vec3 Hvec = normalize(Ldir - rd);
        float shininess = mix(46.0, 11.0, clamp(rough, 0.25, 0.95));
        float spStrength = mix(0.18, 0.035, clamp(rough, 0.25, 0.95));
        float sp = pow(max(0.0, dot(N, Hvec)), shininess) * spStrength * ndl;
        specOut += cWarm2900K * (radiance * sp);
      }
    }

    const vec3 EASEL_ORIGIN = vec3(0.54, 0.0, 6.15);
    const float EASEL_YAW = -0.148;
    const float EASEL_TILT = 0.113;

    vec3 worldToEaselYaw(vec3 p) {
      vec3 d = p - EASEL_ORIGIN;
      float c = cos(EASEL_YAW), s = sin(EASEL_YAW);
      return vec3(d.x * c - d.z * s, d.y, d.x * s + d.z * c);
    }
    vec3 dirToEaselYaw(vec3 d) {
      float c = cos(EASEL_YAW), s = sin(EASEL_YAW);
      return vec3(d.x * c - d.z * s, d.y, d.x * s + d.z * c);
    }
    vec3 yawToTiltFrame(vec3 p) {
      vec3 q = p - vec3(0.0, 0.85, 0.0);
      float c = cos(EASEL_TILT), s = sin(EASEL_TILT);
      return vec3(q.x, q.y * c + q.z * s, -q.y * s + q.z * c) + vec3(0.0, 0.85, 0.0);
    }
    vec3 dirToTiltFrame(vec3 d) {
      float c = cos(EASEL_TILT), s = sin(EASEL_TILT);
      return vec3(d.x, d.y * c + d.z * s, -d.y * s + d.z * c);
    }
    bool hitSlab(vec3 ro, vec3 rd, vec3 bMin, vec3 bMax) {
      vec3 invD = 1.0 / vec3(
        abs(rd.x) < 1e-5 ? 1e-5 : rd.x,
        abs(rd.y) < 1e-5 ? 1e-5 : rd.y,
        abs(rd.z) < 1e-5 ? 1e-5 : rd.z
      );
      vec3 t0 = (bMin - ro) * invD, t1 = (bMax - ro) * invD;
      vec3 tsm = min(t0, t1), tbg = max(t0, t1);
      float tmin = max(max(tsm.x, tsm.y), tsm.z);
      float tmax = min(min(tbg.x, tbg.y), tbg.z);
      return tmax >= max(tmin, 0.01);
    }
    float easelShadowTransmittance(vec3 P, vec3 L) {
      if (uStandMode == 0 || P.z > 6.55) return 1.0;
      vec3 roY = worldToEaselYaw(P + L * 0.015);
      vec3 rdY = dirToEaselYaw(L);
      if (!hitSlab(roY, rdY, vec3(-0.46, 0.0, -0.58), vec3(0.46, 1.95, 0.35))) return 1.0;
      vec3 roT = yawToTiltFrame(roY);
      vec3 rdT = dirToTiltFrame(rdY);
      if (hitSlab(roT, rdT, vec3(-0.372, 0.82, -0.024), vec3(0.372, 1.76, 0.015))) return 0.08;
      for (int side = -1; side <= 1; side += 2) {
        float fs = float(side);
        float ca = cos(fs * 0.08), sa = sin(fs * 0.08);
        vec3 pPiv = roT - vec3(fs * 0.255, 0.85, 0.024);
        vec3 roL = vec3(pPiv.x * ca + pPiv.y * sa, -pPiv.x * sa + pPiv.y * ca, pPiv.z);
        vec3 rdL = vec3(rdT.x * ca + rdT.y * sa, -rdT.x * sa + rdT.y * ca, rdT.z);
        if (hitSlab(roL, rdL, vec3(-0.026, -0.88, -0.022), vec3(0.026, 0.95, 0.022))) return 0.0;
      }
      return 1.0;
    }

    float sdRoundArch(vec2 p, float hw, float ySill, float ySpring) {
      if (p.y >= ySpring) return length(vec2(p.x, p.y - ySpring)) - hw;
      vec2 d = vec2(abs(p.x) - hw, ySill - p.y);
      return length(max(d, 0.0)) + min(max(d.x, d.y), 0.0);
    }
    float sdVestibuleArch(vec2 p) {
      float dx = abs(p.x) - 0.87;
      if (p.y > 2.886 && abs(p.x) <= 0.87) {
        return length(vec2(p.x, p.y - 2.305)) - 1.046;
      }
      float dyTop = p.y - 2.886;
      if (dyTop > 0.0) return length(vec2(max(dx, 0.0), dyTop));
      return dx;
    }

    void evalWindowGlazing(vec2 w, float pen, out float barTrans, out vec2 bevelGrad) {
      float dBar = 9.0;
      bevelGrad = vec2(0.0);
      float bevelW = 0.058;
      if (w.y <= 2.33) {
        float gx = fract((w.x + 0.72) / 0.36);
        float gy = fract((w.y - 0.78) / 0.5167);
        float dxPane = min(gx, 1.0 - gx) * 0.36;
        float dyPane = min(gy, 1.0 - gy) * 0.5167;
        dBar = min(dxPane, dyPane) - 0.013;
        dBar = min(dBar, abs(w.y - 2.33) - 0.020);
        float bx = (gx < 0.5 ? 1.0 : -1.0) * smoothstep(bevelW, 0.012, dxPane);
        float by = (gy < 0.5 ? 1.0 : -1.0) * smoothstep(bevelW, 0.012, dyPane);
        bevelGrad = vec2(bx, by);
      } else {
        vec2 fp = vec2(w.x, w.y - 2.33);
        float r = length(fp);
        float ang = atan(fp.y, fp.x);
        float dRing = abs(r - 0.35) - 0.012;
        float sector = fract(ang / (PI / 6.0));
        float dSpoke = r > 0.10 ? (min(sector, 1.0 - sector) * (PI / 6.0) * r - 0.010) : 9.0;
        dBar = min(min(dRing, dSpoke), abs(w.y - 2.33) - 0.020);
        vec2 radDir = fp / max(r, 1e-4);
        vec2 tanDir = vec2(-radDir.y, radDir.x);
        float bRad = smoothstep(bevelW, 0.010, min(abs(r - 0.35), abs(0.72 - r))) * (r > 0.53 ? -1.0 : 1.0);
        float bAng = (sector < 0.5 ? 1.0 : -1.0) * smoothstep(bevelW, 0.010, min(sector, 1.0 - sector) * (PI / 6.0) * r);
        bevelGrad = radDir * bRad + tanDir * bAng + radDir * smoothstep(0.09, 0.0, abs(0.72 - r)) * -1.2;
      }
      float blur = 0.008 + pen * 0.55;
      float shadowDepth = clamp(0.76 - pen * 2.4, 0.22, 0.74);
      barTrans = mix(1.0 - shadowDepth, 1.0, smoothstep(-blur, blur, dBar));
    }

    float traceWindowScalar(vec3 P, vec3 L, float penScale, out vec2 wHitOut, out float tWinOut, out float penOut) {
      wHitOut = vec2(0.0); tWinOut = 10.0; penOut = 0.03;
      if (L.z <= 0.02 || P.z >= 20.715) return 0.0;
      tWinOut = (20.72 - P.z) / L.z;
      // Right-Wall Crab-Walk Window Rake (-L.x > 0 -> az > 0; strictly 0.0 at az = -4.9° stand03 landing!):
      // Prevents the 18m corridor tunnel from clipping window light below y=0.7m, lifting the arched fanlight,
      // 6-over-6 mullion bars, & Komorebi leaf dapple across full eye/painting height (y = 0..2.38m) during Crab Walk!
      float rightRake = smoothstep(0.012, 0.052, -L.x) * (1.0 - smoothstep(15.4, 17.1, P.z));
      float tEffY = mix(tWinOut, min(tWinOut, 4.55 + P.z * 0.14), rightRake);
      vec3 pWin = vec3(P.x + L.x * tWinOut, P.y + L.y * tEffY, 20.72);
      wHitOut = pWin.xy;
      float tPen = mix(tWinOut, min(tWinOut, 8.2), rightRake * 0.72);
      penOut = (0.010 + 0.088 * uSoftness * penScale) * clamp(0.28 + 0.075 * tPen, 0.28, 1.75);

      float sdW1 = sdRoundArch(pWin.xy, 0.72, 0.78, 2.33);
      float tEffOuterY = mix((20.94 - P.z) / L.z, tEffY + 0.22 / L.z, rightRake);
      vec3 pWinOuter = vec3(P.x + L.x * ((20.94 - P.z) / L.z), P.y + L.y * tEffOuterY, 20.94);
      float sdW2 = sdRoundArch(pWinOuter.xy, 0.73, 0.77, 2.33);
      float vis = (1.0 - smoothstep(-penOut, penOut, sdW1)) * (1.0 - smoothstep(-penOut * 1.1, penOut * 1.1, sdW2));
      if (vis <= 0.001) return 0.0;

      if (P.z < 17.295) {
        float tA2 = (17.30 - P.z) / L.z;
        float tA2Y = mix(tA2, min(tA2, 3.8 + P.z * 0.10), rightRake);
        vec3 pA2 = vec3(P.x + L.x * tA2, P.y + L.y * tA2Y, 17.30);
        float penA2 = penOut * clamp(tA2 / max(tWinOut, 0.1), 0.18, 1.0);
        vis *= 1.0 - smoothstep(-penA2, penA2, sdVestibuleArch(pA2.xy));
        if (vis <= 0.001) return 0.0;
      }
      if (P.z < 16.995) {
        float tA1 = (17.00 - P.z) / L.z;
        float tA1Y = mix(tA1, min(tA1, 3.6 + P.z * 0.10), rightRake);
        vec3 pA1 = vec3(P.x + L.x * tA1, P.y + L.y * tA1Y, 17.00);
        float penA1 = penOut * clamp(tA1 / max(tWinOut, 0.1), 0.15, 1.0);
        vis *= 1.0 - smoothstep(-penA1, penA1, sdVestibuleArch(pA1.xy));
        if (vis <= 0.001) return 0.0;
      }
      vis *= easelShadowTransmittance(P, L);
      return vis;
    }

    vec3 evalSolarSpectrum(int styleId) {
      float warmT = 1.0 - smoothstep(7.0, 31.0, uSunElevDeg);
      vec3 highSun = vec3(1.00, 0.965, 0.905);
      vec3 goldSun = vec3(1.00, 0.845, 0.635);
      vec3 col = mix(highSun, goldSun, warmT);
      if (styleId == 2) col = mix(col, vec3(1.00, 0.975, 0.935), 0.55);
      return col;
    }

    vec3 evalDirectSun(vec3 P, int styleId) {
      vec2 wHit; float tWin; float pen;
      float penMult = (styleId == 2) ? 1.55 : 1.0;
      float vis = traceWindowScalar(P, uSunDir, penMult, wHit, tWin, pen);
      if (vis <= 0.001 && styleId != 3) return vec3(0.0);

      vec3 sunCol = evalSolarSpectrum(styleId);
      float barTrans; vec2 bevelGrad;
      evalWindowGlazing(wHit, pen, barTrans, bevelGrad);
      float elevGain = mix(1.95, 2.22, smoothstep(6.0, 20.0, uSunElevDeg));

      if (styleId == 1) {
        float phase = wHit.y / 0.034 + wHit.x * 0.16;
        float slatWave = 0.5 + 0.5 * cos(phase * 2.0 * PI);
        float slatContrast = (0.40 * uFxGain) * exp(-pen * 5.2);
        float louverTrans = mix(1.0, mix(0.56, 1.24, slatWave), clamp(slatContrast * 2.6, 0.0, 0.88));
        float crownGlass = 1.0 + 0.12 * uFxGain * (fbm3(wHit * 5.8 + vec2(1.7, 3.1)) - 0.5);
        return sunCol * (vis * mix(1.0, barTrans, 0.68) * louverTrans * crownGlass * elevGain);
      }
      if (styleId == 2) {
        vec2 skyPos = wHit * 0.45 + uSunDir.xy * 4.0 + vec2(uTime * 0.055, uTime * 0.022);
        float cloud = fbm4(skyPos * 1.15);
        float cloudBreak = mix(1.0, smoothstep(0.20, 0.74, cloud) * 0.66 + 0.48, clamp(uFxGain, 0.0, 1.3));
        return sunCol * (vis * mix(1.0, barTrans, 0.48) * cloudBreak * elevGain * 0.96);
      }
      if (styleId == 3) {
        float disp = (0.019 + 0.020 * (1.0 - smoothstep(7.0, 28.0, uSunElevDeg))) * uFxGain;
        vec3 tangX = normalize(vec3(uSunDir.z, 0.0, -uSunDir.x));
        vec3 tangY = cross(uSunDir, tangX);
        vec2 refractDir = normalize(bevelGrad + vec2(0.34, 0.76) + vec2(1e-4));
        vec3 deltaDir = (tangX * refractDir.x + tangY * refractDir.y) * disp;
        vec2 wR, wB; float tR, tB, pR, pB;
        float vR = traceWindowScalar(P, normalize(uSunDir + deltaDir * 1.25), 0.90, wR, tR, pR);
        float vB = traceWindowScalar(P, normalize(uSunDir - deltaDir * 1.25), 0.90, wB, tB, pB);
        float bR, bB; vec2 bgR, bgB;
        evalWindowGlazing(wR, pR, bR, bgR);
        evalWindowGlazing(wB, pB, bB, bgB);
        vec3 cCrimson = srgbToLin(vec3(0.92, 0.17, 0.15));
        vec3 cAmber   = srgbToLin(vec3(1.00, 0.66, 0.12));
        vec3 cRose    = srgbToLin(vec3(0.88, 0.27, 0.52));
        float rCh = vR * mix(1.0, bR, 0.72);
        float gCh = vis * mix(1.0, barTrans, 0.72);
        float bCh = vB * mix(1.0, bB, 0.72);
        float paneBevel = clamp(length(bevelGrad), 0.0, 1.0) * gCh;
        vec3 whiteCore = sunCol * min(rCh, min(gCh, bCh)) * 0.92;
        vec3 prismFringe = cCrimson * (max(0.0, rCh - gCh * 0.68) * 1.85 + paneBevel * 0.34)
                         + cAmber   * (max(0.0, 0.65 * (rCh + gCh) - bCh * 0.85) * 1.35 + paneBevel * 0.48)
                         + cRose    * (max(0.0, bCh - rCh * 0.65) * 1.85 + paneBevel * 0.22);
        return (whiteCore + prismFringe * clamp(uFxGain, 0.0, 1.4)) * elevGain;
      }
      // Style 4 ★: Exterior Swaying Tree-Crown Dapple (Komorebi outside s = 20.72m!)
      float tTree1 = (23.20 - P.z) / max(uSunDir.z, 0.05);
      float tTree2 = (25.00 - P.z) / max(uSunDir.z, 0.05);
      vec2 pT1 = (P + uSunDir * tTree1).xy;
      vec2 pT2 = (P + uSunDir * tTree2).xy;
      vec2 sway1 = vec2(sin(uTime * 1.15 + pT1.y * 1.4) * 0.055, cos(uTime * 0.92 + pT1.x * 1.6) * 0.035);
      vec2 sway2 = vec2(cos(uTime * 0.78 + pT2.y * 1.1) * 0.075, sin(uTime * 1.05 + pT2.x * 1.2) * 0.045);
      float blurT = clamp((tTree1 - 2.6) * 0.012 + uSoftness * 0.24, 0.06, 0.24);
      vec2 q1 = pT1 + sway1;
      float bough1 = smoothstep(0.05 + blurT * 0.20, 0.14 + blurT * 0.30, abs(q1.y - 2.28 - q1.x * 0.42 - 0.16 * sin(q1.x * 2.8)));
      float bough2 = smoothstep(0.04 + blurT * 0.18, 0.12 + blurT * 0.28, abs(q1.y - 1.52 + q1.x * 0.36 + 0.14 * cos(q1.x * 3.1)));
      float leaves1 = texture2D(uWaterPore, q1 * 0.52 + vec2(0.23, 0.51)).b;
      float leaves2 = texture2D(uWaterPore, (pT2 + sway2) * 0.39 + vec2(0.74, 0.18)).b;
      float gapField = leaves1 * 0.58 + leaves2 * 0.42;
      float dapple = smoothstep(0.41 - blurT * 0.32, 0.56 + blurT * 0.32, gapField) * mix(0.20, 1.0, bough1 * bough2);
      float komorebi = mix(1.0, 0.14 + 1.42 * dapple, clamp(uFxGain, 0.0, 1.35));
      return sunCol * (vis * mix(1.0, barTrans, 0.62) * komorebi * elevGain);
    }

    vec3 evalIndirectRadiosity(vec3 P, vec3 N, int styleId) {
      float warmT = 1.0 - smoothstep(7.0, 32.0, uSunElevDeg);
      float airyBoost = (styleId == 2) ? 1.24 : 1.00;
      vec3 portalCenter = vec3(0.0, 1.95, 20.5);
      vec3 toPortal = portalCenter - P;
      float distP = length(toPortal);
      vec3 dirP = toPortal / max(distP, 0.001);
      float facingPortal = 0.54 + 0.46 * max(0.0, dot(N, dirP));
      float vestBoost = 1.0 + 0.56 * smoothstep(16.4, 19.8, P.z);
      float portalFalloff = 1.0 / (1.0 + 0.0068 * distP * distP);
      vec3 skyTint = mix(vec3(0.95, 0.955, 0.965), vec3(0.99, 0.935, 0.855), warmT * 0.72);
      if (styleId == 2) skyTint = vec3(0.97, 0.975, 0.985);
      vec3 E_sky = skyTint * (0.48 * airyBoost * facingPortal * portalFalloff * vestBoost);

      vec3 E_room = mix(vec3(0.42, 0.39, 0.35), vec3(0.47, 0.405, 0.325), warmT) * airyBoost;
      float upFromFloor = clamp(0.65 - 0.35 * N.y, 0.15, 1.0) * exp(-P.y * 0.22);
      E_room += vec3(0.16, 0.105, 0.055) * upFromFloor * uBounceGain;

      float sClamped = clamp(P.z, uPatchRange.x, uPatchRange.y);
      vec3 patchPt = vec3(uPatchRange.z, 0.02, sClamped);
      vec3 fromPatch = P - patchPt;
      float dPatch = length(fromPatch);
      vec3 dirFromPatch = fromPatch / max(dPatch, 0.05);
      float receiverCos = max(0.0, -dot(N, dirFromPatch));
      float emitterCos  = max(0.15, dirFromPatch.y);
      float patchForm   = (receiverCos * emitterCos) / (0.85 + 0.32 * dPatch * dPatch);
      vec3 oakBounceTint = mix(vec3(1.00, 0.76, 0.46), vec3(1.00, 0.68, 0.34), warmT);
      if (uPaintActive > 0.5 && uFloorSpread > 0.02 && P.z > uPaintFrontS + 1.0) {
        vec3 s5Hint = P.z > 14.0 ? vec3(0.42, 0.84, 0.88) : (P.z > 6.5 ? vec3(1.0, 0.68, 0.24) : vec3(0.95, 0.42, 0.38));
        oakBounceTint = mix(oakBounceTint, s5Hint, 0.16 * uFloorSpread * uPaintSat);
      }
      vec3 E_patch = oakBounceTint * (patchForm * uPatchRange.w * 0.82 * uBounceGain);
      return E_sky + E_room + E_patch;
    }

    vec3 applyWarmAO(vec3 linearLit, float ao) {
      vec3 warmShadowTint = vec3(0.76, 0.69, 0.60);
      return linearLit * mix(warmShadowTint * 0.68, vec3(1.0), clamp(ao, 0.0, 1.0));
    }

    // Perceptual Oklab watercolour dilution: softens chroma while lifting lightness gently toward warm chalky water!
    vec3 washPigmentSRGB(vec3 pig) {
      vec3 lab = srgbToOklab(pig);
      float w = clamp(1.0 - uPaintSat, 0.0, 0.85);
      lab.x = mix(lab.x, max(lab.x, 0.868), w * 0.56);
      lab.yz *= clamp(uPaintSat, 0.14, 1.15);
      return oklabToSrgb(lab);
    }

    vec3 pickS5WavePigment(float s, float crossCoord, float sideSeed, float caul, float macroFbm, bool isFloor) {
      float lobeAmp = isFloor ? 5.8 : 4.2;
      float nLobe = texture2D(uWaterPore, vec2(s * 0.045 + sideSeed * 0.11, crossCoord * (isFloor ? 0.11 : 0.065))).b;
      float nSub  = texture2D(uWaterPore, vec2(s * 0.092 + 0.31, crossCoord * 0.105 + sideSeed * 0.07)).b;
      float sw = s + (nLobe - 0.48) * lobeAmp + (caul - 0.5) * 1.35;

      vec3 cCerulean = vec3(0.145, 0.715, 0.795);
      vec3 cCobalt   = vec3(0.285, 0.565, 0.825);
      vec3 cSeaJade  = vec3(0.235, 0.725, 0.645);
      vec3 cOlive    = vec3(0.515, 0.675, 0.165);
      vec3 cMarigold = vec3(0.992, 0.655, 0.095);
      vec3 cTomate   = vec3(0.875, 0.305, 0.075);
      vec3 cCrimson  = vec3(0.915, 0.165, 0.155);
      vec3 cRose     = vec3(0.875, 0.245, 0.515);

      float subMix = smoothstep(0.45, 0.55, nSub);
      if (isFloor) {
        vec3 flWin  = mix(cCerulean, cCobalt, subMix);
        vec3 flMidA = mix(cSeaJade,  cCerulean, subMix);
        vec3 flMidB = mix(cRose,     mix(cSeaJade, cMarigold, smoothstep(0.48, 0.58, macroFbm)), subMix);
        vec3 flFore = mix(cCrimson,  mix(cRose, cSeaJade, smoothstep(0.56, 0.68, macroFbm) * 0.65), subMix);
        if (sw > 15.0) return mix(flMidA, flWin,  smoothstep(15.0, 15.45, sw));
        if (sw >  9.6) return mix(flMidB, flMidA, smoothstep( 9.6, 10.05, sw));
        if (sw >  4.8) return mix(flFore, flMidB, smoothstep( 4.8,  5.25, sw));
        return flFore;
      }

      vec3 cWin   = mix(cCerulean, cCobalt, subMix);
      vec3 cUpper = mix(cSeaJade,  cOlive,  smoothstep(0.48, 0.56, macroFbm));
      vec3 cMid   = mix(cMarigold, cTomate, subMix);
      vec3 cFore  = mix(cCrimson,  cRose,   smoothstep(0.46, 0.54, macroFbm));

      if (sw > 15.6) return washPigmentSRGB(mix(cUpper, cWin,   smoothstep(15.6, 15.95, sw)));
      if (sw > 10.6) return washPigmentSRGB(mix(cMid,   cUpper, smoothstep(10.6, 10.95, sw)));
      if (sw >  5.4) return washPigmentSRGB(mix(cFore,  cMid,   smoothstep( 5.4,  5.75, sw)));
      return washPigmentSRGB(cFore);
    }

    void evalPermanentWatercolour(
      int surfKind,
      float s,
      float coord,
      float tooth,
      out vec3 pigSRGB,
      out float glazeAlpha,
      out float rimDark
    ) {
      pigSRGB = vec3(0.937, 0.914, 0.871);
      glazeAlpha = 0.0;
      rimDark = 0.0;
      if (uPaintActive < 0.5 || s < -1.8 || s > 20.70) return;
      if (surfKind == 3 && uFloorSpread <= 0.005) return;
      if (surfKind == 4 && uCeilingPaint <= 0.005) return;

      float sideSeed = (surfKind == 2) ? 5.7 : ((surfKind == 4) ? 2.8 : ((surfKind == 3) ? 9.1 : 0.0));
      float crossM = coord;
      if (surfKind == 4) crossM = 3.89 + (coord + 1.42);
      else if (surfKind == 2) crossM = 6.73 + (3.89 - coord);
      else if (surfKind == 3) crossM = 10.62 + (coord + 1.42) * 1.35;

      vec2 pm = vec2(s, crossM);
      vec2 pmNoise = (surfKind == 3) ? vec2(s * 0.62, coord * 2.35 + 11.0) : pm;

      vec4 poreA = texture2D(uWaterPore, pmNoise * 0.155 + vec2(sideSeed * 0.13, sideSeed * 0.07));
      vec4 poreB = texture2D(uWaterPore, pmNoise * 0.215 + vec2(0.37, 0.61));
      float c1 = poreA.r;
      float c2 = poreA.g;
      float macroPore = poreA.b;
      float domeMix = poreA.a;
      float c3 = poreB.g * 0.62 + poreB.r * 0.38;

      float rawW = 0.0;

      if (uPaintMode == 0) {
        float leadDist = s - uPaintFrontS;
        float wiggFbm = texture2D(uWaterPore, vec2(crossM * 0.11 + sideSeed * 0.09, s * 0.038)).b;
        float frontWiggle = (wiggFbm - 0.48) * 1.75 + (c1 - 0.5) * 0.95;
        float aheadDist = leadDist + frontWiggle;
        float satGate = smoothstep(-1.25, -0.10, aheadDist) * smoothstep(0.68, 0.82, domeMix);

        float crossPenalty = 0.0;
        if (surfKind == 4) {
          float distWall = 1.42 - abs(coord);
          crossPenalty = distWall * 0.22;
        } else if (surfKind == 3) {
          float halfW = (s > 17.30) ? 0.87 : 1.42;
          float distBaseboard = halfW - abs(coord);
          float plankFinger = (poreB.b - 0.44) * 0.88 + (macroPore - 0.48) * 0.36;
          float maxReach = mix(0.02, halfW * 1.48, uFloorSpread);
          float normInward = max(0.0, distBaseboard - plankFinger * 0.58) / max(0.08, maxReach);
          crossPenalty = pow(normInward, 1.42) * 0.72;
        } else {
          float edgeY = smoothstep(0.0, 0.65, abs(coord - 1.95) - 1.42);
          crossPenalty = edgeY * 0.22;
        }

        float poreField = 0.52 * macroPore + 0.48 * domeMix;
        float capMax = (surfKind == 3) ? 0.76 : 0.66;
        float capBase = (surfKind == 3) ? 0.18 : 0.08;
        float steadyCap = clamp(capBase + 0.82 * poreField - crossPenalty * 0.54, 0.0, capMax);
        float waveRise  = clamp((aheadDist - crossPenalty * 1.08) * 0.36, 0.0, 0.78);
        float calmEntrance = smoothstep(-1.6, 0.2, s);
        rawW = min(waveRise, steadyCap) * calmEntrance;
        rawW = max(rawW, satGate * 0.38 * calmEntrance * step(crossPenalty, 0.74));
      } else {
        bool rightSide = (surfKind == 2) || (surfKind == 4 && coord > 0.0) || (surfKind == 3 && coord > 0.0);
        float zCenters[4];
        zCenters[0] = 19.0; zCenters[1] = 14.1; zCenters[2] = 9.0; zCenters[3] = 3.1;
        vec3 zColsL[4];
        zColsL[0] = vec3(0.145, 0.715, 0.795);
        zColsL[1] = vec3(0.235, 0.725, 0.645);
        zColsL[2] = vec3(0.875, 0.305, 0.075);
        zColsL[3] = vec3(0.875, 0.245, 0.515);
        vec3 zColsR[4];
        zColsR[0] = vec3(0.285, 0.565, 0.825);
        zColsR[1] = vec3(0.515, 0.675, 0.165);
        zColsR[2] = vec3(0.235, 0.725, 0.645);
        zColsR[3] = vec3(0.915, 0.195, 0.165);

        float bestScore = -9.0;
        int winIdx = 0;
        for (int k = 0; k < 4; k++) {
          float sc = zCenters[k];
          float prog = clamp((sc + 1.2 - uPaintFrontS) / 4.2, 0.0, 1.0);
          if (prog <= 0.001) continue;
          float reachS = (0.6 + 3.45 * prog);
          float ds = abs(s - sc + (c1 - 0.5) * 0.95) / reachS;
          float dv = 0.0;
          if (surfKind == 1 || surfKind == 2) {
            dv = abs(coord - 1.95) / (0.85 + 1.65 * prog);
          } else if (surfKind == 4) {
            dv = (1.42 - abs(coord)) / (0.35 + 1.35 * prog);
          } else {
            float halfW = (s > 17.30) ? 0.87 : 1.42;
            float maxFl = mix(0.02, halfW * 1.32, uFloorSpread);
            dv = (halfW - abs(coord)) / max(0.08, maxFl * prog);
          }
          float score = 1.14 - sqrt(ds * ds + dv * dv * 0.68) + (macroPore - 0.48) * 0.34;
          if (score > bestScore) {
            bestScore = score;
            winIdx = k;
          }
        }
        pigSRGB = washPigmentSRGB(rightSide ? zColsR[winIdx] : zColsL[winIdx]);
        rawW = clamp(bestScore * 0.88, 0.0, 0.90) * smoothstep(-1.6, 0.2, s);
      }

      if (rawW <= 0.005) return;
      if (uPaintMode == 0) {
        pigSRGB = pickS5WavePigment(s, surfKind == 3 ? coord * 2.2 : crossM, sideSeed, c1, poreB.b, surfKind == 3);
      }

      float micro = (tooth - 0.5) * 0.038;
      float phi1 = rawW + (c1 - 0.48) * 0.28 * smoothstep(0.01, 0.16, rawW) + micro;
      float aa1 = clamp(fwidth(phi1) * 1.15, 0.003, 0.026);
      float g1 = smoothstep(0.16 - aa1, 0.16 + aa1, phi1);
      if (g1 <= 0.002) return;

      float phi2 = rawW * 0.92 + (c2 - 0.47) * 0.25 * smoothstep(0.04, 0.22, rawW) + micro;
      float aa2 = clamp(fwidth(phi2) * 1.15, 0.003, 0.026);
      float g2 = smoothstep(0.31 - aa2, 0.31 + aa2, phi2);

      float phi3 = rawW * 0.85 + (c3 - 0.46) * 0.22 * smoothstep(0.08, 0.28, rawW) + micro;
      float aa3 = clamp(fwidth(phi3) * 1.15, 0.003, 0.026);
      float g3 = smoothstep(0.46 - aa3, 0.46 + aa3, phi3);

      rimDark = exp(-pow((phi1 - 0.165) / 0.024, 2.0)) * 0.22
              + exp(-pow((phi2 - 0.315) / 0.025, 2.0)) * 0.15;

      float ordinalFrac = g1 * 0.40 + g2 * 0.33 + g3 * 0.27;
      float baseGain = ((surfKind == 3) ? 0.92 : ((surfKind == 4) ? (0.60 * uCeilingPaint) : 0.68)) * (0.55 + 0.45 * uPaintSat);
      float landScale = 1.0;
      if ((uLandingMode == 2 || uLandingMode == 4) && surfKind != 3) {
        float clearBell = exp(-pow((s - 6.15) / 2.10, 2.0));
        landScale *= mix(1.0, 0.22, clearBell * uLandingRamp);
      }
      if ((uLandingMode == 3 || uLandingMode == 4) && surfKind == 3) {
        float calmFl = mix(0.18, 1.0, smoothstep(3.6, 8.6, s));
        landScale *= mix(1.0, calmFl, uLandingRamp);
      }
      glazeAlpha = clamp((ordinalFrac * baseGain + rimDark * 0.20 + g1 * (1.0 - tooth) * 0.04) * landScale, 0.0, 0.90);
      rimDark *= landScale;
    }

    /* --- DROP 1A: EXACT ANALYTIC FRAME CONTACT & CAST SHADOWS + ARCHITECTURAL CORNER/CASING AO --- */
    void evalFrameWallShadow(
      float sideSign,
      float s,
      float y,
      vec3 N,
      out float inExactFrame,
      out float ambShadow,
      out float sunBlock
    ) {
      inExactFrame = 0.0;
      ambShadow = 0.0;
      sunBlock = 0.0;
      float ndlWall = max(0.0, dot(N, uSunDir));
      float tProj = 1.0 / max(0.28, ndlWall);
      for (int i = 0; i < 32; i++) {
        if (i >= uFrameCount) break;
        vec2 sd = uFrameSideDepth[i];
        if (abs(sd.x - sideSign) > 0.1) continue;
        vec4 b = uFrameBoxes[i];
        if (s < b.x - 0.16 || s > b.y + 0.14 || y < b.z - 0.18 || y > b.w + 0.08) continue;

        float depth = sd.y;
        vec2 dOut2 = max(vec2(max(b.x - s, s - b.y), max(b.z - y, y - b.w)), 0.0);
        float dOut = length(dOut2);
        if (dOut <= 0.0015) inExactFrame = 1.0;
        if (uShadowMode <= 0) continue;

        // 1. Tight 0-10mm rabbet contact crease around exact outer frame perimeter (eliminates pale halo!)
        float botBias = 0.85 + 0.35 * clamp((b.z + 0.06 - y) / 0.10, 0.0, 1.0)
                      + 0.20 * clamp((b.x + 0.06 - s) / 0.10, 0.0, 1.0);
        float crease = (exp(-dOut / 0.0075) * 0.56 + exp(-dOut / 0.024) * 0.22) * botBias;

        // 2. Architectural gallery sky + arched-window portal cast shadow (downward & away from s=20.72 window)
        float dScale = depth * 1.55;
        vec2 offAmb = vec2(-0.88 * dScale, -1.38 * dScale);
        float penAmb = 0.014 + 0.52 * dScale;
        vec2 dAmb2 = max(vec2(max(b.x + offAmb.x - s, s - (b.y + offAmb.x)), max(b.z + offAmb.y - y, y - (b.w + offAmb.y))), 0.0);
        float castAmb = (1.0 - smoothstep(0.0, penAmb, length(dAmb2))) * (0.38 + 2.8 * depth);

        if (uShadowMode == 1) {
          ambShadow = max(ambShadow, clamp(crease + castAmb, 0.0, 0.72));
          sunBlock  = max(sunBlock,  clamp(castAmb * 1.55 + crease * 0.85, 0.0, 0.92));
        } else {
          // Hybrid (shadow=2): grounded gallery ambient shadow + dramatic grazing Komorebi sun-cast shadow!
          float tGrazing = 1.0 / max(0.19, ndlWall);
          vec2 offSun = vec2(
            clamp(-uSunDir.z * depth * tGrazing * 0.85, -0.155, 0.020),
            clamp(-uSunDir.y * depth * tGrazing * 2.85, -0.125, -0.018)
          );
          float penSun = 0.008 + 0.30 * depth;
          vec2 dSun2 = max(vec2(max(b.x + offSun.x - s, s - (b.y + offSun.x)), max(b.z + offSun.y - y, y - (b.w + offSun.y))), 0.0);
          float castSun = 1.0 - smoothstep(0.0, penSun, length(dSun2));
          float sunGate = smoothstep(0.005, 0.085, ndlWall);
          ambShadow = max(ambShadow, clamp(crease + castAmb * 0.82 + castSun * 0.24 * sunGate, 0.0, 0.75));
          sunBlock  = max(sunBlock,  clamp(castSun * 0.95 * sunGate + castAmb * 0.48 + crease * 0.80, 0.0, 0.96));
        }
      }
    }

    void evalWallCornerCasingAO(bool isRight, float s, float y, out float aoOut, out float propSunBlk, out float sconceArmShade) {
      aoOut = 1.0;
      propSunBlk = 0.0;
      sconceArmShade = 0.0;
      if (uShadowMode <= 0) return;

      float ao = 1.0;
      // Baseboard top lip contact shadow (y = 0.285m) + floor corner grounding
      if (y > 0.280 && y < 0.355) ao *= mix(0.74, 1.0, smoothstep(0.284, 0.345, y));
      ao *= mix(0.84, 1.0, smoothstep(0.0, 0.58, y));
      // Cornice & ceiling junction darkening
      float cTop = (s > 17.30) ? 3.80 : 3.89;
      ao *= mix(0.80, 1.0, smoothstep(0.0, 0.34, cTop - y));
      // Crisp drop shadow immediately underneath the 3D picture rail (y = 3.418m)
      if (s < 17.0 && y < 3.422 && y > 3.340) {
        ao *= mix(0.68, 1.0, smoothstep(3.418, 3.350, y));
      }
      // Vertical room corners (window wall s=20.72, arch pilasters s=17.0..17.3, entrance foyer)
      ao *= mix(0.78, 1.0, smoothstep(0.0, 0.38, 20.72 - s));
      if (abs(s - 17.15) < 0.46) ao *= mix(0.80, 1.0, smoothstep(0.14, 0.46, abs(s - 17.15)));
      ao *= mix(0.84, 1.0, smoothstep(0.0, 0.42, s + 6.0));

      // 5 Sculpted 6-Panel Door Casings (R: 4.90, 14.80; L: 4.90, 9.42, 14.80; outer architrave half-width = 0.68m, h = 2.98m)
      if (s > 0.0 && s < 16.95 && y < 3.12) {
        float sDC = abs(s - 4.90) < abs(s - 14.80) ? 4.90 : 14.80;
        if (!isRight && abs(s - 9.42) < abs(s - sDC)) sDC = 9.42;
        float dsD = abs(s - sDC);
        if (y <= 3.00 && dsD > 0.665 && dsD < 0.80) {
          float awayWin = (s < sDC) ? 1.38 : 0.78;
          float jambSh = exp(-max(0.0, dsD - 0.680) / (s < sDC ? 0.036 : 0.018)) * 0.36 * awayWin;
          ao *= 1.0 - clamp(jambSh, 0.0, 0.48);
          propSunBlk = max(propSunBlk, clamp(jambSh * 1.6, 0.0, 0.85));
        }
        if (dsD < 0.74 && abs(y - 2.98) < 0.065) {
          ao *= 1.0 - exp(-abs(y - 2.98) / 0.024) * 0.32;
        }
      }

      // Exact Cast-Iron Radiators from arch_layout.json:
      //   Wall L: s = 3.615 (w: [-0.40..+0.36], h: [0..0.656], sticks out 22cm!)
      //   Wall R: s = 11.314 (right in sunlit Crab Walk!)
      // Casts unmistakable downward & away-from-window (-s) shadow onto BOTH plaster wall AND 3D baseboard!
      if (y < 0.74) {
        float sRad = isRight ? 11.314 : 3.615;
        // Shifted away from window (-0.075m) & downward (-0.045m) because radiator stands 22cm proud of wall!
        float sLo = sRad - 0.485, sHi = sRad + 0.375;
        vec2 dRad = max(vec2(max(sLo - s, s - sHi), y - 0.645), 0.0);
        float radSh = (1.0 - smoothstep(0.0, 0.068, length(dRad))) * 0.56;
        // Subtle slatted fin shadow fingers along away-from-window edge!
        float finWave = 0.86 + 0.14 * sin((s - sRad) * 92.0);
        ao *= 1.0 - clamp(radSh * finWave, 0.0, 0.58);
        propSunBlk = max(propSunBlk, clamp(radSh * 1.65, 0.0, 0.94));
      }

      // 11 Brass Sconce Backplates & Swan-Neck Brackets (y = 2.40m, sticks out 18.5cm!)
      // Casts crisp downward & away-from-window bracket shadow below the brass collar where the shade blocks ceiling/window light!
      for (int i = 0; i < 12; i++) {
        if (i >= uSconceCount) break;
        vec4 sc = uSconces[i];
        if ((isRight && sc.x < 0.0) || (!isRight && sc.x > 0.0)) continue;
        // Backplate contact ring at (sc.z, sc.y + 0.012) + downward/away-from-window arm cast shadow at (sc.z - 0.042, sc.y - 0.105)
        float dPlate = length(vec2((s - sc.z) * 1.15, (y - (sc.y + 0.012)) * 0.92));
        float dArmSh = length(vec2((s - (sc.z - 0.042)) * 1.25, (y - (sc.y - 0.115)) * 0.88));
        float shP = (1.0 - smoothstep(0.038, 0.085, dPlate)) * 0.44;
        float shA = (1.0 - smoothstep(0.025, 0.115, dArmSh)) * 0.42;
        float shTot = max(shP, shA);
        if (shTot > 0.002) {
          ao *= 1.0 - shTot;
          sconceArmShade = max(sconceArmShade, clamp(shTot * 1.65, 0.0, 0.78));
          propSunBlk = max(propSunBlk, clamp(shTot * 1.4, 0.0, 0.80));
        }
      }

      // 5 Bevelled Brass Toggle Switches at y = 1.18m (R: 3.968, 13.878; L: 5.85, 8.48, 13.84)
      if (abs(y - 1.165) < 0.11) {
        float sSw = 999.0;
        if (isRight) {
          sSw = abs(s - 3.968) < abs(s - 13.878) ? 3.968 : 13.878;
        } else {
          sSw = abs(s - 5.85) < abs(s - 8.48) ? 5.85 : 8.48;
          if (abs(s - 13.84) < abs(s - sSw)) sSw = 13.84;
        }
        vec2 dSw = max(vec2(abs(s - (sSw - 0.010)) - 0.042, abs(y - 1.168) - 0.064), 0.0);
        float swSh = (1.0 - smoothstep(0.0, 0.018, length(dSw))) * 0.38;
        ao *= 1.0 - swSh;
      }

      aoOut = clamp(ao, 0.34, 1.0);
    }

    /* --- DROP 1B: SPLASHES WITH BODY (3 ARRIVAL WAVES + KUBELKA-MUNK STAIN + HIGH-CONTRAST MEDINA BRUSHWORK) --- */
    void evalSplashWithBody(
      int surfKind,
      float s,
      float coord,
      float tooth,
      out vec3 pigSRGB,
      out vec3 layersOut,
      out float rimPool,
      out float reliefHeight,
      out vec2 brushTexOut
    ) {
      pigSRGB = vec3(0.937, 0.914, 0.871);
      layersOut = vec3(0.0);
      rimPool = 0.0;
      reliefHeight = 0.0;
      brushTexOut = vec2(0.5, tooth);
      if (uPaintActive < 0.5 || s < -1.8 || s > 20.70) return;
      if (surfKind == 3 && uFloorSpread <= 0.005) return;
      if (surfKind == 4 && uCeilingPaint <= 0.005) return;

      float sideSeed = (surfKind == 2) ? 5.7 : ((surfKind == 4) ? 2.8 : ((surfKind == 3) ? 9.1 : 0.0));
      float crossM = coord;
      if (surfKind == 4) crossM = 3.89 + (coord + 1.42);
      else if (surfKind == 2) crossM = 6.73 + (3.89 - coord);
      else if (surfKind == 3) crossM = 10.62 + (coord + 1.42) * 1.35;

      vec2 pm = vec2(s, crossM);
      vec2 pmNoise = (surfKind == 3) ? vec2(s * 0.62, coord * 2.35 + 11.0) : pm;

      vec4 poreA = texture2D(uWaterPore, pmNoise * 0.155 + vec2(sideSeed * 0.13, sideSeed * 0.07));
      vec4 poreB = texture2D(uWaterPore, pmNoise * 0.215 + vec2(0.37, 0.61));
      float c1 = poreA.r, c2 = poreA.g, macroPore = poreA.b, domeMix = poreA.a;
      float c3 = poreB.g * 0.62 + poreB.r * 0.38;

      // Sample painterly medium map at bold architectural brush-sweep scale (25-55cm strokes) + mip-safe close-up tooth!
      float bStroke = 0.5, bGrain = tooth, bRelief = 0.5;
      if (uSplashMode == 2) {
        float scU = uSplashParams.x * 0.68;
        vec2 uvM1 = vec2(pm.x * scU * mix(1.0, 0.46, uSplashParams.w), pm.y * scU * 0.92) + vec2(sideSeed * 0.17, sideSeed * 0.11);
        vec2 uvM2 = mat2(0.84, -0.54, 0.54, 0.84) * (pm * scU * 1.55) + vec2(0.31, 0.67);
        vec3 m1 = texture2D(uSplashMedium, uvM1).rgb;
        vec3 m2 = texture2D(uSplashMedium, uvM2).rgb;
        float distFade = 1.0 / (1.0 + max(fwidth(pm.x), fwidth(pm.y)) * 42.0);
        bStroke = clamp(0.5 + ((m1.r * 0.76 + m2.r * 0.24) - 0.5) * (1.65 * uSplashParams.y), 0.0, 1.0);
        bGrain  = clamp(0.5 + ((m1.g * 0.65 + m2.g * 0.35) - 0.5) * (0.95 * distFade + 0.30), 0.0, 1.0);
        bRelief = m1.b * 0.72 + m2.b * 0.28;
      }
      brushTexOut = vec2(bStroke, bGrain);

      // Cross-corridor envelope
      float crossPenalty = 0.0;
      if (surfKind == 4) {
        crossPenalty = (1.42 - abs(coord)) * 0.22;
      } else if (surfKind == 3) {
        float halfW = (s > 17.30) ? 0.87 : 1.42;
        float distBaseboard = halfW - abs(coord);
        float plankFinger = (poreB.b - 0.44) * 0.88 + (macroPore - 0.48) * 0.36 + (bStroke - 0.5) * 0.44;
        float maxReach = mix(0.02, halfW * 1.48, uFloorSpread);
        float normInward = max(0.0, distBaseboard - plankFinger * 0.58) / max(0.08, maxReach);
        crossPenalty = pow(normInward, 1.42) * 0.72;
      } else {
        crossPenalty = smoothstep(0.0, 0.65, abs(coord - 1.95) - 1.42) * 0.22;
      }

      float leadDist = s - uPaintFrontS;
      if ((uLandingMode == 3 || uLandingMode == 4) && surfKind == 3) {
        leadDist -= 1.35 * (1.0 - smoothstep(3.8, 8.6, s)) * uLandingRamp;
      }
      float wiggFbm = texture2D(uWaterPore, vec2(crossM * 0.11 + sideSeed * 0.09, s * 0.038)).b;
      float frontWiggle = (wiggFbm - 0.48) * 1.75 + (c1 - 0.5) * 0.95 + (bStroke - 0.5) * 0.75;
      float aheadDist = leadDist + frontWiggle;

      float poreField = 0.52 * macroPore + 0.48 * domeMix;
      float capMax = (surfKind == 3) ? 0.74 : 0.64;
      float capBase = (surfKind == 3) ? 0.14 : 0.04;
      float steadyCap = clamp(capBase + 0.84 * poreField - crossPenalty * 0.58, 0.0, capMax);
      float calmEntrance = smoothstep(-1.6, 0.2, s);

      float wRise1 = clamp((aheadDist - crossPenalty * 1.06) * 0.36, 0.0, 0.74);
      float wRise2 = clamp((aheadDist - 1.85 - crossPenalty * 1.14) * 0.33, 0.0, 0.68);
      float wRise3 = clamp((aheadDist - 3.70 - crossPenalty * 1.22) * 0.30, 0.0, 0.62);

      float raw1 = min(wRise1, steadyCap) * calmEntrance;
      float raw2 = min(wRise2, steadyCap * 0.92) * calmEntrance;
      float raw3 = min(wRise3, steadyCap * 0.85) * calmEntrance;
      float satGate = smoothstep(-1.25, -0.10, aheadDist) * smoothstep(0.68, 0.82, domeMix);
      raw1 = max(raw1, satGate * 0.36 * calmEntrance * step(crossPenalty, 0.74));
      if (raw1 <= 0.004) return;

      pigSRGB = pickS5WavePigment(s, surfKind == 3 ? coord * 2.2 : crossM, sideSeed, c1, poreB.b, surfKind == 3);

      // Strong dry-brush & bristle edge breakup!
      float strokeEdge = (uSplashMode == 2) ? ((bStroke - 0.5) * 0.34 + (bGrain - 0.5) * 0.24) : ((tooth - 0.5) * 0.11);
      float phi1 = raw1 + (c1 - 0.48) * 0.30 * smoothstep(0.01, 0.16, raw1) + strokeEdge * 0.82;
      float aa1 = clamp(fwidth(phi1) * 1.2, 0.004, 0.028);
      float g1 = smoothstep(0.20 - aa1, 0.20 + aa1, phi1);
      if (g1 <= 0.002) return;

      float phi2 = raw2 + (c2 - 0.47) * 0.27 * smoothstep(0.03, 0.20, raw2) + strokeEdge * 1.25;
      float aa2 = clamp(fwidth(phi2) * 1.2, 0.004, 0.028);
      float g2 = smoothstep(0.33 - aa2, 0.33 + aa2, phi2);

      // Layer 3 catches dry-brush bristles, Medina canvas weave & plaster ridges!
      float dryCatch = (uSplashMode == 2) ? ((bGrain - 0.48) * 0.42 + (bStroke - 0.49) * 0.34) : ((tooth - 0.47) * 0.22);
      float phi3 = raw3 + (c3 - 0.46) * 0.25 * smoothstep(0.06, 0.26, raw3) + dryCatch;
      float aa3 = clamp(fwidth(phi3) * 1.25, 0.004, 0.032);
      float g3 = smoothstep(0.45 - aa3, 0.45 + aa3, phi3);

      rimPool = exp(-pow((phi1 - 0.206) / 0.024, 2.0)) * 0.52 * g1
              + exp(-pow((phi2 - 0.336) / 0.025, 2.0)) * 0.38 * g2;

      float landScale = 1.0;
      if ((uLandingMode == 2 || uLandingMode == 4) && surfKind != 3) {
        float clearBell = exp(-pow((s - 6.15) / 2.25, 2.0));
        landScale *= mix(1.0, 0.18, clearBell * uLandingRamp);
      }
      if ((uLandingMode == 3 || uLandingMode == 4) && surfKind == 3) {
        float calmFl = mix(0.14, 1.0, smoothstep(3.8, 8.8, s));
        landScale *= mix(1.0, calmFl, uLandingRamp);
      }

      float surfScale = (surfKind == 3) ? 0.96 : ((surfKind == 4) ? (0.72 * uCeilingPaint) : 0.92);
      layersOut = vec3(g1, g2, g3) * (landScale * surfScale);
      rimPool *= landScale * surfScale;

      float edgeBead = rimPool * 0.65 + g1 * 0.22 + g2 * 0.45 + g3 * 0.85;
      float medH = (uSplashMode == 2)
        ? (0.34 + bRelief * 0.95)
        : (0.50 + (tooth - 0.5) * 0.28);
      reliefHeight = edgeBead * medH * uSplashParams.z;
    }

    // 2-Constant Kubelka-Munk Optical Stain + Washed Aquarelle Dilution + Bold Painterly Brush Sweeps
    vec3 applyKubelkaMunkSplash(vec3 substrateSRGB, vec3 pigSRGB, vec3 layers, float rimPool, vec2 brushTex, float plasterTooth) {
      vec3 subLin = srgbToLin(substrateSRGB);
      vec3 pigLin = srgbToLin(pigSRGB);
      // Primary modulation from sweeping 25-50cm brushstrokes (1.0 - brushTex.x), accented by fine tooth (brushTex.y)!
      float strokeLoad = (uSplashMode == 2)
        ? clamp(0.36 + (1.0 - brushTex.x) * 1.05 + (brushTex.y - 0.5) * 0.42 + (0.5 - plasterTooth) * 0.32, 0.16, 1.50)
        : clamp(0.60 + (0.52 - plasterTooth) * 0.85, 0.32, 1.30);
      float drySkip = smoothstep(0.20, 0.48, strokeLoad);
      float washDepthScale = 0.52 + 0.48 * clamp(uPaintSat, 0.15, 1.0);
      float stainDepth = (((layers.x * 0.30 + layers.y * 0.36 + layers.z * 0.28) * strokeLoad * drySkip) + rimPool * 0.56) * washDepthScale;
      vec3 trans = pow(clamp(pigLin, vec3(0.055), vec3(0.994)), vec3(stainDepth));
      vec3 stained = subLin * trans;
      float subMicro = clamp(dot(subLin, vec3(0.333)) / 0.85, 0.76, 1.16);
      vec3 bodyPig = pigLin * subMicro * (0.90 + 0.18 * brushTex.y) * (1.0 - rimPool * 0.12);
      float bodyMix = clamp((layers.y * 0.12 + layers.z * 0.22) * drySkip * (0.28 + 0.72 * uPaintSat), 0.0, 0.36);
      return clamp(mix(stained, bodyPig, bodyMix), 0.0, 1.0);
    }

    vec3 evalOakAlbedoSRGB(vec2 uvWood, float plankSeed, float seamDark) {
      float grainFine = vnoise(vec2(uvWood.x * 68.0 + plankSeed * 7.1, uvWood.y * 5.2 + plankSeed * 3.3));
      float grainCathedral = 0.5 + 0.5 * sin(uvWood.x * 26.0 + fbm3(vec2(uvWood.x * 9.0 + plankSeed, uvWood.y * 1.8)) * 5.5);
      float plankTone = hash12(vec2(plankSeed, 11.7));
      vec3 oakDark = vec3(0.565, 0.365, 0.198);
      vec3 oakMid  = vec3(0.682, 0.468, 0.272);
      vec3 oakGold = vec3(0.748, 0.535, 0.318);
      vec3 c = mix(oakDark, oakMid, clamp(0.35 + 0.45 * plankTone + 0.25 * grainFine, 0.0, 1.0));
      c = mix(c, oakGold, grainCathedral * 0.32);
      return c * (1.0 - seamDark);
    }

    void main() {
      vec3 P = vec3(vWorldPos.x, vWorldPos.y, -vWorldPos.z);
      vec3 N = normalize(vec3(vWorldNorm.x, vWorldNorm.y, -vWorldNorm.z));
      vec3 camP = vec3(cameraPosition.x, cameraPosition.y, -cameraPosition.z);
      vec3 rd = normalize(P - camP);

      /* --- 12, 14, 15 & 17: TRUE-PIGMENT MUSEUM GALLERY ARTWORK & WALL LABEL PLAQUES --- */
      if (uSurfType == 12 || uSurfType == 14 || uSurfType == 15 || uSurfType == 17) {
        vec2 uvSample = vUv;
        if (uSurfType == 15) {
          uvSample = vec2(
            (uStripCell.x + clamp(vUv.x, 0.002, 0.998)) / 6.0,
            (3.0 - uStripCell.y + clamp(vUv.y, 0.002, 0.998)) / 4.0
          );
        } else if (uFlipV > 0.5) {
          uvSample = vec2(vUv.x, 1.0 - vUv.y);
        }
        vec4 artTexel = texture2D(uArtTex, uvSample);
        vec3 albedoLin = srgbToLin(artTexel.rgb);
        float edgeDist = min(min(vUv.x, 1.0 - vUv.x), min(vUv.y, 1.0 - vUv.y));
        float rabbetAO = (uSurfType == 12) ? mix(0.95, 1.0, smoothstep(0.0, 0.014, edgeDist)) : 1.0;
        vec3 E_sun = evalDirectSun(P + N * 0.012, uStyle);
        float ndl = max(0.0, dot(N, uSunDir));
        vec3 scDiff, scSpec;
        evalSconceWash(P, N, rd, 0.85, scDiff, scSpec);
        vec3 lit = albedoLin * rabbetAO * (vec3(0.995, 0.990, 0.982) + E_sun * (ndl * 0.22 + 0.02) + scDiff * 0.14);
        lit = lit / (1.0 + max(vec3(0.0), lit - vec3(0.88)) * 0.55);
        gl_FragColor = vec4(linToSrgb(clamp(lit, 0.0, 1.0)), 1.0);
        return;
      }

      /* --- 13 & 16: 3D BEVELLED GALLERY FRAMES, CREAM MATS, MOULDED PICTURE RAIL & STEPPED BASEBOARD --- */
      if (uSurfType == 13 || uSurfType == 16) {
        vec3 Ntrim = N;
        float trimRough = 0.42;
        float normGain = mix(0.28, 0.68, clamp(uTexStrength / 1.1, 0.0, 1.0));
        if ((uSurfType == 16 || uSurfType == 13) && uHasTrimPBR > 0.5) {
          vec3 nrT = texture2D(uTrimNormRough, vec2(P.z * 1.8, P.y * 2.4 + P.x * 1.8)).rgb;
          vec2 nXY = (nrT.rg * 2.0 - 1.0) * normGain * (uSurfType == 13 ? 0.75 : 1.0);
          Ntrim = normalize(N + vec3(0.0, nXY.y, nXY.x));
          trimRough = clamp(nrT.b, 0.28, 0.65);
        }
        float brush = fbm3(vec2(P.z * 14.0 + P.x * 14.0, P.y * 34.0)) - 0.5;
        float finePore = (trimRough - 0.38) * (0.10 + 0.14 * uTexStrength) + brush * (0.045 * uClarityStrength);
        float lightTintMask = smoothstep(0.20, 0.65, dot(uSolidTint, vec3(0.333)));
        vec3 albedoLin = clamp(uSolidTint * (1.0 + finePore * 1.35) + finePore * 0.08 * lightTintMask, 0.0, 1.0);
        vec3 E_ind = evalIndirectRadiosity(P, Ntrim, uStyle);
        vec3 E_sun = evalDirectSun(P + N * 0.012, uStyle);
        float ndl = max(0.0, dot(Ntrim, uSunDir));
        vec3 Hvec = normalize(uSunDir - rd);
        float spec = pow(max(0.0, dot(Ntrim, Hvec)), 28.0) * (uSurfType == 16 ? 0.11 : 0.06) * ndl;
        vec3 scDiff, scSpec;
        evalSconceWash(P, Ntrim, rd, trimRough, scDiff, scSpec);
        if (uSurfType == 16) {
          float trimAO = 1.0, trimSunBlk = 0.0, dummyScSh = 0.0;
          if (uShadowMode > 0 && abs(P.x) > 0.75) {
            evalWallCornerCasingAO(P.x > 0.0, P.z, P.y, trimAO, trimSunBlk, dummyScSh);
            trimAO *= mix(0.80, 1.0, smoothstep(0.0, 0.045, P.y));
          }
          vec3 trimKey = E_ind + vec3(0.38, 0.365, 0.34) + scDiff * 0.85;
          vec3 sunT = E_sun * (1.0 - trimSunBlk);
          vec3 litT = applyWarmAO(albedoLin * (trimKey + sunT * (ndl * 1.15 + 0.05)) + sunT * spec + scSpec, trimAO);
          gl_FragColor = vec4(linToSrgb(galleryFilmMap(litT)), 1.0);
          return;
        }
        float isMat = smoothstep(0.25, 0.65, dot(albedoLin, vec3(0.333)));
        vec3 frameKey = mix(E_ind * 1.25 + vec3(0.22) + scDiff * 0.45, mix(vec3(0.95, 0.94, 0.92), E_ind * 1.45, 0.25), isMat);
        vec3 lit = albedoLin * (frameKey + E_sun * (ndl * 0.35 + 0.03)) + E_sun * spec + scSpec * 0.5;
        lit = lit / (1.0 + max(vec3(0.0), lit - vec3(0.90)) * 0.50);
        gl_FragColor = vec4(linToSrgb(clamp(lit, 0.0, 1.0)), 1.0);
        return;
      }

      /* --- 10: 3D EASEL STAND WHOLE POSTER FACE (015.jpg Full-Res 1760x2200) --- */
      if (uSurfType == 10) {
        vec2 uvP = uFlipV > 0.5 ? vec2(vUv.x, 1.0 - vUv.y) : vUv;
        vec3 posterSRGB = texture2D(uArtTex, uvP).rgb;
        float paperTooth = vnoise(uvP * 380.0);
        vec3 albedoLin = srgbToLin(clamp(posterSRGB * (0.992 + 0.018 * paperTooth), 0.0, 1.0));
        vec3 E_ind = evalIndirectRadiosity(P, N, uStyle);
        vec3 sunAtBoard = evalDirectSun(P + vec3(0.0, 0.0, 0.03), uStyle);
        float frontDot = max(0.0, dot(N, uSunDir));
        float spineMask = smoothstep(0.030, 0.070, abs(uvP.x - 0.5));
        vec3 transmittedGlow = sunAtBoard * vec3(1.0, 0.85, 0.64) * (0.14 * spineMask + 0.04);
        float slashNear = exp(-pow((6.15 - clamp(6.15, uPatchRange.x - 0.8, uPatchRange.y + 0.8)) / 2.2, 2.0)) * uFxGain;
        float diagBand = 0.5 + 0.5 * sin((uvP.x * 6.8 - uvP.y * 8.2) * PI * 1.15);
        vec3 bounceBands = vec3(1.0, 0.78, 0.46) * (diagBand * slashNear * 0.08 * uBounceGain);
        vec3 posterKey = mix(vec3(0.92, 0.90, 0.86), E_ind * 1.38, 0.34);
        vec3 heroPicLight = vec3(0.0);
        if (uLandingMode == 1 || uLandingMode == 4) {
          float spotGain = (uLandingMode == 4 ? 0.88 : 1.0) * uLandingRamp;
          float cone = exp(-pow(length((uvP - vec2(0.5, 0.56)) * vec2(1.15, 0.92)), 2.0) * 1.25);
          heroPicLight = vec3(1.0, 0.945, 0.84) * (0.24 * cone + 0.05) * spotGain;
        }
        vec3 lit = albedoLin * (posterKey + heroPicLight + sunAtBoard * frontDot * 0.45 + transmittedGlow + bounceBands);
        lit = lit / (1.0 + max(vec3(0.0), lit - vec3(0.86)) * 0.52);
        gl_FragColor = vec4(linToSrgb(clamp(lit, 0.0, 1.0)), 1.0);
        return;
      }

      /* --- 11: 3D HONEY-OAK EASEL STAND JOINERY --- */
      if (uSurfType == 11) {
        vec3 pLocal = worldToEaselYaw(P);
        vec3 oakSRGB = evalOakAlbedoSRGB(vec2(pLocal.x * 3.5 + pLocal.z * 2.0, pLocal.y * 2.2), 4.0, 0.0);
        oakSRGB = applyLightroomPore(oakSRGB, vec2(pLocal.x * 2.5 + pLocal.z, pLocal.y * 1.8), 0.14, 0.12);
        vec3 albedoLin = srgbToLin(oakSRGB);
        vec3 E_ind = evalIndirectRadiosity(P, N, uStyle) + vec3(0.18, 0.16, 0.13);
        if (uLandingMode == 1 || uLandingMode == 4) {
          float spotGain = (uLandingMode == 4 ? 0.88 : 1.0) * uLandingRamp;
          vec3 dirSpot = normalize(vec3(0.06, 3.38, 4.55) - P);
          E_ind += vec3(1.0, 0.92, 0.78) * (max(0.0, dot(N, dirSpot)) * 0.42 + 0.10) * spotGain;
        }

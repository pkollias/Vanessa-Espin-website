        vec3 sunDirect = evalDirectSun(P + N * 0.015, uStyle);
        float ndl = max(0.0, dot(N, uSunDir));
        vec3 Hvec = normalize(uSunDir - rd);
        float spec = pow(max(0.0, dot(N, Hvec)), 26.0) * 0.22 * ndl;
        float aoLeg = smoothstep(0.0, 0.18, P.y) * 0.25 + 0.75;
        if (uShadowMode > 0) {
          aoLeg *= mix(0.76, 1.0, smoothstep(0.0, 0.28, P.y));
        }
        vec3 lit = applyWarmAO(albedoLin * (E_ind + sunDirect * (ndl * 1.25 + 0.08)) + sunDirect * spec, aoLeg);
        gl_FragColor = vec4(linToSrgb(galleryFilmMap(lit)), 1.0);
        return;
      }

      /* --- 6 & 18: SUNLIT SEMICIRCULAR ARCHED WINDOW WALL (6 @ z=-20.72) + EXTERIOR SPRING TREES/SKY PLATE (18 @ z=-20.98) --- */
      if (uSurfType == 6 || uSurfType == 18) {
        float sdW = sdRoundArch(P.xy, 0.72, 0.78, 2.33);
        if (uSurfType == 6 && uHas3DWindow > 0.5 && sdW < -0.002) {
          discard;
        }
        if (uSurfType == 18 || sdW <= 0.025) {
          if (uSurfType == 6 && uHas3DWindow < 0.5) {
            float barTrans; vec2 bevelG;
            evalWindowGlazing(P.xy, 0.004, barTrans, bevelG);
            if (sdW > -0.028 || barTrans < 0.62) {
              vec3 barCol = (uWindowMode > 0) ? vec3(0.42, 0.40, 0.37) : vec3(0.945, 0.932, 0.905);
              gl_FragColor = vec4(barCol, 1.0);
              return;
            }
          }
          if (uWindowMode > 0 && uHasWindowPlate > 0.5) {
            // Crisp real-surroundings daylight spring trees & pale sky plate with subtle breeze sway!
            vec2 sway = vec2(sin(uTime * 0.92 + P.y * 2.1) * 0.0045, cos(uTime * 0.74 + P.x * 2.4) * 0.0030);
            vec2 uvWin = vec2(clamp((P.x + 0.78) / 1.56, 0.01, 0.99), clamp((3.08 - P.y) / 2.34, 0.01, 0.99)) + sway;
            vec3 plateSRGB = texture2D(uArtTex, uvWin).rgb;
            float sunHalo = exp(-length(P.xy - vec2(-uSunDir.x * 2.8, 1.15 + uSunDir.y * 2.8)) * 1.65);
            plateSRGB = clamp(plateSRGB + vec3(1.0, 0.97, 0.89) * sunHalo * 0.10, 0.0, 1.0);
            gl_FragColor = vec4(plateSRGB, 1.0);
            return;
          }
          float warmT = 1.0 - smoothstep(7.0, 32.0, uSunElevDeg);
          vec3 skyTop = mix(vec3(0.83, 0.90, 0.98), vec3(0.99, 0.92, 0.81), warmT * 0.80);
          vec3 skyHorizon = vec3(0.998, 0.988, 0.962);
          float hFrac = clamp((P.y - 0.78) / 2.28, 0.0, 1.0);
          vec3 glassSky = mix(skyHorizon, skyTop, pow(hFrac, 0.85) * 0.64);
          vec2 extP = P.xy * 0.82 + uSunDir.xy * 0.45 + vec2(sin(uTime * 0.85 + P.y) * 0.028, cos(uTime * 0.68) * 0.018);
          float treeBokeh1 = fbm4(extP * 2.4 + vec2(2.3, 5.1));
          float treeBokeh2 = fbm3(extP * 4.6 + vec2(7.1, 1.9));
          vec3 sunlitFoliage = mix(vec3(0.79, 0.85, 0.72), vec3(0.94, 0.89, 0.73), warmT * 0.75 + treeBokeh2 * 0.25);
          vec3 brickHint = vec3(0.89, 0.81, 0.74);
          float foliageMask = smoothstep(0.30, 0.66, treeBokeh1) * smoothstep(0.95, 0.18, hFrac);
          glassSky = mix(glassSky, sunlitFoliage, foliageMask * 0.62);
          glassSky = mix(glassSky, brickHint, smoothstep(0.28, 0.0, hFrac) * 0.18);
          float sunHalo = exp(-length(P.xy - vec2(-uSunDir.x * 3.2, 0.95 + uSunDir.y * 3.2)) * 1.45);
          glassSky = clamp(glassSky + vec3(1.0, 0.95, 0.84) * sunHalo * 0.22, 0.0, 1.0);
          gl_FragColor = vec4(glassSky, 1.0);
          return;
        }
        bool winTrim = (uHas3DWindow < 0.5) && (sdW < 0.11 && P.y >= 0.70);
        vec3 wBase = winTrim ? vec3(0.975, 0.968, 0.948) : vec3(0.942, 0.920, 0.880);
        vec3 Nw = N;
        float plNormGainW = mix(0.28, 0.78, clamp(uTexStrength / 1.0, 0.0, 1.25));
        if (!winTrim && uHasPlasterPBR > 0.5) {
          vec2 nXYw; float rW; float tW;
          evalDualScalePlaster(P.xy / uPlasterTile, plNormGainW, 0.42, 1.55, wBase, nXYw, rW, tW);
          Nw = normalize(N + vec3(nXYw.x, nXYw.y, 0.0));
        } else if (!winTrim) {
          wBase = applyLightroomPore(wBase, P.xy, 0.14, 0.14);
        }
        vec3 wAlb = srgbToLin(wBase);
        float aoW = smoothstep(0.0, 0.35, P.y) * (0.85 + 0.15 * smoothstep(0.0, 0.25, 0.87 - abs(P.x)));
        if (uShadowMode > 0) {
          // Crisp window-casing edge crease + backlit wall contrast + radiator_W_window cast shadow!
          if (sdW > 0.0 && sdW < 0.20) {
            aoW *= 1.0 - exp(-max(0.0, sdW - 0.095) / 0.026) * 0.32;
          }
          aoW *= mix(0.80, 1.0, smoothstep(0.0, 0.32, 0.87 - abs(P.x)))
               * mix(0.82, 1.0, smoothstep(0.0, 0.30, 3.80 - P.y));
          if (P.y < 0.72) {
            vec2 dRadW = max(vec2(max(-0.42 - P.x, P.x - 0.38), P.y - 0.65), 0.0);
            aoW *= 1.0 - (1.0 - smoothstep(0.0, 0.065, length(dRadW))) * 0.54;
          }
        }
        vec3 E_winInd = evalIndirectRadiosity(P, Nw, uStyle) * (uWindowMode > 0 ? 1.12 : 1.24);
        if (uHasCyclesGI > 0.5) {
          vec2 uvWinWall = vec2(mix(0.671875, 0.996094, clamp((P.x + 0.87) / 1.74, 0.0, 1.0)), mix(0.007813, 0.492188, clamp(P.y / 3.80, 0.0, 1.0)));
          vec3 eBakedW = srgbToLin(texture2D(uVestGI, uvWinWall).rgb) / srgbToLin(vec3(0.8065, 0.7610, 0.6996));
          E_winInd *= mix(vec3(1.0), clamp(eBakedW, 0.55, 1.65), 0.72);
        }
        vec3 litW = applyWarmAO(wAlb * E_winInd, aoW);
        gl_FragColor = vec4(linToSrgb(galleryFilmMap(litW)), 1.0);
        return;
      }

      /* --- 3: PHOTOGRAPHED HONEY-OAK BOARD STRIPS (IYUANA METHOD) OR 2K OAK FALLBACK + WATERCOLOUR SPILL --- */
      if (uSurfType == 3) {
        float stripPitch = (uFloorMode > 0 && uHasFloorStrips > 0.5) ? 0.064 : 0.05917;
        float fx = (P.x + 1.42) / stripPitch;
        float plankIdx = floor(fx);
        float fLocal = fract(fx);

        vec3 oakSRGB;
        vec3 Nfl;
        float oakRough = 0.38;
        float seamDark = 0.0;

        if (uFloorMode > 0 && uHasFloorStrips > 0.5) {
          // Proven Iyuana photographed 8-strip layout: staggered board lengths, flip, calm natural honey-oak tone, anti-aliased joints!
          float bLen = mix(0.58, 1.58, hash12(vec2(plankIdx * 7.13, 3.1)));
          float zz = P.z + hash12(vec2(plankIdx * 1.37, 9.4)) * 4.2;
          float sj = floor(zz / bLen);
          float vBoard = fract(zz / bLen);
          float hBoard = hash12(vec2(plankIdx, sj));
          float stripK = floor(hBoard * 8.0);
          float flipU = step(0.5, fract(hBoard * 13.7));
          float uu = mix(fLocal, 1.0 - fLocal, flipU);
          float vScale = min(bLen / 1.35, 1.0) * 0.96;
          float vo = fract(hBoard * 31.3) * (1.0 - vScale);
          vec2 auv = vec2((stripK + 0.09 + uu * 0.82) / 8.0, vo + vBoard * vScale);

          #ifdef GL_EXT_shader_texture_lod
            vec2 gx = vec2(dFdx(P.x) / stripPitch * 0.82 / 8.0, dFdx(P.z) / 1.35);
            vec2 gy = vec2(dFdy(P.x) / stripPitch * 0.82 / 8.0, dFdy(P.z) / 1.35);
            vec3 woodPhoto = texture2DGradEXT(uFloorStrips, auv, gx, gy).rgb;
          #else
            vec3 woodPhoto = texture2D(uFloorStrips, auv).rgb;
          #endif

          // Calm, narrow board-to-board tone variation (0.91..1.06 — eliminates artificial striped planks!)
          float calmTone = mix(0.91, 1.06, hash12(vec2(sj * 3.1, plankIdx)))
                         * (hash12(vec2(plankIdx, sj * 7.7)) < 0.05 ? 0.88 : 1.0);
          float wu = clamp(fwidth(fx), 0.015, 0.30);
          float wv = clamp(fwidth(zz / bLen), 0.003, 0.15);
          float eu = min(fLocal, 1.0 - fLocal), ev = min(vBoard, 1.0 - vBoard);
          float ju = 1.0 - (1.0 - smoothstep(0.0, 0.032 + wu, eu)) * (0.38 + 0.14 * uClarityStrength) / (1.0 + wu * 5.5);
          float jv = 1.0 - (1.0 - smoothstep(0.0, 0.006 + wv, ev)) * 0.34 / (1.0 + wv * 5.5);
          float gJoint = ju * jv;
          seamDark = 1.0 - gJoint;

          oakSRGB = clamp(woodPhoto * calmTone * gJoint, 0.0, 1.0);
          // Wood pore normal micro-relief derived directly from photographed wood grain!
          float woodLum = dot(woodPhoto, vec3(0.333));
          float gxLum = clamp(dFdx(woodLum), -0.05, 0.05);
          float gzLum = clamp(dFdy(woodLum), -0.05, 0.05);
          float tiltB = (hash12(vec2(plankIdx, sj + 4.2)) - 0.5) * 0.022;
          Nfl = normalize(vec3(tiltB - gxLum * (3.2 * uTexStrength), 1.0, -gzLum * (3.2 * uTexStrength)));
          oakRough = mix(0.26, 0.45, hash12(vec2(plankIdx + 9.0, sj))) + seamDark * 0.45;
        } else {
          float buttZ = fract((P.z + hash12(vec2(plankIdx, 3.7)) * 4.0) / 1.55);
          float pxW = clamp(fwidth(fx), 0.02, 0.32);
          float sideSeam = (1.0 - smoothstep(0.02, 0.02 + pxW, min(fLocal, 1.0 - fLocal))) * (1.0 - smoothstep(0.08, 0.28, pxW));
          float endSeam  = (1.0 - smoothstep(0.004, 0.015, min(buttZ, 1.0 - buttZ))) * 0.48;
          float seamBoost = 1.0 + 0.42 * uClarityStrength;
          seamDark = clamp((sideSeam * 0.17 + endSeam * 0.11) * seamBoost, 0.0, 0.30);
          float tiltN = (hash12(vec2(plankIdx, 9.2)) - 0.5) * (0.024 + 0.022 * uClarityStrength);
          vec2 oakUv = vec2((P.x + 1.42) / 2.84, P.z / uOakTileLen);
          float oakNormGain = mix(0.28, 0.76, clamp(uTexStrength / 1.0, 0.0, 1.25));
          if (uHasOakPBR > 0.5) {
            vec3 pbrOak = texture2D(uOakPBR, oakUv).rgb;
            vec3 nrOak  = texture2D(uOakNormRough, oakUv).rgb;
            float pTone = 1.0 + (hash12(vec2(plankIdx, 11.7)) - 0.5) * (0.10 + 0.10 * uClarityStrength);
            oakSRGB = clamp(pbrOak * pTone, 0.0, 1.0);
            oakSRGB = applyLightroomSampler(oakSRGB, uOakPBR, oakUv, 1.05, 1.15) * (1.0 - seamDark * 0.58);
            Nfl = normalize(vec3((nrOak.r * 2.0 - 1.0) * oakNormGain + tiltN, 1.0, (nrOak.g * 2.0 - 1.0) * oakNormGain));
            oakRough = clamp(nrOak.b, 0.26, 0.76);
          } else {
            oakSRGB = evalOakAlbedoSRGB(vec2(fLocal + plankIdx * 0.17, P.z), plankIdx, seamDark);
            oakSRGB = applyLightroomPore(oakSRGB, vec2(P.x * 2.4, P.z * 0.85), 0.16, 0.16);
            Nfl = normalize(vec3(tiltN, 1.0, 0.0));
          }
        }

        float woodTooth = clamp(oakSRGB.r * 1.38, 0.15, 0.95);
        vec3 albedoLin;
        if (uSplashMode > 0) {
          vec3 pigFl; vec3 flLayers; float flPool; float flRel; vec2 flBrush;
          evalSplashWithBody(3, P.z, P.x, woodTooth, pigFl, flLayers, flPool, flRel, flBrush);
          if (flLayers.x > 0.002) {
            albedoLin = applyKubelkaMunkSplash(oakSRGB, pigFl, flLayers * 0.88, flPool * 0.85, flBrush, woodTooth) * (1.0 - seamDark * 0.45);
          } else {
            albedoLin = srgbToLin(oakSRGB);
          }
        } else {
          vec3 pigSRGB; float flAlpha; float flRim;
          evalPermanentWatercolour(3, P.z, P.x, woodTooth, pigSRGB, flAlpha, flRim);
          if (flAlpha > 0.002) {
            float oakLuma = dot(oakSRGB, vec3(0.33, 0.45, 0.22));
            float grainKeep = clamp(0.96 + (oakLuma - 0.25) * (1.08 + 0.34 * uTexStrength), 0.74, 1.28);
            vec3 mineralWash = mix(pigSRGB, vec3(1.0, 0.985, 0.955), 0.16);
            vec3 targetTint = clamp(mineralWash * grainKeep, 0.0, 1.0);
            float flMix = clamp(flAlpha * 0.96, 0.0, 0.82);
            vec3 glazedOak = oklabToSrgb(mix(srgbToOklab(oakSRGB), srgbToOklab(targetTint), flMix));
            oakSRGB = glazedOak * (1.0 - flRim * (0.30 + 0.12 * uClarityStrength)) * (1.0 - seamDark * 0.58);
          }
          albedoLin = srgbToLin(oakSRGB);
        }

        vec3 E_ind = evalIndirectRadiosity(P, Nfl, uStyle);
        if (uHasCyclesGI > 0.5) {
          vec2 giUv = vec2(clamp((P.x + 1.42) / 2.84, 0.002, 0.998), clamp((P.z + 6.0) / 26.72, 0.002, 0.998));
          vec3 eBakedFl = srgbToLin(texture2D(uFloorGI, giUv).rgb) / srgbToLin(vec3(0.6711, 0.6515, 0.6299));
          E_ind *= mix(vec3(1.0), clamp(eBakedFl, 0.48, 1.65), 0.76);
        }

        vec3 scDiffFl, scSpecFl;
        evalSconceWash(P, Nfl, rd, oakRough, scDiffFl, scSpecFl);
        E_ind += scDiffFl * 0.55;

        if (uLandingMode == 1 || uLandingMode == 4) {
          float spotGain = (uLandingMode == 4 ? 0.88 : 1.0) * uLandingRamp;
          float dStand = length((P.xz - vec2(0.0, 6.05)) * vec2(1.15, 0.82));
          float flPool = exp(-dStand * dStand * 0.85);
          E_ind = E_ind * mix(1.0, mix(0.88, 1.0, flPool), spotGain)
                + vec3(1.0, 0.92, 0.78) * (flPool * 0.34 * spotGain);
        }

        float radFloorSunBlk = 0.0;
        float wallDist = (P.z > 17.30 ? 0.87 : 1.42) - abs(P.x);
        float aoFloor = mix(0.78, 1.0, smoothstep(0.0, 0.30, wallDist));
        if (uShadowMode > 0) {
          // Crisp baseboard-to-floor contact crease + exact radiator floor cast shadows (L: 3.615, R: 11.314, W: 20.72)!
          aoFloor *= mix(0.68, 1.0, smoothstep(0.0, 0.085, wallDist))
                   * mix(0.86, 1.0, smoothstep(0.0, 0.48, wallDist));
          float sRadFl = (P.x > 0.0) ? 11.314 : 3.615;
          if (wallDist < 0.36 && P.z > sRadFl - 0.50 && P.z < sRadFl + 0.40) {
            vec2 dRFl = max(vec2(wallDist - 0.25, max((sRadFl - 0.46) - P.z, P.z - (sRadFl + 0.37))), 0.0);
            float rFlSh = (1.0 - smoothstep(0.0, 0.085, length(dRFl))) * 0.56;
            aoFloor *= 1.0 - rFlSh;
            radFloorSunBlk = clamp(rFlSh * 1.6, 0.0, 0.92);
          }
          // Window radiator floor shadow at s = 20.72, x in [-0.40..+0.36]
          if (P.z > 20.36 && abs(P.x) < 0.48) {
            vec2 dRW = max(vec2((20.72 - P.z) - 0.24, abs(P.x) - 0.39), 0.0);
            aoFloor *= 1.0 - (1.0 - smoothstep(0.0, 0.08, length(dRW))) * 0.54;
          }
        }
        vec3 E_sun = evalDirectSun(P + vec3(0.0, 0.004, 0.0), uStyle) * (1.0 - radFloorSunBlk);
        float ndl = max(0.0, uSunDir.y);

        if (uStandMode > 0) {
          vec3 pEY = worldToEaselYaw(P);
          float dFeet = min(min(length(pEY.xz - vec2(-0.32, 0.12)), length(pEY.xz - vec2(0.32, 0.12))), length(pEY.xz - vec2(0.0, -0.46)));
          aoFloor *= mix(uShadowMode > 0 ? 0.38 : 0.56, 1.0, smoothstep(0.02, 0.26, dFeet));
          if (uShadowMode > 0) {
            float dBoardShadow = length((pEY.xz - vec2(0.0, -0.24)) * vec2(1.35, 1.0));
            aoFloor *= mix(0.74, 1.0, smoothstep(0.10, 0.65, dBoardShadow));
          }
        }

        vec3 R = reflect(rd, Nfl);
        vec3 specGlow = vec3(0.0);
        float glossMod = clamp(1.34 - oakRough * 0.78, 0.62, 1.24);
        float fresnel = (0.04 + 0.34 * pow(1.0 - max(0.0, -rd.y), 4.2)) * glossMod;
        if (R.z > 0.04) {
          float tReflWin = (20.2 - P.z) / R.z;
          vec2 pRefl = P.xy + R.xy * tReflWin;
          float reflMask = exp(-pow(pRefl.x / 0.88, 2.0)) * exp(-pow((pRefl.y - 1.75) / 2.45, 2.0));
          float archClear = smoothstep(1.38, 0.45, abs(P.x));
          float sheenGain = (uFloorMode > 0) ? 0.86 : ((uStyle == 2) ? 1.05 : 0.68);
          vec3 reflCol = mix(vec3(0.98, 0.96, 0.92), vec3(1.0, 0.91, 0.76), 1.0 - smoothstep(7.0, 30.0, uSunElevDeg));
          specGlow = reflCol * (reflMask * archClear * fresnel * sheenGain * (1.0 - seamDark * 0.75));
        }
        // Soft warm wall reflection sheen along corridor edges (Iyuana floor feel!)
        float wallSheen = fresnel * 0.18 * (1.0 - seamDark * 0.75);
        specGlow += vec3(0.95, 0.91, 0.84) * wallSheen * (uFloorMode > 0 ? 1.0 : 0.0);

        float plankSheenVar = 0.88 + 0.24 * hash12(vec2(plankIdx, 21.4));
        vec3 clearcoatSun = E_sun * (0.36 + 0.56 * fresnel) * plankSheenVar * (1.0 - seamDark * 0.85);

        vec3 lit = applyWarmAO(albedoLin * (E_ind + E_sun * (ndl * 2.05 + 0.34)) + clearcoatSun + specGlow + scSpecFl * 0.65, aoFloor);
        gl_FragColor = vec4(linToSrgb(galleryFilmMap(lit)), 1.0);
        return;
      }

      /* --- 4: SCULPTED 1890s PRESSED-TIN COFFERED CEILING + DIRECTIONAL WINDOW RELIEF + GLAZE --- */
      if (uSurfType == 4) {
        float tooth = texture2D(uWaterPore, P.xz * 1.42).g;
        vec3 ceilSRGB = vec3(0.946, 0.928, 0.892) + (tooth - 0.5) * 0.022;
        ceilSRGB = applyLightroomPore(ceilSRGB, P.xz * 1.45, 0.24, 0.22);

        vec3 Nceil = vec3(0.0, -1.0, 0.0);
        float aoCeil = 0.96;
        if (uShadowMode > 0) {
          float wDistC = (P.z > 17.30 ? 0.87 : 1.42) - abs(P.x);
          aoCeil *= mix(0.76, 1.0, smoothstep(0.0, 0.34, wDistC));
        }
        float tinDepth = (uShadowMode > 0 ? 1.38 : 1.0) + 0.52 * uClarityStrength;
        float tinReliefHighlight = 0.0;
        if (P.z < 17.0) {
          float borderW = 1.42 - abs(P.x);
          if (borderW > 0.14) {
            float cellW = (2.84 - 0.28) / 4.0;
            vec2 cGrid = vec2((P.x + 1.28) / cellW, P.z / cellW);
            vec2 f = fract(cGrid) - 0.5;
            vec2 af = abs(f);
            float maxC = max(af.x, af.y);
            if (maxC > 0.32 && maxC < 0.455) {
              // Stepped double-cove Victorian coffer moulding!
              vec2 bevelDir = (af.x > af.y) ? vec2(sign(f.x), 0.0) : vec2(0.0, sign(f.y));
              float stepProfile = sin((maxC - 0.32) / 0.135 * PI * 2.0);
              Nceil = normalize(vec3(-bevelDir.x * (0.95 + 0.35 * stepProfile) * tinDepth, -1.0, -bevelDir.y * (0.95 + 0.35 * stepProfile) * tinDepth));
              aoCeil = clamp(aoCeil * (1.0 - 0.30 * tinDepth * 0.72), 0.54, 0.94);
              tinReliefHighlight = 0.045 * max(0.0, stepProfile);
            } else if (maxC <= 0.32) {
              // Embossed radial Victorian rosette + stamped inner bead frame (maxC ~ 0.26)
              float medR = length(f);
              float angC = atan(f.y, f.x);
              float petals = cos(angC * 12.0) * exp(-pow((medR - 0.105) / 0.055, 2.0));
              float ring1 = exp(-pow((medR - 0.175) / 0.022, 2.0));
              float innerBead = exp(-pow((maxC - 0.265) / 0.014, 2.0));
              float hTin = (ring1 * 0.85 + innerBead * 0.75 + petals * 0.45) * (0.5 + 0.6 * uTexStrength);
              vec2 gTin = vec2(clamp(dFdx(hTin), -0.08, 0.08), clamp(dFdy(hTin), -0.08, 0.08));
              Nceil = normalize(vec3(-gTin.x * 7.5, -1.0, -gTin.y * 7.5));
              tinReliefHighlight = (ring1 * 0.045 + innerBead * 0.038 + max(0.0, petals) * 0.03) * uTexStrength;
              aoCeil = clamp(aoCeil * (1.0 - 0.11 * tinDepth * 0.75 - (1.0 - smoothstep(0.29, 0.32, maxC)) * 0.04), 0.72, 0.96);
            } else {
              // Raised flat coffer stile ribs between recessed panels
              ceilSRGB = mix(ceilSRGB, vec3(0.982, 0.970, 0.944), 0.42);
              tinReliefHighlight = 0.022;
            }
          }
        }

        float cAlpha = 0.0;
        vec3 ceilLin;
        if (uSplashMode > 0 && !(P.z >= 17.0 && P.z <= 17.30)) {
          vec3 pigC; vec3 cLayers; float cPool; float cRel; vec2 cBrush;
          evalSplashWithBody(4, P.z, P.x, tooth, pigC, cLayers, cPool, cRel, cBrush);
          ceilLin = (cLayers.x > 0.002)
            ? applyKubelkaMunkSplash(ceilSRGB, pigC, cLayers, cPool, cBrush, tooth)
            : srgbToLin(ceilSRGB);
        } else {
          vec3 pigC; float cRim;
          evalPermanentWatercolour(4, P.z, P.x, tooth, pigC, cAlpha, cRim);
          if (cAlpha > 0.002 && !(P.z >= 17.0 && P.z <= 17.30)) {
            ceilSRGB = oklabToSrgb(mix(srgbToOklab(ceilSRGB), srgbToOklab(pigC), cAlpha)) * (1.0 - cRim * (0.10 + 0.08 * uClarityStrength));
          }
          ceilLin = srgbToLin(ceilSRGB);
        }
        ceilLin = clamp(ceilLin + tinReliefHighlight, 0.0, 1.0);

        float indSubC = (uSplashMode > 0) ? 0.0 : (cAlpha * 0.85);
        // Directional window-portal grazing across pressed-tin ribs (bright on +z side facing window, crisp shadow on -z leeward step!)
        float winGrazingCeil = (uShadowMode > 0) ? clamp(1.0 + Nceil.z * 0.36, 0.62, 1.28) : 1.0;
        vec3 E_ind = (evalIndirectRadiosity(P, Nceil, uStyle) + vec3(0.30, 0.29, 0.27) * (1.0 - indSubC)) * winGrazingCeil;
        if (uHasCyclesGI > 0.5) {
          vec2 cUv = vec2(clamp((P.z + 6.0) / 26.72, 0.002, 0.998), clamp((P.x + 1.42) / 2.84, 0.002, 0.998));
          vec3 eBakedC = srgbToLin(texture2D(uCeilGI, cUv).rgb) / srgbToLin(vec3(0.75, 0.71, 0.66));
          E_ind *= mix(vec3(1.0), clamp(eBakedC, 0.72, 1.45), 0.55);
        }
        vec3 scDiffC, scSpecC;
        evalSconceWash(P, Nceil, rd, 0.52, scDiffC, scSpecC);
        E_ind += scDiffC * 0.42;
        // Subtle satin painted-tin sheen reflecting sunlit floor & arched window!
        vec3 Rc = reflect(rd, Nceil);
        float tinSpec = (Rc.z > 0.05) ? pow(clamp(Rc.z, 0.0, 1.0), 10.0) * 0.065 * smoothstep(2.0, 18.0, P.z) : 0.0;
        vec3 lit = applyWarmAO(ceilLin * E_ind * 1.12 + vec3(1.0, 0.95, 0.86) * tinSpec + scSpecC * 0.45, aoCeil);
        gl_FragColor = vec4(linToSrgb(galleryFilmMap(lit)), 1.0);
        return;
      }

      /* --- 5: ARCH SPANDREL & SOFFIT | 7: FALLBACK RECESSED DOORWAY | 8: WARM ENTRANCE FOYER --- */
      if (uSurfType == 5 || uSurfType == 7 || uSurfType == 8) {
        float tooth = texture2D(uWaterPore, vec2(P.x + P.z, P.y) * 1.42).g;
        vec3 albSRGB = vec3(0.944, 0.924, 0.886) + (tooth - 0.5) * 0.014;
        vec3 Nsp = N;
        float plRough = 0.82;
        float normGainSp = mix(0.28, 0.78, clamp(uTexStrength / 1.0, 0.0, 1.25));
        if ((uSurfType == 5 || uSurfType == 8) && uHasPlasterPBR > 0.5) {
          vec2 nXYsp; float tSp;
          evalDualScalePlaster(vec2(P.x + P.z * 0.45, P.y) / uPlasterTile, normGainSp, 0.42, 1.55, albSRGB, nXYsp, plRough, tSp);
          Nsp = normalize(N + vec3(nXYsp.x, nXYsp.y, 0.0));
          tooth = mix(tooth, tSp, 0.45);
        } else {
          albSRGB = applyLightroomPore(albSRGB, vec2(P.x + P.z, P.y), 0.14, 0.14);
        }
        float aoS = mix(0.86, 1.0, smoothstep(0.0, 0.32, P.y));
        float spPaintAlpha = 0.0;

        if (uSurfType == 7) {
          bool isLeaf = abs(N.x) > 0.5;
          albSRGB = isLeaf ? vec3(0.954, 0.942, 0.916) : vec3(0.978, 0.970, 0.952);
          if (isLeaf) {
            float sDC = abs(P.z - 14.80) < 2.0 ? 14.80 : 4.90;
            float du = abs(P.z - sDC);
            if (du > 0.10 && du < 0.44 && ((P.y > 0.28 && P.y < 1.06) || (P.y > 1.24 && P.y < 2.02) || (P.y > 2.18 && P.y < 2.62))) {
              albSRGB *= 0.952;
            }
          }
          aoS = isLeaf ? 0.89 : 0.95;
        } else if (uSurfType == 8) {
          if (abs(P.x) < 0.92 && P.y < 2.95) {
            float dTrim = abs(abs(P.x) - 0.88);
            if (dTrim < 0.06 || abs(P.y - 2.90) < 0.06) albSRGB = vec3(0.980, 0.972, 0.954);
            else albSRGB = vec3(0.962, 0.944, 0.908);
          }
        } else if (uSurfType == 5 && uPaintActive > 0.5) {
          vec3 pigA; float aAlpha; float aRim;
          evalPermanentWatercolour(P.x > 0.0 ? 2 : 1, P.z - abs(P.x) * 0.85, P.y + P.x * 0.35, tooth, pigA, aAlpha, aRim);
          float archCeilFade = mix(uCeilingPaint, 1.0, smoothstep(3.68, 2.55, P.y));
          spPaintAlpha = aAlpha * (0.28 + 0.28 * uPaintSat) * archCeilFade;
          albSRGB = oklabToSrgb(mix(srgbToOklab(albSRGB), srgbToOklab(washPigmentSRGB(pigA)), spPaintAlpha));
        }

        if (P.y <= 0.28) albSRGB = vec3(0.980, 0.972, 0.954);
        vec3 E_ind = evalIndirectRadiosity(P, Nsp, uStyle) + vec3(0.36, 0.345, 0.32) * (1.0 - spPaintAlpha * 0.85);
        if (uSurfType == 5 && uHasCyclesGI > 0.5) {
          vec2 uvArchSp = vec2(mix(0.671875, 0.996094, clamp((P.x + 1.42) / 2.84, 0.0, 1.0)), mix(0.507813, 0.992188, clamp(P.y / 3.89, 0.0, 1.0)));
          vec3 eBakedA = srgbToLin(texture2D(uVestGI, uvArchSp).rgb) / srgbToLin(vec3(0.8065, 0.7610, 0.6996));
          E_ind *= mix(vec3(1.0), clamp(eBakedA, 0.68, 1.50), 0.58);
        }
        vec3 scDiffA, scSpecA;
        evalSconceWash(P, Nsp, rd, plRough, scDiffA, scSpecA);
        E_ind += scDiffA * 0.65;
        vec3 E_sun = (uSurfType != 8) ? evalDirectSun(P + N * 0.015, uStyle) : vec3(0.0);
        vec3 lit = applyWarmAO(srgbToLin(albSRGB) * (E_ind + E_sun * max(0.0, dot(Nsp, uSunDir))) + scSpecA, aoS);
        gl_FragColor = vec4(linToSrgb(galleryFilmMap(lit)), 1.0);
        return;
      }

      /* --- 1 & 2: LEFT & RIGHT CORRIDOR + VESTIBULE WALLS (2K PBR + LIGHTROOM TEXTURE/CLARITY + SCONCE CONES) --- */
      bool isRight = (uSurfType == 2);
      float s = P.z, y = P.y;
      float tooth = texture2D(uWaterPore, vec2(s, y) * 1.48).g;
      vec3 wallSRGB = vec3(0.946, 0.926, 0.888) + (tooth - 0.5) * 0.014;
      vec3 Nsurf = N;
      float plRough = 0.83;
      vec2 plUv = vec2((isRight ? s : -s) + (isRight ? 0.37 : 0.0), y) / uPlasterTile;
      float plNormGain = mix(0.30, 0.84, clamp(uTexStrength / 0.95, 0.0, 1.30));

      if (uHasPlasterPBR > 0.5) {
        vec2 nXY; float fineT;
        evalDualScalePlaster(plUv, plNormGain, 0.44, 1.72, wallSRGB, nXY, plRough, fineT);
        float signS = isRight ? 1.0 : -1.0;
        Nsurf = normalize(N + vec3(0.0, nXY.y, nXY.x * signS));
        tooth = mix(tooth, fineT, 0.50);
      } else {
        wallSRGB = applyLightroomPore(wallSRGB, vec2(s, y), 0.16, 0.16);
      }

      float aoWall = mix(0.88, 1.0, smoothstep(0.26, 0.48, y))
                   * mix(0.89, 1.0, smoothstep(0.0, 0.20, 3.89 - y));
      if (s < 17.0) {
        aoWall *= mix(0.85, 1.0, smoothstep(0.0, 0.058, abs(y - 3.435)));
      }

      bool onTrim = false;
      if (y <= 0.285) {
        onTrim = true;
        wallSRGB = vec3(0.982, 0.974, 0.956);
        if (y > 0.258) Nsurf = normalize(mix(N, vec3(0.0, 1.0, 0.0), 0.62));
      } else if (y >= 3.74) {
        onTrim = true;
        wallSRGB = vec3(0.970, 0.958, 0.934);
        Nsurf = normalize(mix(N, vec3(0.0, -1.0, 0.0), 0.38));
      } else if (s < 17.0 && y >= 3.418 && y <= 3.468) {
        onTrim = true;
        wallSRGB = vec3(0.980, 0.972, 0.952);
      }

      if (s > 0.0 && s < 16.95) {
        float sDC = abs(s - 4.90) < abs(s - 14.80) ? 4.90 : 14.80;
        if (!isRight && abs(s - 9.42) < abs(s - sDC)) sDC = 9.42;
        float dsD = abs(s - sDC);
        if (dsD >= 0.56 && dsD <= 0.71 && y <= 3.00) {
          onTrim = true;
          wallSRGB = vec3(0.982, 0.974, 0.956);
        } else if (dsD < 0.71 && y >= 2.85 && y <= 3.00) {
          onTrim = true;
          wallSRGB = vec3(0.982, 0.974, 0.956);
          if (y > 2.96) Nsurf = normalize(mix(N, vec3(0.0, 1.0, 0.0), 0.55));
        }
      }

      float uM = clamp((20.72 - s) / 26.72, 0.001, 0.999);
      float yn = clamp(y / 3.89, 0.001, 0.999);
      float vM = isRight ? (0.52 + yn * 0.48) : (yn * 0.48);
      vec4 hMask = texture2D(uHangMask, vec2(uM, vM));

      // Exact analytic frame shadow + pale-halo elimination + architectural corner/casing/radiator/sconce AO
      float inExactFrame = 0.0, frameAmbSh = 0.0, frameSunBlk = 0.0;
      float cornerCasingAO = 1.0, propSunBlk = 0.0, sconceArmShade = 0.0;
      if (uShadowMode > 0 || uSplashMode > 0) {
        evalFrameWallShadow(isRight ? 1.0 : -1.0, s, y, N, inExactFrame, frameAmbSh, frameSunBlk);
      }
      if (uShadowMode > 0) {
        evalWallCornerCasingAO(isRight, s, y, cornerCasingAO, propSunBlk, sconceArmShade);
        aoWall *= (1.0 - frameAmbSh) * cornerCasingAO;
      }

      float wallPaintAlpha = 0.0;
      vec3 albedoLin;
      if (uSplashMode > 0) {
        if (!onTrim && inExactFrame < 0.5) {
          vec3 pigW; vec3 wLayers; float wPool; float wRel; vec2 wBrush;
          evalSplashWithBody(isRight ? 2 : 1, s, y, tooth, pigW, wLayers, wPool, wRel, wBrush);
          if (wLayers.x > 0.002) {
            vec3 subSRGB = wallSRGB;
            if (uHasPlasterPBR > 0.5) {
              vec2 dummyN; float dummyR; float dummyT;
              evalDualScalePlaster(plUv, 0.0, 0.28 * wLayers.x, 1.05 * wLayers.x, subSRGB, dummyN, dummyR, dummyT);
            }
            albedoLin = applyKubelkaMunkSplash(subSRGB, pigW, wLayers, wPool, wBrush, tooth);
            // Tactile brushstroke & impasto edge relief catching directional window bounce & Komorebi sun!
            float dhx = clamp(dFdx(wRel), -0.05, 0.05);
            float dhy = clamp(dFdy(wRel), -0.05, 0.05);
            float signS = isRight ? 1.0 : -1.0;
            Nsurf = normalize(Nsurf + vec3(0.0, -dhy * 3.6, -dhx * 3.6 * signS));
            plRough = mix(plRough, 0.46, clamp(wLayers.z * 0.72 + wPool * 0.40, 0.0, 0.80));
          } else {
            albedoLin = srgbToLin(wallSRGB);
          }
        } else {
          albedoLin = srgbToLin(wallSRGB);
        }
        if (uShadowMode == 0 && !onTrim && hMask.r < 0.35) {
          aoWall *= (1.0 - (0.18 + 0.08 * uClarityStrength) * hMask.g);
        }
      } else {
        bool allowLegacyMask = (uShadowMode > 0) ? (inExactFrame < 0.5) : (hMask.r < 0.35);
        if (!onTrim && allowLegacyMask) {
          vec3 pigW; float wAlpha; float wRim;
          evalPermanentWatercolour(isRight ? 2 : 1, s, y, tooth, pigW, wAlpha, wRim);
          wallPaintAlpha = wAlpha;
          if (wAlpha > 0.002) {
            wallSRGB = oklabToSrgb(mix(srgbToOklab(wallSRGB), srgbToOklab(pigW), wAlpha))
                     * (1.0 - wRim * (0.11 + 0.08 * uClarityStrength));
            if (uHasPlasterPBR > 0.5) {
              vec2 dummyN; float dummyR; float dummyT;
              evalDualScalePlaster(plUv, 0.0, 0.28 * wAlpha, 1.15 * wAlpha, wallSRGB, dummyN, dummyR, dummyT);
            } else {
              wallSRGB = applyLightroomPore(wallSRGB, vec2(s, y), 0.11 * wAlpha, 0.10 * wAlpha);
            }
          }
          if (uShadowMode == 0) {
            aoWall *= (1.0 - (0.18 + 0.08 * uClarityStrength) * hMask.g);
          }
        }
        albedoLin = srgbToLin(wallSRGB);
      }

      // Strong directional window-portal + ceiling grazing relief so 2K troweled plaster & brushstrokes read crisply everywhere!
      float skyGrazing = clamp(1.0 + (Nsurf.y * 0.38 + Nsurf.z * 0.44) * clamp(uTexStrength, 0.0, 1.5), 0.68, 1.38);
      vec3 E_ind = (evalIndirectRadiosity(P, Nsurf, uStyle) + vec3(0.38, 0.365, 0.34) * (1.0 - wallPaintAlpha * 0.86)) * skyGrazing;
      if (uHasCyclesGI > 0.5) {
        vec3 giSample;
        if (s <= 17.30) {
          vec2 wUv = vec2(clamp((s + 6.0) / 23.30, 0.001, 0.999), yn);
          giSample = isRight ? texture2D(uRightWallGI, wUv).rgb : texture2D(uLeftWallGI, wUv).rgb;
        } else {
          float vt = clamp((s - 17.30) / 3.42, 0.0, 1.0);
          float vy = clamp(y / 3.80, 0.0, 1.0);
          vec2 uvVest = isRight
            ? vec2(mix(0.337891, 0.662109, vt), mix(0.007813, 0.992188, vy))
            : vec2(mix(0.003906, 0.328125, vt), mix(0.007813, 0.992188, vy));
          giSample = texture2D(uVestGI, uvVest).rgb;
        }
        vec3 eBakedW = srgbToLin(giSample) / srgbToLin(vec3(0.74, 0.70, 0.65));
        float giWeight = 0.58 + 0.10 * uClarityStrength;
        if (!isRight && s <= 17.30) {
          float movedMask = (smoothstep(0.5, 0.9, s) * (1.0 - smoothstep(3.2, 3.6, s))
                           + smoothstep(8.1, 8.5, s) * (1.0 - smoothstep(10.4, 10.8, s)))
                          * smoothstep(0.30, 0.55, y) * (1.0 - smoothstep(2.65, 2.95, y));
          giWeight *= (1.0 - clamp(movedMask, 0.0, 1.0));
        }
        E_ind *= mix(vec3(1.0), clamp(eBakedW, 0.74, 1.50), giWeight);
      }

      if (uLandingMode == 1 || uLandingMode == 4) {
        float spotGain = (uLandingMode == 4 ? 0.88 : 1.0) * uLandingRamp;
        E_ind *= mix(1.0, 0.89, spotGain * smoothstep(12.0, 4.5, s));
      }

      // Warm 2900K Brass Sconce Wall-Wash Cones (attenuated directly underneath the brass arm so its own shadow stays crisp!)
      vec3 scDiff, scSpec;
      evalSconceWash(P, Nsurf, rd, onTrim ? 0.38 : plRough, scDiff, scSpec);
      E_ind += scDiff * (1.0 - wallPaintAlpha * 0.30) * (1.0 - sconceArmShade);

      vec3 E_sun = evalDirectSun(P + N * 0.015, uStyle) * (1.0 - max(frameSunBlk, propSunBlk));
      float ndl = max(0.0, dot(Nsurf, uSunDir));
      vec3 Hsun = normalize(uSunDir - rd);
      float sunPlasterSpec = pow(max(0.0, dot(Nsurf, Hsun)), mix(36.0, 10.0, plRough)) * 0.085 * ndl;
      float rakeRelief = clamp(1.0 + (dot(Nsurf, uSunDir) - dot(N, uSunDir)) * (3.6 + 1.4 * uTexStrength), 0.72, 1.35);
      vec3 lit = applyWarmAO(
        albedoLin * (E_ind + E_sun * (ndl * 1.48 * rakeRelief + 0.06 * length(E_sun) * rakeRelief))
        + E_sun * sunPlasterSpec + scSpec,
        aoWall
      );
      gl_FragColor = vec4(linToSrgb(galleryFilmMap(lit)), 1.0);
    }
  `;

  function makeSurfMat(surfType, extraUniforms = {}) {
    return new THREE.ShaderMaterial({
      uniforms: {
        ...SHARED_UNIFORMS,
        uSurfType:  { value: surfType },
        uArtTex:    { value: whiteTex },
        uSolidTint: { value: new THREE.Color('#1b1917') },
        uFlipV:     { value: 0.0 },
        uStripCell: { value: new THREE.Vector2(0, 0) },
        ...extraUniforms,
      },
      vertexShader: ROOM_VERT,
      fragmentShader: ROOM_FRAG,
      extensions: { derivatives: true, shaderTextureLod: true },
      side: THREE.DoubleSide,
    });
  }

  /* =========================================================================
   * 6. CYCLES GI LIGHTMAPS (`lightmaps/`) + 2K PBR & 1862 PROPS (`arch/`)
   * ========================================================================= */
  let cyclesGILoaded = false;
  let archKitLoaded = false;
  let archPropCounts = { doors: 0, window: 0, sconces: 0, radiators: 0, switches: 0 };

  function loadShaderWebP(relUrl) {
    loadedAssetUrls.push(relUrl);
    return new Promise((resolve, reject) => {
      texLoader.load(relUrl, t => {
        configureShaderSRGBTex(t);
        t.wrapS = THREE.RepeatWrapping;
        t.wrapT = THREE.RepeatWrapping;
        resolve(t);
      }, undefined, reject);
    });
  }

  async function tryLoadCyclesLightmaps() {
    if (cyclesGILoaded) return true;
    try {
      const res = await fetch('./lightmaps/lightmaps_meta.json?' + Date.now());
      if (!res.ok) return false;
      await res.json();
      const loadGI = file => new Promise((resolve, reject) => {
        loadedAssetUrls.push(`./lightmaps/${file}`);
        texLoader.load(`./lightmaps/${file}`, t => {
          configureShaderSRGBTex(t);
          resolve(t);
        }, undefined, reject);
      });

      const needLegacyOak = QS.get('floor') === '0';
      const [lw, rw, ceil, vest, flGi, oakFallback, oakNRFallback] = await Promise.all([
        loadGI('left_wall_gi.webp'),
        loadGI('right_wall_gi.webp'),
        loadGI('ceiling_coffered_gi.webp'),
        loadGI('vestibule_gi.webp'),
        loadGI('floor_gi.webp'),
        needLegacyOak ? loadShaderWebP('./lightmaps/oak_floor_pbr.webp') : Promise.resolve(null),
        needLegacyOak ? loadShaderWebP('./lightmaps/oak_floor_rough_norm.webp') : Promise.resolve(null),
      ]);

      SHARED_UNIFORMS.uLeftWallGI.value  = lw;
      SHARED_UNIFORMS.uRightWallGI.value = rw;
      SHARED_UNIFORMS.uCeilGI.value      = ceil;
      SHARED_UNIFORMS.uVestGI.value      = vest;
      SHARED_UNIFORMS.uFloorGI.value     = flGi;
      SHARED_UNIFORMS.uHasCyclesGI.value = 1.0;

      if (!archKitLoaded && oakFallback && oakNRFallback) {
        SHARED_UNIFORMS.uOakPBR.value       = oakFallback;
        SHARED_UNIFORMS.uOakNormRough.value = oakNRFallback;
        SHARED_UNIFORMS.uOakTileLen.value   = 5.68;
        SHARED_UNIFORMS.uHasOakPBR.value    = 1.0;
      }

      cyclesGILoaded = true;
      return true;
    } catch {
      return false;
    }
  }

  /* =========================================================================
   * 7. 3D ARCHITECTURAL CORRIDOR SHELL + MOULDED PICTURE RAIL (y=3.44m) + STEPPED BASEBOARD
   * ========================================================================= */
  const proceduralDoorsGroup = new THREE.Group();
  scene.add(proceduralDoorsGroup);

  const archPropsGroup = new THREE.Group();
  scene.add(archPropsGroup);

  const winPlateSharedRef = { value: whiteTex };
  (function buildArchitecturalShell() {
    const matWallL   = makeSurfMat(1);
    const matWallR   = makeSurfMat(2);
    const matFloor   = makeSurfMat(3);
    const matCeiling = makeSurfMat(4);
    const matArch    = makeSurfMat(5);
    const matWinWall = makeSurfMat(6, { uArtTex: winPlateSharedRef });
    const matDoor    = makeSurfMat(7);
    const matBack    = makeSurfMat(8);
    const matTrim3D  = makeSurfMat(16, { uSolidTint: { value: new THREE.Color('#f7f4ec') } });

    const addPlane = (w, h, mat, px, py, pz, rx, ry, rz, parent = scene) => {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
      m.position.set(px, py, pz);
      m.rotation.set(rx, ry, rz);
      parent.add(m);
      return m;
    };
    const addBox = (bw, bh, bd, mat, px, py, pz, parent = scene) => {
      const m = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, bd), mat);
      m.position.set(px, py, pz);
      parent.add(m);
      return m;
    };

    const hallFloorLen = H.vS - H.S0;
    addPlane(H.W + 0.36, hallFloorLen, matFloor, 0, 0, -(H.vS + H.S0) * 0.5, -Math.PI / 2, 0, 0);
    addPlane(H.vHalf * 2, H.vD, matFloor, 0, 0, -(H.end + H.vS) * 0.5, -Math.PI / 2, 0, 0);

    const hallCeilLen = H.L - H.S0;
    addPlane(H.W, hallCeilLen, matCeiling, 0, H.C, -(H.L + H.S0) * 0.5, Math.PI / 2, 0, 0);
    addPlane(H.vHalf * 2, H.vD, matCeiling, 0, H.vC, -(H.end + H.vS) * 0.5, Math.PI / 2, 0, 0);

    const dHalf = 0.58;

    for (const side of [-1, 1]) {
      const xW = side * (H.W * 0.5);
      const inward = -side;
      const ry = side < 0 ? Math.PI / 2 : -Math.PI / 2;
      const matW = side < 0 ? matWallL : matWallR;
      const doorsSide = side < 0 ? H.doorsL : H.doors;

      const fullBays = [];
      let sPrev = H.S0;
      for (const ds of doorsSide) {
        fullBays.push([sPrev, ds - dHalf]);
        sPrev = ds + dHalf;
      }
      fullBays.push([sPrev, H.L]);

      for (const [s0, s1] of fullBays) {
        const len = s1 - s0;
        const zMid = -(s0 + s1) * 0.5;
        addPlane(len, H.C, matW, xW, H.C * 0.5, zMid, 0, ry, 0);

        // Real 3D Stepped 28 cm Gallery Baseboard + Ogee Cap + Floor Shoe Moulding (stopped cleanly outside door plinth blocks!)
        const trimSpan = Math.max(0.1, len - 0.25);
        addBox(0.018, 0.256, trimSpan, matTrim3D, xW + inward * 0.009, 0.128, zMid);
        addBox(0.026, 0.026, trimSpan, matTrim3D, xW + inward * 0.013, 0.269, zMid);
        addBox(0.030, 0.016, trimSpan, matTrim3D, xW + inward * 0.015, 0.008, zMid);
      }

      // Continuous 3D Moulded Historic Picture Rail at y = 3.44 m along full corridor wall!
      const hallWallLen = H.L - H.S0;
      const zHallMid = -(H.L + H.S0) * 0.5;
      addBox(0.024, 0.038, hallWallLen, matTrim3D, xW + inward * 0.012, 3.440, zHallMid);
      addBox(0.034, 0.016, hallWallLen, matTrim3D, xW + inward * 0.017, 3.456, zHallMid);

      // Fallback procedural recessed doors (automatically hidden when `arch/props_corridor.glb` loads `door_6panel`!)
      for (const ds of doorsSide) {
        const s0 = ds - dHalf, s1 = ds + dHalf;
        addPlane(s1 - s0, H.C - H.dH, matW, xW, (H.C + H.dH) * 0.5, -ds, 0, ry, 0);
        const revDepth = 0.14;
        const xLeaf = side * (H.W * 0.5 + revDepth);
        const xMidRev = side * (H.W * 0.5 + revDepth * 0.5);
        addPlane(s1 - s0, H.dH, matDoor, xLeaf, H.dH * 0.5, -ds, 0, ry, 0, proceduralDoorsGroup);
        addPlane(revDepth, H.dH, matDoor, xMidRev, H.dH * 0.5, -s0, 0, Math.PI, 0, proceduralDoorsGroup);
        addPlane(revDepth, H.dH, matDoor, xMidRev, H.dH * 0.5, -s1, 0, 0, 0, proceduralDoorsGroup);
        addPlane(revDepth, s1 - s0, matDoor, xMidRev, H.dH, -ds, Math.PI / 2, 0, 0, proceduralDoorsGroup);
        // Fallback 3D outer architrave casing
        addBox(0.026, 2.98, 0.11, matTrim3D, xW + inward * 0.013, 1.49, -(ds - dHalf - 0.055), proceduralDoorsGroup);
        addBox(0.026, 2.98, 0.11, matTrim3D, xW + inward * 0.013, 1.49, -(ds + dHalf + 0.055), proceduralDoorsGroup);
        addBox(0.032, 0.13, (s1 - s0) + 0.24, matTrim3D, xW + inward * 0.016, 2.925, -ds, proceduralDoorsGroup);
      }

      // Vestibule side walls + 3D baseboard & picture rail
      const xV = side * H.vHalf;
      const zVMid = -(H.end + H.vS) * 0.5;
      addPlane(H.vD, H.vC, matW, xV, H.vC * 0.5, zVMid, 0, ry, 0);
      addBox(0.016, 0.256, H.vD, matTrim3D, xV + inward * 0.008, 0.128, zVMid);
      addBox(0.024, 0.024, H.vD, matTrim3D, xV + inward * 0.012, 0.268, zVMid);
      addBox(0.022, 0.034, H.vD, matTrim3D, xV + inward * 0.011, 3.380, zVMid);
    }

    const spring = 2.886, crown = 3.351;
    const R = ((H.vHalf * 2) ** 2 / 4 + (crown - spring) ** 2) / (2 * (crown - spring));
    const archY = xx => crown - (R - Math.sqrt(Math.max(0, R * R - xx * xx)));

    function buildArchSpandrel(halfOuterW, topH, zPos, rotY) {
      const shape = new THREE.Shape();
      shape.moveTo(-halfOuterW, 0);
      shape.lineTo(-H.vHalf, 0);
      shape.lineTo(-H.vHalf, spring);
      const NSEG = 28;
      for (let i = 1; i <= NSEG; i++) {
        const xx = -H.vHalf + (2 * H.vHalf * i) / NSEG;
        shape.lineTo(xx, archY(xx));
      }
      shape.lineTo(H.vHalf, 0);
      shape.lineTo(halfOuterW, 0);
      shape.lineTo(halfOuterW, topH);
      shape.lineTo(-halfOuterW, topH);
      shape.closePath();
      const g = new THREE.ShapeGeometry(shape);
      const m = new THREE.Mesh(g, matArch);
      m.position.set(0, 0, zPos);
      m.rotation.y = rotY;
      scene.add(m);
    }
    buildArchSpandrel(H.W * 0.5, H.C, -H.L, 0);
    buildArchSpandrel(H.W * 0.5, H.C, -H.vS, Math.PI);

    addPlane(H.archT, spring, matArch, -H.vHalf, spring * 0.5, -(H.L + H.archT * 0.5), 0, Math.PI / 2, 0);
    addPlane(H.archT, spring, matArch,  H.vHalf, spring * 0.5, -(H.L + H.archT * 0.5), 0, -Math.PI / 2, 0);
    const NSOF = 24;
    for (let i = 0; i < NSOF; i++) {
      const x0 = -H.vHalf + (2 * H.vHalf * i) / NSOF;
      const x1 = -H.vHalf + (2 * H.vHalf * (i + 1)) / NSOF;
      const y0 = archY(x0), y1 = archY(x1);
      const segW = Math.hypot(x1 - x0, y1 - y0) + 0.003;
      const ang = Math.atan2(y1 - y0, x1 - x0);
      const g = new THREE.PlaneGeometry(segW, H.archT);
      const m = new THREE.Mesh(g, matArch);
      m.position.set((x0 + x1) * 0.5, (y0 + y1) * 0.5, -(H.L + H.archT * 0.5));
      m.rotation.set(Math.PI / 2, 0, ang);
      scene.add(m);
    }

    const matWinBackdrop = makeSurfMat(18, { uArtTex: winPlateSharedRef });
    addPlane(H.vHalf * 2, H.vC, matWinWall, 0, H.vC * 0.5, -H.end, 0, 0, 0);
    addPlane(2.30, 3.10, matWinBackdrop, 0, 1.90, -20.98, 0, 0, 0);
    addBox(H.vHalf * 2, 0.26, 0.018, matTrim3D, 0, 0.13, -(H.end - 0.009));
    addPlane(H.W, H.C, matBack, 0, H.C * 0.5, -H.S0, 0, Math.PI, 0);
  })();

  /* =========================================================================
   * 8. REAL SCULPTED BLENDER `stand.glb` AT PAVLOS'S EXACT MASTERPIECE POSE
   *    (s = 6.15 m, x = +0.54 m, yaw = -8.5 deg, holding full-res 1760x2200 015.jpg!)
   * ========================================================================= */
  const posterFullUrl = USE_OPT_WEIGHT ? './opt/art/015.jpg' : '/Vanessa-Espin-website/concepts/herencia/assets/015.jpg';
  loadedAssetUrls.push(posterFullUrl);
  const posterTex = configureShaderSRGBTex(texLoader.load(posterFullUrl));

  const easelGroup = new THREE.Group();
  easelGroup.position.set(0.54, 0.0, -6.15);
  easelGroup.rotation.y = THREE.MathUtils.degToRad(8.5);
  easelGroup.visible = false; // Hidden for t < 13.50s so Crab Walk is 100% unobstructed!
  scene.add(easelGroup);

  const gltfLoader = new GLTFLoader();
  const MODEL_BASE = '/Vanessa-Espin-website/gemini-blender-rigs/herencia-elements-2/10-threejs-3d-flock/models';

  const fallbackEasel = new THREE.Group();
  {
    const matOak = makeSurfMat(11);
    const matPosterPlane = makeSurfMat(10, { uArtTex: { value: posterTex }, uFlipV: { value: 0.0 } });
    const tiltG = new THREE.Group();
    tiltG.position.set(0, 0.85, 0);
    tiltG.rotation.x = THREE.MathUtils.degToRad(-6.5);
    fallbackEasel.add(tiltG);
    const b1 = new THREE.Mesh(new THREE.BoxGeometry(0.744, 0.920, 0.030), matOak);
    b1.position.set(0, 1.182 - 0.85, -0.007);
    const p1 = new THREE.Mesh(new THREE.PlaneGeometry(0.720, 0.900), matPosterPlane);
    p1.position.set(0, 1.182 - 0.85, 0.010);
    tiltG.add(b1, p1);
  }
  easelGroup.add(fallbackEasel);

  function configureStandardPBRMeshMaterials(root) {
    root.traverse(o => {
      if (!o.isMesh || !o.material) return;
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      for (const m of mats) {
        // Strictly obey `webgl2-srgb-double-gamma.md`: SRGBColorSpace ONLY on diffuse/emissive maps of MeshStandardMaterial,
        // NoColorSpace on normalMap, roughnessMap, metalnessMap, aoMap!
        if (m.map) configureCrispTex(m.map, true);
        if (m.emissiveMap) configureCrispTex(m.emissiveMap, true);
        if (m.normalMap) configureCrispTex(m.normalMap, false);
        if (m.roughnessMap) configureCrispTex(m.roughnessMap, false);
        if (m.metalnessMap) configureCrispTex(m.metalnessMap, false);
        if (m.aoMap) configureCrispTex(m.aoMap, false);
        if (m.isMeshStandardMaterial) {
          m.envMapIntensity = (m.metalness > 0.45) ? 0.88 : 0.30;
          m.needsUpdate = true;
        }
      }
    });
  }

  const standReadyPromise = new Promise(resolve => {
    gltfLoader.load(`${MODEL_BASE}/stand.glb`, gltf => {
      const standRoot = gltf.scene;
      configureStandardPBRMeshMaterials(standRoot);
      const glbPosterMat = makeSurfMat(10, { uArtTex: { value: posterTex }, uFlipV: { value: 1.0 } });
      standRoot.traverse(o => {
        if (!o.isMesh) return;
        const mName = (o.material && o.material.name) || '';
        if (o.name === 'poster_front' || mName === 'poster_front') {
          o.material = glbPosterMat;
        }
      });
      easelGroup.remove(fallbackEasel);
      easelGroup.add(standRoot);
      resolve(true);
    }, undefined, () => resolve(false));
  });

  const DOOR_STYLE_SPECS = {
    putty:  { url: './look/door_leaf_putty.webp',  leafTint: [1.02, 1.01, 0.99], casingTint: [0.952, 0.932, 0.892], rough: 0.76 },
    ivory:  { url: './look/door_leaf_ivory.webp',  leafTint: [1.02, 1.01, 0.99], casingTint: [0.958, 0.938, 0.898], rough: 0.76 },
    walnut: { url: './look/door_leaf_walnut.webp', leafTint: [1.04, 1.02, 1.00], casingTint: [0.952, 0.932, 0.892], rough: 0.70 },
  };
  let activeDoorStyle = ['putty', 'ivory', 'walnut'].includes((QS.get('door') || '').toLowerCase())
    ? QS.get('door').toLowerCase()
    : 'putty';
  const doorTexCache = new Map();
  let doorLeafMatRef = null;
  let doorCasingMatRef = null;

  function loadGltfAlignedTex(url, isSRGB) {
    loadedAssetUrls.push(url);
    return new Promise((res, rej) => texLoader.load(url, t => {
      t.flipY = false; // Match Blender glTF TEXCOORD_0 orientation!
      t.colorSpace = isSRGB ? THREE.SRGBColorSpace : THREE.NoColorSpace;
      t.wrapS = THREE.ClampToEdgeWrapping;
      t.wrapT = THREE.ClampToEdgeWrapping;
      t.anisotropy = maxAniso;
      t.needsUpdate = true;
      res(t);
    }, undefined, rej));
  }

  async function applyDoorStyle(styleKey) {
    if (!DOOR_STYLE_SPECS[styleKey]) return;
    activeDoorStyle = styleKey;
    const spec = DOOR_STYLE_SPECS[styleKey];
    let alb = doorTexCache.get(styleKey);
    if (!alb) {
      alb = await loadGltfAlignedTex(spec.url, true).catch(() => null);
      if (alb) doorTexCache.set(styleKey, alb);
    }
    if (doorLeafMatRef && alb && activeDoorStyle === styleKey) {
      doorLeafMatRef.map = alb;
      doorLeafMatRef.color.setRGB(spec.leafTint[0], spec.leafTint[1], spec.leafTint[2]);
      doorLeafMatRef.roughness = spec.rough;
      doorLeafMatRef.needsUpdate = true;
    }
    if (doorCasingMatRef && activeDoorStyle === styleKey) {
      doorCasingMatRef.color.setRGB(spec.casingTint[0], spec.casingTint[1], spec.casingTint[2]);
      doorCasingMatRef.needsUpdate = true;
    }
    markFreezeDirty(4);
  }

  /* =========================================================================
   * 8B. LOAD `@pbr-architect`'S 2K PBR TEXTURES & 1862 PROPS (`arch/`)
   * ========================================================================= */
  async function tryLoadArchKit() {
    if (archKitLoaded) return true;
    try {
      const layoutRes = await fetch('./arch/arch_layout.json?' + Date.now());
      if (!layoutRes.ok) return false;
      loadedAssetUrls.push('./arch/arch_layout.json');
      const layout = await layoutRes.json();

      // 1. Load 2K Plaster, Photographed Floor Strips (`10 KB`), Window Plate (`6 KB`) & 1K Wood Trim (`NoColorSpace` for `ROOM_FRAG`!)
      const needLegacy2kOak = QS.get('floor') === '0';
      const loadClampWebP = url => {
        loadedAssetUrls.push(url);
        return new Promise((res, rej) => texLoader.load(url, t => {
          configureShaderSRGBTex(t);
          t.wrapS = THREE.ClampToEdgeWrapping;
          t.wrapT = THREE.ClampToEdgeWrapping;
          res(t);
        }, undefined, rej));
      };
      const [plAlb, plNR, floorStripsTex, winPlateTex, oakAlb2k, oakNR2k, trimNR, doorNormTex, doorRoughTex] = await Promise.all([
        loadShaderWebP('./arch/plaster_albedo_2k.webp').catch(() => null),
        loadShaderWebP('./arch/plaster_norm_rough_2k.webp').catch(() => null),
        loadShaderWebP('./look/herencia_floor_strips.webp').catch(() => null),
        loadClampWebP('./look/window_plate_v078.webp').catch(() => null),
        needLegacy2kOak ? loadShaderWebP('./arch/oak_albedo_2k.webp').catch(() => null) : Promise.resolve(null),
        needLegacy2kOak ? loadShaderWebP('./arch/oak_norm_rough_2k.webp').catch(() => null) : Promise.resolve(null),
        loadShaderWebP('./arch/trim_wood_norm_rough_1k.webp').catch(() => null),
        loadGltfAlignedTex('./look/door_leaf_norm.webp', false).catch(() => null),
        loadGltfAlignedTex('./look/door_leaf_rough.webp', false).catch(() => null),
      ]);

      if (plAlb && plNR) {
        SHARED_UNIFORMS.uPlasterAlbedo.value    = plAlb;
        SHARED_UNIFORMS.uPlasterNormRough.value = plNR;
        const pm = layout.pbr_textures?.plaster_albedo?.tile_size_m?.[0]
          || (Array.isArray(layout.pbr_tiles?.plaster_m) ? layout.pbr_tiles.plaster_m[0] : layout.pbr_tiles?.plaster_m)
          || 1.80;
        if (pm > 0.2) SHARED_UNIFORMS.uPlasterTile.value = pm;
        SHARED_UNIFORMS.uHasPlasterPBR.value = 1.0;
      }
      if (floorStripsTex) {
        SHARED_UNIFORMS.uFloorStrips.value    = floorStripsTex;
        SHARED_UNIFORMS.uHasFloorStrips.value = 1.0;
      }
      if (winPlateTex) {
        winPlateSharedRef.value               = winPlateTex;
        SHARED_UNIFORMS.uHasWindowPlate.value = 1.0;
      }
      if (oakAlb2k && oakNR2k) {
        SHARED_UNIFORMS.uOakPBR.value       = oakAlb2k;
        SHARED_UNIFORMS.uOakNormRough.value = oakNR2k;
        const oakLen = layout.pbr_textures?.oak_albedo?.tile_size_m?.[1]
          || layout.pbr_tiles?.oak_m?.[1]
          || layout.oak_tile_len_m
          || 4.20;
        SHARED_UNIFORMS.uOakTileLen.value   = oakLen;
        SHARED_UNIFORMS.uHasOakPBR.value    = 1.0;
      }
      if (trimNR) {
        SHARED_UNIFORMS.uTrimNormRough.value = trimNR;
        SHARED_UNIFORMS.uHasTrimPBR.value    = 1.0;
      }

      // 2. Load 72-Ray 3D AO Sculpted Props (`./look/props_corridor_ao.glb`, fallback `./arch/props_corridor.glb`)
      //    and inject live corridor Komorebi window sunlight + backlit window-bar contrast onto MeshStandardMaterial!
      const propsUrl = './look/props_corridor_ao.glb';
      loadedAssetUrls.push(propsUrl);
      const propsGltf = await new Promise((res, rej) => {
        gltfLoader.load(propsUrl, res, undefined, () => {
          gltfLoader.load('./arch/props_corridor.glb', res, undefined, rej);
        });
      });
      configureStandardPBRMeshMaterials(propsGltf.scene);
      const hookedMats = new Set();
      propsGltf.scene.traverse(o => {
        if (!o.isMesh || !o.material) return;
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        for (const m of mats) {
          if (!m.isMeshStandardMaterial || hookedMats.has(m)) continue;
          hookedMats.add(m);
          const mName = m.name || '';
          const isOpaline = Boolean(m.emissiveMap) || mName.includes('opaline');
          const isDoorGap = mName.includes('door_gap');
          const isDoorLeaf = mName.includes('door_leaf');
          const isDoorCasing = mName.includes('door_casing');

          if (isDoorGap) {
            m.color.setRGB(0.015, 0.011, 0.008);
            m.roughness = 0.98;
            m.metalness = 0.0;
            m.envMapIntensity = 0.05;
            m.needsUpdate = true;
            continue;
          }

          if (isDoorLeaf) {
            doorLeafMatRef = m;
            if (doorNormTex) {
              m.normalMap = doorNormTex;
              m.normalScale.set(1.45, 1.45);
            }
            if (doorRoughTex) {
              m.roughnessMap = doorRoughTex;
            }
            m.envMapIntensity = 0.62;
          } else if (isDoorCasing) {
            doorCasingMatRef = m;
            if (trimNR) {
              m.normalMap = trimNR;
              m.normalScale.set(0.55, 0.55);
            }
            m.roughness = 0.38;
            m.envMapIntensity = 0.62;
          }

          if (!isOpaline) {
            if (!isDoorLeaf && !isDoorCasing) {
              m.color.setRGB(0.92, 0.90, 0.87);
              m.envMapIntensity = 0.58;
            }
            const aoExpr = isDoorLeaf
              ? 'mix(vec3(0.86, 0.84, 0.81), vec3(1.0), clamp(vColor.rgb, 0.0, 1.0))'
              : 'pow(clamp(vColor.rgb, 0.18, 1.0), vec3(1.28))';
            m.onBeforeCompile = sh => {
              sh.uniforms.uSunDir     = SHARED_UNIFORMS.uSunDir;
              sh.uniforms.uTime       = SHARED_UNIFORMS.uTime;
              sh.uniforms.uShadowMode = SHARED_UNIFORMS.uShadowMode;
              sh.uniforms.uWindowMode = SHARED_UNIFORMS.uWindowMode;
              sh.vertexShader = sh.vertexShader
                .replace('#include <common>', '#include <common>\nvarying vec3 vPropCorP;\nvarying vec3 vPropCorN;')
                .replace('#include <worldpos_vertex>', `
                  #include <worldpos_vertex>
                  vec4 pwProp = modelMatrix * vec4(transformed, 1.0);
                  vPropCorP = vec3(pwProp.x, pwProp.y, -pwProp.z);
                  vec3 nwProp = normalize(mat3(modelMatrix) * objectNormal);
                  vPropCorN = vec3(nwProp.x, nwProp.y, -nwProp.z);
                `);
              sh.fragmentShader = sh.fragmentShader
                .replace('#include <common>', `
                  #include <common>
                  uniform vec3 uSunDir;
                  uniform float uTime;
                  uniform int uShadowMode;
                  uniform int uWindowMode;
                  varying vec3 vPropCorP;
                  varying vec3 vPropCorN;
                `)
                .replace('#include <color_fragment>', `
                  #include <color_fragment>
                  #if defined( USE_COLOR_ALPHA ) || defined( USE_COLOR )
                    if (uShadowMode == 0) {
                      diffuseColor.rgb /= max(vColor.rgb, vec3(0.18));
                    } else {
                      diffuseColor.rgb *= (${aoExpr});
                    }
                  #endif
                  // Directional window-portal grazing on vertical fluted door casings & radiator columns even in shade!
                  if (uShadowMode > 0 && vPropCorP.z < 19.5) {
                    diffuseColor.rgb *= clamp(1.0 + vPropCorN.z * 0.16, 0.82, 1.16);
                  }
                  // Razor-crisp backlit sash mullions & fanlight bars on the arched window!
                  if (uWindowMode > 0 && vPropCorP.z > 20.42 && vPropCorP.y > 0.72) {
                    float backlitBar = smoothstep(-0.15, -0.65, vPropCorN.z);
                    float bevelRim   = smoothstep(0.35, 0.85, abs(vPropCorN.x) + abs(vPropCorN.y) * 0.5);
                    diffuseColor.rgb *= mix(1.0, 0.46, backlitBar);
                    diffuseColor.rgb += vec3(0.18, 0.17, 0.14) * bevelRim * (1.0 - backlitBar * 0.5);
                  }
                `)
                .replace('#include <lights_fragment_end>', `
                  #include <lights_fragment_end>
                  if (uShadowMode > 0 && vPropCorP.z < 20.55) {
                    // Trace corridor arched window + Komorebi leaf dapple directly ON radiators, doors & sconces!
                    float lzP = max(0.08, uSunDir.z);
                    float tWinP = (20.72 - vPropCorP.z) / lzP;
                    float rRakeP = (vPropCorP.x > 0.4 && -uSunDir.x > 0.03) ? 1.0 : 0.0;
                    float tEffYP = mix(tWinP, min(tWinP, 4.55 + vPropCorP.z * 0.14), rRakeP);
                    vec2 wHitP = vec2(vPropCorP.x + uSunDir.x * tWinP, vPropCorP.y + uSunDir.y * tEffYP);
                    bool inWinP = wHitP.y >= 0.78 && (wHitP.y <= 2.33 ? abs(wHitP.x) <= 0.72 : length(vec2(wHitP.x, wHitP.y - 2.33)) <= 0.72);
                    bool inArchP = true;
                    if (vPropCorP.z < 17.0) {
                      float tAP = (17.0 - vPropCorP.z) / lzP;
                      float tAYP = mix(tAP, min(tAP, 3.6 + vPropCorP.z * 0.10), rRakeP);
                      inArchP = abs(vPropCorP.x + uSunDir.x * tAP) <= 0.87 && (vPropCorP.y + uSunDir.y * tAYP) <= 3.30;
                    }
                    if (inWinP && inArchP) {
                      float barBlk = (abs(wHitP.y - 2.33) < 0.028 || (wHitP.y < 2.33 && (abs(wHitP.y - 1.55) < 0.024 || abs(abs(wHitP.x) - 0.24) < 0.015))) ? 0.18 : 1.0;
                      float leafWave = 0.5 + 0.5 * sin(wHitP.x * 7.5 + sin(wHitP.y * 5.2 + uTime * 0.95) * 2.1 + uTime * 0.7);
                      float dapple = smoothstep(0.24, 0.72, leafWave) * barBlk;
                      float ndlP = max(0.0, dot(normalize(vPropCorN), uSunDir));
                      reflectedLight.directDiffuse += diffuseColor.rgb * vec3(1.0, 0.91, 0.74) * (dapple * (ndlP * 1.65 + 0.22));
                    }
                  }
                `);
            };
            m.needsUpdate = true;
          }
        }
      });

      await applyDoorStyle(activeDoorStyle);

      const templates = {};
      for (const key of ['door_6panel', 'window_fanlight', 'sconce_brass', 'radiator_cast_iron', 'switch_brass']) {
        const found = propsGltf.scene.getObjectByName(key);
        if (found) templates[key] = found;
      }

      while (archPropsGroup.children.length > 0) archPropsGroup.remove(archPropsGroup.children[0]);
      archPropCounts = { doors: 0, window: 0, sconces: 0, radiators: 0, switches: 0 };

      // Helper to resolve placement entry into Three.js `(px, py, pz)` & `rotY`
      const applyPlacement = (inst, item, propType) => {
        inst.position.set(0, 0, 0);
        inst.rotation.set(0, 0, 0);
        inst.scale.set(1, 1, 1);

        const posArr = item.world_pos || item.position_three || item.pos;
        if (Array.isArray(posArr) && posArr.length === 3) {
          inst.position.set(posArr[0], posArr[1], posArr[2]);
        } else {
          const s = item.s ?? 0;
          const y = item.y ?? 0;
          const wall = item.wall || 'R';
          const isVest = s > H.vS;
          const halfW = isVest ? H.vHalf : H.W * 0.5;
          let x = item.x;
          if (x === undefined) {
            if (wall === 'L') x = -halfW;
            else if (wall === 'R') x = halfW;
            else x = 0;
          }
          inst.position.set(x, y, -s);
        }

        if (item.rot_y_rad !== undefined) {
          inst.rotation.y = item.rot_y_rad;
        } else if (item.rot_y_deg !== undefined) {
          inst.rotation.y = THREE.MathUtils.degToRad(item.rot_y_deg);
        } else if (item.yaw_deg !== undefined) {
          inst.rotation.y = THREE.MathUtils.degToRad(item.yaw_deg);
        } else if (Array.isArray(item.rot) && item.rot.length === 3) {
          inst.rotation.set(item.rot[0], item.rot[1], item.rot[2]);
        } else if (item.wall) {
          if (item.wall === 'L') inst.rotation.y = Math.PI / 2;
          else if (item.wall === 'R') inst.rotation.y = -Math.PI / 2;
          else if (item.wall === 'W') inst.rotation.y = 0;
        }

        if (item.scale !== undefined) {
          if (Array.isArray(item.scale)) inst.scale.set(item.scale[0], item.scale[1], item.scale[2]);
          else inst.scale.setScalar(item.scale);
        }
        archPropsGroup.add(inst);

        if (propType === 'door_6panel') archPropCounts.doors++;
        else if (propType === 'window_fanlight') archPropCounts.window++;
        else if (propType === 'sconce_brass') archPropCounts.sconces++;
        else if (propType === 'radiator_cast_iron') archPropCounts.radiators++;
        else if (propType === 'switch_brass') archPropCounts.switches++;
      };

      const sconceUniformItems = [];

      const rawInstances = Array.isArray(layout.instances)
        ? layout.instances
        : (Array.isArray(layout.placements) ? layout.placements : null);

      if (rawInstances) {
        for (const it of rawInstances) {
          const pType = it.prop || it.type || it.model || it.object;
          const tpl = templates[pType];
          if (!tpl) continue;
          const inst = tpl.clone(true);
          applyPlacement(inst, it, pType);
          if (pType === 'sconce_brass') sconceUniformItems.push({ item: it, worldPos: inst.position.clone() });
        }
      } else {
        const winArr = layout.windows || (layout.window ? (Array.isArray(layout.window) ? layout.window : [layout.window]) : layout.window_fanlight);
        const groupMap = [
          ['door_6panel',        layout.doors || layout.door_6panel],
          ['window_fanlight',    winArr],
          ['sconce_brass',       layout.sconces || layout.sconce_brass],
          ['radiator_cast_iron', layout.radiators || layout.radiator_cast_iron],
          ['switch_brass',       layout.switches || layout.switch_brass],
        ];
        for (const [pType, arr] of groupMap) {
          if (!Array.isArray(arr) || !templates[pType]) continue;
          for (const it of arr) {
            const inst = templates[pType].clone(true);
            applyPlacement(inst, it, pType);
            if (pType === 'sconce_brass') sconceUniformItems.push({ item: it, worldPos: inst.position.clone() });
          }
        }
      }

      if (archPropCounts.doors > 0) {
        proceduralDoorsGroup.visible = false;
      }
      if (archPropCounts.window > 0) {
        SHARED_UNIFORMS.uHas3DWindow.value = 1.0;
      }

      if (sconceUniformItems.length > 0) {
        const count = Math.min(12, sconceUniformItems.length);
        SHARED_UNIFORMS.uSconceCount.value = count;
        for (let i = 0; i < 12; i++) {
          if (i < count) {
            const { item, worldPos } = sconceUniformItems[i];
            if (Array.isArray(item.light_corridor_P) && item.light_corridor_P.length === 3) {
              const [bx, by, bs] = item.light_corridor_P;
              const rad = Math.max(item.light_radius_m || 2.15, 2.20);
              SHARED_UNIFORMS.uSconces.value[i].set(bx, by, bs, rad);
            } else {
              const sCoord = item.s !== undefined ? item.s : -worldPos.z;
              const yCoord = item.light_y !== undefined ? item.light_y : (item.y !== undefined ? item.y : worldPos.y);
              const signWall = worldPos.x >= 0 ? 1 : -1;
              const xBulb = item.light_x !== undefined ? item.light_x : (signWall * (Math.abs(worldPos.x) - 0.135));
              const rad = item.light_radius_m || item.light_radius || 2.25;
              SHARED_UNIFORMS.uSconces.value[i].set(xBulb, yCoord, sCoord, rad);
            }
          } else {
            SHARED_UNIFORMS.uSconces.value[i].set(0, -10, -50, 0.1);
          }
        }
      }

      archKitLoaded = true;
      return true;
    } catch (err) {
      return false;
    }
  }

  tryLoadCyclesLightmaps();
  tryLoadArchKit();

  /* =========================================================================
   * 9. HANG ALL 30 CURATED HANG A2 ARTWORKS + SUBTLE MUSEUM WALL-LABEL PLAQUES
   * ========================================================================= */
  function makeSoftShadowTex() {
    const cv = document.createElement('canvas');
    cv.width = 128; cv.height = 128;
    const ctx = cv.getContext('2d');
    ctx.clearRect(0, 0, 128, 128);
    ctx.fillStyle = 'rgba(22, 18, 13, 0.42)';
    ctx.filter = 'blur(10px)';
    ctx.fillRect(18, 20, 92, 92);
    const t = new THREE.CanvasTexture(cv);
    t.colorSpace = THREE.SRGBColorSpace;
    return t;
  }
  const frameDropShadowMat = new THREE.MeshBasicMaterial({
    map: makeSoftShadowTex(),
    transparent: true,
    depthWrite: false,
    opacity: 0.72,
  });

  function makePlaceholderMatTexture(wPx, hPx) {
    const cv = document.createElement('canvas');
    cv.width = 384;
    cv.height = Math.max(256, Math.round(384 * (hPx / Math.max(1, wPx))));
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#f8f5ed';
    ctx.fillRect(0, 0, cv.width, cv.height);
    const pad = Math.round(Math.min(cv.width, cv.height) * 0.14);
    ctx.strokeStyle = '#d5ccb9';
    ctx.lineWidth = 3;
    ctx.strokeRect(pad, pad, cv.width - 2 * pad, cv.height - 2 * pad);
    ctx.fillStyle = '#efeae0';
    ctx.fillRect(pad + 3, pad + 3, cv.width - 2 * pad - 6, cv.height - 2 * pad - 6);
    return configureShaderSRGBTex(new THREE.CanvasTexture(cv));
  }

  // Subtle Museum Wall-Label Plaque (`7.5 × 4.8 cm` warm cotton card + tiny factual artist/medium lines)
  function makeMuseumWallLabelTex(seed = 0) {
    const cv = document.createElement('canvas');
    cv.width = 240; cv.height = 154;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#f7f3ea';
    ctx.fillRect(0, 0, 240, 154);
    ctx.strokeStyle = '#dcd3c2';
    ctx.lineWidth = 3;
    ctx.strokeRect(2, 2, 236, 150);
    // Artist name bar (Luis Medina) + italic title line + medium ("Oil on canvas")
    ctx.fillStyle = '#26221d';
    ctx.fillRect(22, 26, 98 + (seed % 3) * 14, 7);
    ctx.fillStyle = '#4a433a';
    ctx.fillRect(22, 44, 136 - (seed % 2) * 18, 5);
    ctx.fillStyle = '#7c7366';
    ctx.fillRect(22, 66, 84, 4);
    ctx.fillRect(22, 78, 168, 3.5);
    ctx.fillRect(22, 88, 152, 3.5);
    ctx.fillRect(22, 98, 114, 3.5);
    return configureShaderSRGBTex(new THREE.CanvasTexture(cv));
  }

  function loadImgAsync(url) {
    loadedAssetUrls.push(url);
    return new Promise((resolve, reject) => {
      const im = new Image();
      im.onload = () => resolve(im);
      im.onerror = reject;
      im.src = url;
    });
  }

  const matGalleryBlack  = makeSurfMat(13, { uSolidTint: { value: new THREE.Color('#1c1a17') } });
  const matRabbetLinen   = makeSurfMat(13, { uSolidTint: { value: new THREE.Color('#cbbd9f') } });
  const matGalleryWalnut = makeSurfMat(13, { uSolidTint: { value: new THREE.Color('#27231e') } });
  const matArchivalCream = makeSurfMat(13, { uSolidTint: { value: new THREE.Color('#faf7f0') } });
  const matFloatBacking  = makeSurfMat(13, { uSolidTint: { value: new THREE.Color('#dbd2c2') } });

  function build3DMuseumFrame(group, w, h, kind) {
    const padSh = kind === 'photo' ? 0.046 : 0.062;
    const shQuad = new THREE.Mesh(new THREE.PlaneGeometry(w + padSh * 2, h + padSh * 2), frameDropShadowMat);
    shQuad.position.set(0, -0.008, 0.0015);
    group.add(shQuad);
    frameShadowQuads.push(shQuad);

    if (kind === 'painting') {
      const depth = 0.034, fw = 0.022, lip = 0.004;
      const outerW = w + (fw + lip) * 2, outerH = h + (fw + lip) * 2;
      const addBar = (bw, bh, bd, px, py, pz, mat) => {
        const m = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, bd), mat);
        m.position.set(px, py, pz);
        group.add(m);
      };
      addBar(outerW, fw, depth, 0,  (h * 0.5 + lip + fw * 0.5), depth * 0.5, matGalleryBlack);
      addBar(outerW, fw, depth, 0, -(h * 0.5 + lip + fw * 0.5), depth * 0.5, matGalleryBlack);
      addBar(fw, h + lip * 2, depth, -(w * 0.5 + lip + fw * 0.5), 0, depth * 0.5, matGalleryBlack);
      addBar(fw, h + lip * 2, depth,  (w * 0.5 + lip + fw * 0.5), 0, depth * 0.5, matGalleryBlack);
      addBar(w + lip * 2, h + lip * 2, depth * 0.72, 0, 0, depth * 0.36, matRabbetLinen);
      return { zFront: depth * 0.72 + 0.002, artScale: 1.0, outerW, outerH, depth };
    }

    if (kind === 'photo') {
      const fw = 0.011, matBorder = 0.022, depth = 0.022;
      const outerW = w + 0.012, outerH = h + 0.012;
      const addBar = (bw, bh, bd, px, py, pz, mat) => {
        const m = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, bd), mat);
        m.position.set(px, py, pz);
        group.add(m);
      };
      addBar(outerW, fw, depth, 0,  (outerH * 0.5 - fw * 0.5), depth * 0.5, matGalleryWalnut);
      addBar(outerW, fw, depth, 0, -(outerH * 0.5 - fw * 0.5), depth * 0.5, matGalleryWalnut);
      addBar(fw, outerH - fw * 2, depth, -(outerW * 0.5 - fw * 0.5), 0, depth * 0.5, matGalleryWalnut);
      addBar(fw, outerH - fw * 2, depth,  (outerW * 0.5 - fw * 0.5), 0, depth * 0.5, matGalleryWalnut);
      addBar(outerW - fw * 1.8, outerH - fw * 1.8, depth * 0.74, 0, 0, depth * 0.37, matArchivalCream);
      const innerScale = Math.max(0.76, (w - matBorder * 2) / w);
      return { zFront: depth * 0.74 + 0.002, artScale: innerScale, outerW, outerH, depth };
    }

    const depth = 0.022;
    const backing = new THREE.Mesh(new THREE.BoxGeometry(w - 0.006, h - 0.006, depth), matFloatBacking);
    backing.position.set(0, 0, depth * 0.5);
    group.add(backing);
    return { zFront: depth + 0.002, artScale: 1.0, outerW: w - 0.006, outerH: h - 0.006, depth };
  }

  // Hero Medina Paintings receiving 7.5 x 4.8 cm museum wall-label plaques mounted 10 cm beside the frame
  // (`localSideX`: +1 = right of artwork when facing it, -1 = left of artwork when facing it; verified 0 overlap!)
  const HERO_LABEL_SPEC = {
    '006': { localSideX: -1, yAlignFromBottom: 0.13, seed: 1 }, // s = 2.02m (between 006 and LIC, right in Crab Start view!)
    '087': { localSideX: -1, yAlignFromBottom: 0.13, seed: 2 }, // s = 13.77m, y = 1.83m (clear of sconce y=2.40 & switch y=1.18)
    '085': { localSideX: -1, yAlignFromBottom: 0.13, seed: 3 }, // s = 13.77m, y = 0.61m
    '086': { localSideX: -1, yAlignFromBottom: 0.24, seed: 4 }, // s = 1.01m, y = 0.85m (100% clear of Wall L radiator @ s=3.615m!)
    '090': { localSideX: +1, yAlignFromBottom: 0.24, seed: 5 }, // s = 10.49m, y = 0.85m (visible on Opening turn & Landing!)
  };

  const mountedItems = [];
  const womenState = {};
  const livingState = {};

  for (const it of ACTIVE_HANG_ITEMS) {
    const meta = BY[it.id] || { w: 1650, h: 2200, src: `thumbs/${it.id}.jpg` };
    const h = it.w * (meta.h / meta.w);
    const k = kindOf(it.id);
    const isVest = it.s > H.vS;
    const wallHalf = isVest ? H.vHalf : H.W * 0.5;
    const signX = it.wall === 'L' ? -1 : 1;
    const rotY = it.wall === 'L' ? Math.PI / 2 : -Math.PI / 2;
    const inward = -signX;

    const itemGroup = new THREE.Group();
    itemGroup.position.set(signX * wallHalf + inward * 0.003, it.y, -it.s);
    itemGroup.rotation.y = rotY;
    scene.add(itemGroup);

    const { zFront, artScale, outerW, outerH, depth } = build3DMuseumFrame(itemGroup, it.w, h, k);
    if (SHARED_UNIFORMS.uFrameCount.value < MAX_SHADER_FRAMES) {
      const fi = SHARED_UNIFORMS.uFrameCount.value++;
      frameBoxesArray[fi].set(it.s - outerW * 0.5, it.s + outerW * 0.5, it.y - outerH * 0.5, it.y + outerH * 0.5);
      frameSideDepthArray[fi].set(signX, depth);
    }
    const artGeo = new THREE.PlaneGeometry(it.w * artScale, h * artScale);
    let artTex = null;
    let modeTag = 'live';
    const allowedNow = !PRIVACY_SAFE || PRIVACY_ALLOWED.has(it.id);

    const bestImgUrl = FULL_RES_IDS.has(it.id)
      ? (USE_OPT_WEIGHT ? `./opt/art/${it.id}.jpg` : `/Vanessa-Espin-website/concepts/herencia/assets/${it.id}.jpg`)
      : `../${meta.src}`;

    if (!allowedNow) {
      artTex = makePlaceholderMatTexture(meta.w || 3, meta.h || 4);
      modeTag = 'privacy_mat';
    } else if (it.id === '003' || it.id === '010') {
      const ek = EYEKIT.kits.gemini[it.id];
      const baseUrl = USE_OPT_WEIGHT ? `./opt/art/${it.id}.jpg` : `../lab/paintings/${it.id}.jpg`;
      loadedAssetUrls.push(baseUrl);
      artTex = configureShaderSRGBTex(texLoader.load(baseUrl));

      const [bx, by, bw, bh] = ek.box;
      const eyeW = it.w * (bw / ek.w), eyeH = h * (bh / ek.h);
      const eyeMat = makeSurfMat(14, { uArtTex: { value: whiteTex } });
      const eyeMesh = new THREE.Mesh(new THREE.PlaneGeometry(eyeW, eyeH), eyeMat);
      eyeMesh.position.set(-it.w * 0.5 + ((bx + bw * 0.5) / ek.w) * it.w, h * 0.5 - ((by + bh * 0.5) / ek.h) * h, zFront + 0.0014);
      eyeMesh.visible = false;
      itemGroup.add(eyeMesh);

      const patchMeshes = {};
      if (it.id === '003') {
        for (const pk of ['d1', 'd2', 'd4']) {
          const p = RELKIT.patches[pk];
          if (!p) continue;
          const pMat = makeSurfMat(14, { uArtTex: { value: whiteTex } });
          const pwM = it.w * (p.w / ek.w), phM = h * (p.h / ek.h);
          const pm = new THREE.Mesh(new THREE.PlaneGeometry(pwM, phM), pMat);
          pm.position.set(-it.w * 0.5 + ((p.x + p.w * 0.5) / ek.w) * it.w, h * 0.5 - ((p.y + p.h * 0.5) / ek.h) * h, zFront + 0.0007);
          pm.visible = false;
          itemGroup.add(pm);
          patchMeshes[pk] = pm;
        }
      }

      womenState[it.id] = {
        id: it.id, ek, baseUrl, eyeMesh, eyeUniform: eyeMat.uniforms.uArtTex, eyeTexs: [null],
        patchMeshes, drawnEye: 0, drawnPatchMask: 0, ready: false,
      };
      modeTag = 'eyes';
    } else if (LIVING_SPEC[it.id]) {
      loadedAssetUrls.push(bestImgUrl);
      const staticFullTex = configureShaderSRGBTex(texLoader.load(bestImgUrl, t => {
        if (USE_OPT_WEIGHT) {
          t.generateMipmaps = false;
          t.minFilter = THREE.LinearFilter;
          t.magFilter = THREE.LinearFilter;
          t.needsUpdate = true;
        }
      }));
      artTex = staticFullTex;

      livingState[it.id] = {
        id: it.id, s: it.s, wM: it.w, hM: h, zFront, itemGroup,
        strength: LIVING_SPEC[it.id],
        phaseOffset: LIVING_PHASE_OFFSET[it.id] || 0,
        subMesh: null, cellUniform: null,
        drawnFrame: -2, ready: false,
      };
      modeTag = 'living';
    } else if (meta.video) {
      const vid = document.createElement('video');
      vid.src = meta.video;
      vid.muted = true;
      vid.loop = true;
      vid.playsInline = true;
      vid.autoplay = true;
      vid.play().catch(() => {});
      loadedAssetUrls.push(meta.video);
      artTex = new THREE.VideoTexture(vid);
      artTex.colorSpace = THREE.NoColorSpace;
      modeTag = 'video';
    } else {
      loadedAssetUrls.push(bestImgUrl);
      artTex = configureShaderSRGBTex(texLoader.load(bestImgUrl));
      modeTag = 'live';
    }

    const artMat = makeSurfMat(12, { uArtTex: { value: artTex } });
    const artMesh = new THREE.Mesh(artGeo, artMat);
    artMesh.position.z = zFront;
    itemGroup.add(artMesh);

    // Mount 7.5 x 4.8 cm Museum Wall-Label Plaque 10 cm beside the 5 hero Medina paintings!
    const lblSpec = HERO_LABEL_SPEC[it.id];
    if (lblSpec) {
      const plW = 0.075, plH = 0.048, plD = 0.0035;
      const lx = lblSpec.localSideX * (outerW * 0.5 + 0.10 + plW * 0.5);
      const ly = -outerH * 0.5 + lblSpec.yAlignFromBottom + plH * 0.5;
      const plBacking = new THREE.Mesh(new THREE.BoxGeometry(plW, plH, plD), matArchivalCream);
      plBacking.position.set(lx, ly, plD * 0.5);
      const plFaceMat = makeSurfMat(17, { uArtTex: { value: makeMuseumWallLabelTex(lblSpec.seed) } });
      const plFace = new THREE.Mesh(new THREE.PlaneGeometry(plW, plH), plFaceMat);
      plFace.position.set(lx, ly, plD + 0.0008);
      itemGroup.add(plBacking, plFace);
    }

    mountedItems.push({ id: it.id, wall: it.wall, s: it.s, y: it.y, w: it.w, h: +h.toFixed(3), kind: k, mode: modeTag });
  }

  async function initWomenPlates() {
    for (const id of ['003', '010']) {
      const ws = womenState[id];
      if (!ws) continue;
      try {
        const eyeUrl = USE_OPT_WEIGHT
          ? `./opt/kits/${ws.ek.img.replace(/\.png$/i, '.webp')}`
          : `../lab/kit-eyes/${ws.ek.img}`;
        const [baseImg, eyeImg] = await Promise.all([
          loadImgAsync(ws.baseUrl),
          loadImgAsync(eyeUrl),
        ]);
        const [bx, by, bw, bh] = ws.ek.box;
        for (let k = 1; k <= 6; k++) {
          const scv = document.createElement('canvas');
          scv.width = bw; scv.height = bh;
          const sctx = scv.getContext('2d');
          sctx.drawImage(baseImg, bx, by, bw, bh, 0, 0, bw, bh);
          sctx.drawImage(eyeImg, 0, (k - 1) * bh, bw, bh, 0, 0, bw, bh);
          ws.eyeTexs[k] = configureShaderSRGBTex(new THREE.CanvasTexture(scv));
        }
        if (id === '003' && QS.get('birds') === '1') {
          for (const pk of ['d1', 'd2', 'd4']) {
            const p = RELKIT.patches[pk];
            const pm = ws.patchMeshes[pk];
            if (!p || !pm) continue;
            const relUrl = USE_OPT_WEIGHT
              ? `./opt/kits/${p.img.replace(/\.png$/i, '.webp')}`
              : `../lab/kit-release/${p.img}`;
            const pImg = await loadImgAsync(relUrl);
            const pcv = document.createElement('canvas');
            pcv.width = p.w; pcv.height = p.h;
            const pctx = pcv.getContext('2d');
            pctx.drawImage(baseImg, p.x, p.y, p.w, p.h, 0, 0, p.w, p.h);
            pctx.drawImage(pImg, 0, 0, p.w, p.h);
            pm.material.uniforms.uArtTex.value = configureShaderSRGBTex(new THREE.CanvasTexture(pcv));
          }
        }
        ws.ready = true;
        redrawWomanCanvas(ws, 0, 0);
      } catch (e) {
        console.warn('Eyes plate load issue:', id, e);
      }
    }
  }

  function redrawWomanCanvas(ws, eyeIdx, patchMask) {
    if (!ws || !ws.ready) return;
    if (ws.drawnEye !== eyeIdx) {
      ws.drawnEye = eyeIdx;
      if (eyeIdx > 0 && ws.eyeTexs[eyeIdx]) {
        ws.eyeUniform.value = ws.eyeTexs[eyeIdx];
        ws.eyeMesh.visible = true;
      } else {
        ws.eyeMesh.visible = false;
      }
    }
    if (ws.id === '003' && ws.drawnPatchMask !== patchMask) {
      ws.drawnPatchMask = patchMask;
      const pOrder = ['d1', 'd2', 'd4'];
      for (let bit = 0; bit < pOrder.length; bit++) {
        const pm = ws.patchMeshes[pOrder[bit]];
        if (pm) pm.visible = Boolean(patchMask & (1 << bit));
      }
    }
  }

  async function initLivingPaintings() {
    const baseDir = '/Vanessa-Espin-website/gemini-blender-rigs/herencia-elements-2/4-living-paintings';
    await Promise.all(Object.values(livingState).map(async ls => {

        const subMesh = new THREE.Mesh(new THREE.PlaneGeometry(subW, subH), subMat);
        subMesh.position.set(
          -ls.wM * 0.5 + ((bx + bw * 0.5) / Wweb) * ls.wM,
           ls.hM * 0.5 - ((by + bh * 0.5) / Hweb) * ls.hM,
          ls.zFront + 0.0012

        ls.ready = true;
